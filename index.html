        panel('⚙️','طَارِق',['சாலிமின் மகன் → பொறியியல் பீடம்','Sālim\'s son → faculty of engineering','සාලිම්ගේ පුතා → ඉංජිනේරු පීඨය'],'كُلِّيَّةُ الهَنْدَسَةِ',['உயர்தரத்தில் "மிகச் சிறப்பு"','"excellent" in secondary school','උසස් පෙළේ "විශිෂ්ට"'])+
        panel('📖','أَحْمَد',['முபாரக்கின் மகன் → அரபு மொழித் துறை','Mubārak\'s son → Arabic department','මුබාරක්ගේ පුතා → අරාබි භාෂා අංශය'],'قِسْمُ اللُّغَةِ العَرَبِيَّةِ',['மருத்துவம் வேண்டாம், அரபு வேண்டும்','not medicine: Arabic','වෛද්‍යය නොවේ: අරාබි'])+
      '</div>'+
      '<div class="chat">'+
        MU('زُرْتُكَ <mark>أَمْسِ</mark> فِي البَيْتِ، وَلَمْ أَجِدْكَ.',['நேற்று உங்கள் வீட்டுக்கு வந்தேன்; நீங்கள் இல்லை.','I visited you at home yesterday, and did not find you in.','ඊයේ මම ඔයාගේ ගෙදර ආවා; ඔයා හිටියේ නැහැ.'])+
        SA('ذَهَبْتُ مَعَ ابْنِي طَارِقٍ إِلَى الجَامِعَةِ؛ <mark>لِيُقَدِّمَ أَوْرَاقَهُ</mark> إِلَى كُلِّيَّةِ الهَنْدَسَةِ.',['என் மகன் தாரிக்குடன் பல்கலைக்கழகத்துக்குப் போனேன்; பொறியியல் பீடத்துக்கு அவன் ஆவணங்களைச் சமர்ப்பிப்பதற்காக.','I went with my son Ṭāriq to the university, so that he could hand in his documents to the faculty of engineering.','මම මගේ පුතා තාරික් එක්ක විශ්වවිද්‍යාලයට ගියා; ඔහුගේ ලියකියවිලි ඉංජිනේරු පීඨයට භාර දෙන්න.'])+
        MU('<mark>سَيُقْبَلُ</mark> طَارِقٌ فِي كُلِّيَّةِ الهَنْدَسَةِ، إِنْ شَاءَ اللّٰهُ؛ فَتَقْدِيرُهُ «مُمْتَازٌ» فِي الثَّانَوِيَّةِ.',['இன் ஷா அல்லாஹ், தாரிக் பொறியியல் பீடத்தில் ஏற்றுக்கொள்ளப்படுவான்; உயர்தரத்தில் அவனது தரம் "மிகச் சிறப்பு".','Ṭāriq will be accepted into the faculty of engineering, in shāʾ Allāh: his grade in secondary school is "excellent".','ඉන්ෂා අල්ලාහ්, තාරික්ව ඉංජිනේරු පීඨයට ගනීවි; උසස් පෙළේ ඔහුගේ ශ්‍රේණිය "විශිෂ්ට".'])+
        SA('هَلْ قَدَّمَ ابْنُكَ أَوْرَاقَهُ إِلَى كُلِّيَّةِ الطِّبِّ؟',['உங்கள் மகன் மருத்துவ பீடத்துக்கு ஆவணங்களைச் சமர்ப்பித்தானா?','Did your son hand in his documents to the faculty of medicine?','ඔයාගේ පුතා වෛද්‍ය පීඨයට ලියකියවිලි භාර දුන්නද?'])+
        MU('لَا، لَمْ يُقَدِّمْ أَوْرَاقَهُ إِلَى كُلِّيَّةِ الطِّبِّ؛ إِنَّهُ <mark>لَا يَرْغَبُ فِي</mark> دِرَاسَةِ الطِّبِّ.',['இல்லை, மருத்துவ பீடத்துக்குச் சமர்ப்பிக்கவில்லை; அவனுக்கு மருத்துவம் படிக்க விருப்பம் இல்லை.','No, he did not hand them in to the faculty of medicine; he does not want to study medicine.','නැහැ, ඔහු වෛද්‍ය පීඨයට භාර දුන්නේ නැහැ; ඔහුට වෛද්‍ය විද්‍යාව හදාරන්න කැමැත්තක් නැහැ.'])+
        SA('لَا يَرْغَبُ فِي دِرَاسَةِ الطِّبِّ! لَقَدْ <mark>حَصَلَ عَلَى</mark> تَقْدِيرِ «مُمْتَازٍ» فِي العُلُومِ الطَّبِيعِيَّةِ.',['மருத்துவம் படிக்க விருப்பம் இல்லையா! இயற்கை விஞ்ஞானங்களில் அவன் "மிகச் சிறப்பு" பெற்றானே.','He does not want to study medicine! He got "excellent" in the natural sciences.','වෛද්‍ය විද්‍යාව හදාරන්න කැමති නැද්ද! ඔහු ස්වභාව විද්‍යාවට "විශිෂ්ට" ලබා ගත්තා නේද.'])+
        MU('هٰذَا صَحِيحٌ، وَلٰكِنَّهُ يَرْغَبُ فِي <mark>الِالْتِحَاقِ بِـ</mark>قِسْمِ اللُّغَةِ العَرَبِيَّةِ. أَحْمَدُ يُحِبُّ دِرَاسَةَ اللُّغَةِ العَرَبِيَّةِ.',['அது உண்மைதான்; ஆனால் அவன் அரபு மொழித் துறையில் சேர விரும்புகிறான். அஹ்மதுக்கு அரபு மொழி படிப்பது பிடிக்கும்.','That is true, but he wants to join the Arabic language department. Aḥmad loves studying Arabic.','ඒක ඇත්ත; නමුත් ඔහු අරාබි භාෂා අංශයට බැඳෙන්න කැමතියි. අහ්මද් අරාබි භාෂාව ඉගෙන ගන්න ආසයි.'])+
        SA('<mark>لَا عَجَبَ</mark> فِي ذٰلِكَ؛ فَالعَرَبِيَّةُ لُغَةُ القُرْآنِ الكَرِيمِ، وَلٰكِنْ هَلْ سَيُقْبَلُ فِي قِسْمِ اللُّغَةِ العَرَبِيَّةِ؟',['அதில் ஆச்சரியமே இல்லை; அரபு புனித குர்ஆனின் மொழி. ஆனால் அவன் அரபு மொழித் துறையில் ஏற்றுக்கொள்ளப்படுவானா?','There is no surprise at all in that: Arabic is the language of the noble Qurʾān. But will he be accepted in the Arabic department?','ඒකේ කිසිම පුදුමයක් නැහැ; අරාබි භාෂාව ශුද්ධ කුර්ආනයේ භාෂාවයි. නමුත් ඔහුව අරාබි අංශයට ගනීවිද?'])+
        MU('قَابَلْتُ <mark>عَمِيدَ</mark> كُلِّيَّةِ الآدَابِ، وَدَرَسَ أَوْرَاقَهُ، وَ<mark>وَافَقَ عَلَى</mark> قَبُولِهِ.',['கலைப் பீடத்தின் பீடாதிபதியைச் சந்தித்தேன்; அவர் ஆவணங்களைப் பரிசீலித்து, அவனை ஏற்றுக்கொள்ளச் சம்மதித்தார்.','I met the dean of the faculty of arts; he examined his documents and agreed to accept him.','මම කලා පීඨයේ පීඨාධිපතිව හමු වුණා; ඔහු ලියකියවිලි පරීක්ෂා කරලා ඔහුව ගන්න එකඟ වුණා.'])+
        SA('<mark>وَفَّقَهُ اللّٰهُ</mark> فِي دِرَاسَةِ اللُّغَةِ العَرَبِيَّةِ.',['அரபு மொழி படிப்பில் அல்லாஹ் அவனுக்கு வெற்றி அளிப்பானாக.','May Allah grant him success in studying Arabic.','අරාබි භාෂා අධ්‍යාපනයේදී අල්ලාහ් ඔහුට සාර්ථකත්වය දෙත්වා.'])+
        MU('شُكْرًا لَكَ، وَوَفَّقَ اللّٰهُ ابْنَكَ فِي دِرَاسَةِ الهَنْدَسَةِ أَيْضًا.',['நன்றி; உங்கள் மகனுக்கும் பொறியியல் படிப்பில் அல்லாஹ் வெற்றி அளிப்பானாக.','Thank you, and may Allah grant your son success in studying engineering too.','ස්තුතියි; ඔබේ පුතාටත් ඉංජිනේරු අධ්‍යාපනයේදී අල්ලාහ් සාර්ථකත්වය දෙත්වා.'])+
      '</div>'+
      '<div class="duo">'+
        panel('📅','أَمْسِ',['நேற்று: முடிவு ஒருபோதும் மாறாது','yesterday: its ending never changes','ඊයේ: එහි අවසානය කිසිදා වෙනස් නොවේ'])+
        panel('📨','يُقْبَلُ',['ஏற்றுக்கொள்ளப்படுகிறான் (يَقْبَلُ = ஏற்றுக்கொள்கிறான்)','he is accepted (يَقْبَلُ = he accepts)','ඔහුව භාර ගනු ලැබේ (يَقْبَلُ = ඔහු භාර ගනී)'])+
      '</div>'},

    /* 2 — university words */
    {type:'html',title:['பல்கலைக்கழகச் சொற்கள்','University words','විශ්වවිද්‍යාල වචන'],
     intro:['பல்கலைக்கழகம் எப்படி அமைந்திருக்கிறது, தரங்கள், மற்றும் தங்கள் துணைச் சொல்லுடன் மட்டுமே வரும் வினைகள்.','How a university is built, the grades, and verbs that always come with their own little word.','විශ්වවිද්‍යාලයක ව්‍යුහය, ශ්‍රේණි, සහ සැමවිටම තමන්ගේම කුඩා වචනය සමඟ එන ක්‍රියා.'],
     html:'<div style="display:flex;flex-direction:column;align-items:center;gap:6px">'+
        WB('الجَامِعَة',['பல்கலைக்கழகம்','university','විශ්වවිද්‍යාලය'],'','🏛️')+'<span class="op" style="font-size:22px;color:var(--muted)">⬇</span>'+
        '<div class="eq">'+WB('كُلِّيَّة',['பீடம்','faculty','පීඨය'],'','🏢')+WB('عَمِيدُ الكُلِّيَّةِ',['பீடாதிபதி','dean','පීඨාධිපති'],'add','🧑‍💼')+'</div>'+'<span class="op" style="font-size:22px;color:var(--muted)">⬇</span>'+
        '<div class="eq">'+WB('قِسْم',['துறை','department','අංශය'],'','🗂️')+WB('رَئِيسُ القِسْمِ',['துறைத் தலைவர்','head of department','අංශ ප්‍රධානී'],'add','👩‍💼')+'</div>'+

      '<div class="callout"><h3>'+TE('துஆ: இறந்தகால வினை, ஆனால் ஒரு வேண்டுதல்','Duʿāʾ: a past-tense verb that makes a wish','දුආ: අතීත ක්‍රියාවක්, නමුත් ප්‍රාර්ථනාවක්')+'</h3>'+
        chips([['🤒','شَفَاكَ اللّٰهُ',['அல்லாஹ் உங்களுக்குச் சுகம் தருவானாக','may Allah cure you','අල්ලාහ් ඔබට සුවය දෙත්වා']],['🌿','بَارَكَ اللّٰهُ فِيكَ',['அல்லாஹ் உங்களுக்கு அருள் புரிவானாக','may Allah bless you','අල්ලාහ් ඔබට සෙත සලසත්වා']],['🎁','جَزَاكَ اللّٰهُ خَيْرًا',['அல்லாஹ் நற்கூலி தருவானாக','may Allah reward you','අල්ලාහ් යහපත දෙත්වා']],['🎯','وَفَّقَكَ اللّٰهُ',['அல்லாஹ் வெற்றி அளிப்பானாக','may Allah grant you success','අල්ලාහ් සාර්ථකත්වය දෙත්වා']]])+

    /* 4 — the five at a glance */
    {type:'html',title:['ஐந்து செயப்படுபொருள்கள்: ஒரு பார்வை','The five objects at a glance','කර්ම පහ: එක බැල්මකින්'],
     intro:['<span class="arw">المَفَاعِيلُ الخَمْسَةُ</span>: ஐந்தும் ஃபத்ஹா (நஸ்ப்) பெறுகின்றன. ஒவ்வொன்றும் வினையைப் பற்றி வேறு கேள்விக்குப் பதில் சொல்கிறது.','<span class="arw">المَفَاعِيلُ الخَمْسَةُ</span>: all five take the fatḥa (naṣb). Each one answers a different question about the verb.','<span class="arw">المَفَاعِيلُ الخَمْسَةُ</span>: පහම ෆත්හාව (නස්බ්) ගනී. එක් එක්කෙනා ක්‍රියාව ගැන වෙනස් ප්‍රශ්නයකට පිළිතුරු දෙයි.'],
     html:'<div class="duo">'+
        panel('🎯','المَفْعُولُ بِهِ',['எதை? யாரை? வினை விழும் பொருள்','what? whom? what the action lands on','කුමක්ද? කාවද? ක්‍රියාව වැටෙන දෙය'],'قَرَأْتُ <b>كِتَابًا</b>',['ஒரு புத்தகத்தை வாசித்தேன்','I read a book','මම පොතක් කියෙව්වා'],COL[1])+
        panel('🔁','المَفْعُولُ المُطْلَقُ',['எப்படி? எத்தனை முறை? அதே வினையின் பெயர்ச்சொல்','how? how many times? the verb\'s own noun','කොහොමද? කී වතාවක්ද? එම ක්‍රියාවේම නාම පදය'],'نَامَ <b>نَوْمًا عَمِيقًا</b>',['ஆழ்ந்து உறங்கினான்','he slept a deep sleep','ඔහු ගැඹුරු නින්දක් නිදාගත්තා'],COL[2])+
        panel('💡','المَفْعُولُ لِأَجْلِهِ',['ஏன்? காரணம்','why? the reason','ඇයි? හේතුව'],'وَقَفَ <b>احْتِرَامًا</b>',['மரியாதைக்காக எழுந்து நின்றான்','he stood up out of respect','ගෞරවය පිණිස නැගිට්ටා'],COL[3])+
        panel('⏰','المَفْعُولُ فِيهِ',['எப்போது? எங்கே? நேரம் அல்லது இடம்','when? where? time or place','කවදාද? කොහේද? කාලය හෝ ස්ථානය'],'سَافَرْتُ <b>لَيْلًا</b>',['இரவில் பயணம் செய்தேன்','I travelled at night','මම රාත්‍රියේ ගමන් කළා'],COL[4])+
        panel('🤝','المَفْعُولُ مَعَهُ',['எதனுடன்? உடன் இருப்பது','alongside what? what it happens with','කුමක් සමඟද? සමඟ ඇති දෙය'],'سِرْتُ <b>وَالشَّاطِئَ</b>',['கடற்கரையோடு நடந்தேன்','I walked along the shore','මම වෙරළ දිගේ ඇවිද්දා'],COL[5])+
      '</div>'+
      '<div class="callout"><h3>'+TE('பெயரே தடயம் தருகிறது','The name gives the clue','නමම ඉඟිය දෙයි')+'</h3><div class="eq">'+
        WB('بِهِ',['அதன் மீது','done to it','එයට'])+WB('فِيهِ',['அதில்','in it','එහි'])+WB('لِأَجْلِهِ',['அதற்காக','for its sake','එය නිසා'])+WB('مَعَهُ',['அதனுடன்','with it','එය සමඟ'])+WB('المُطْلَقُ',['கட்டற்றது','free: no little word','නිදහස්: කුඩා වචනයක් නැත'])+
      '</div>'+bi('"செயப்படுபொருள்" என்ற சாதாரணப் பொருளில் முதலாவது மட்டுமே. மற்ற நான்கும் அதன் பெயரையும் ஃபத்ஹாவையும் பகிர்ந்துகொள்கின்றன.','Only the first is an "object" in the everyday sense. The other four share its name and its fatḥa.','සාමාන්‍ය අර්ථයෙන් "කර්මය" වන්නේ පළමුවැන්න පමණි. අනෙක් හතර එහි නම සහ ෆත්හාව බෙදා ගනී.')+'</div>'},

    /* 5 — al-mafʿūl bihi: signs of naṣb and the five nouns */
    {type:'html',title:['<span class="arw">المَفْعُولُ بِهِ</span>: நஸ்பின் அடையாளங்கள்','<span class="arw">المَفْعُولُ بِهِ</span>: the signs of naṣb','<span class="arw">المَفْعُولُ بِهِ</span>: නස්බ් ලකුණු'],
     intro:['பாடம் 22: செயப்படுபொருள் எப்போதும் நஸ்ப். ஆனால் நஸ்பின் அடையாளம் சொல்லின் வகையைப் பொறுத்து மாறுகிறது.','Lesson 22: the object is always in naṣb. But the sign of naṣb changes with the kind of word.','22 වන පාඩම: කර්මය සැමවිටම නස්බ් වේ. නමුත් නස්බ් ලකුණ වචනයේ වර්ගය අනුව වෙනස් වේ.'],
     html:'<div class="dt-wrap"><table class="dt"><thead><tr><th>'+ONE('செயப்படுபொருள்','the object is…','කර්මය…')+'</th><th>'+ONE('உதாரணம்','example','උදාහරණය')+'</th><th>'+ONE('அடையாளம்','sign','ලකුණ')+'</th></tr></thead><tbody>'+
        srow(['ஒருமை','one','ඒකවචන'],'أُحِبُّ الوَطَنَ','ـَ')+
        srow(['இருமை','two','ද්විවචන'],'قَرَأْتُ قِصَّتَيْنِ','ـَيْنِ')+
        srow(['ஆண்பால் பன்மை','plural, -ūna type','පුරුෂ බහුවචන'],'إِنَّ اللّٰهَ يُحِبُّ المُحْسِنِينَ','ـِينَ')+
        srow(['பெண்பால் பன்மை: ஃபத்ஹா ஒருபோதும் இல்லை!','plural, -āt type: never a fatḥa!','ස්ත්‍රී බහුවචන: කිසිදා ෆත්හා නොවේ!'],'رَأَيْتُ الطَّالِبَاتِ','ـِ',1)+
        srow(['ஐந்து பெயர்கள்','the five nouns','නාම පහ'],'رَأَيْتُ أَبَاكَ','ـا')+
      '</tbody></table></div>'+
      '<div class="callout"><h3>'+TE('ஐந்து பெயர்கள்: நடு உயிர் மாறுகிறது','The five nouns: the long vowel changes','නාම පහ: දීර්ඝ ස්වරය වෙනස් වේ')+'</h3>'+
        '<div class="dt-wrap"><table class="dt"><thead><tr><th></th><th>'+ONE('எழுவாய்','doer','කර්තෘ')+'<br><span class="arw" lang="ar">رَفْع</span></th><th>'+ONE('செயப்படுபொருள்','object','කර්මය')+'<br><span class="arw" lang="ar">نَصْب</span></th><th>'+ONE('முன்னிடைக்குப் பின்','after a preposition','පූර්ව නිපාතයට පසු')+'<br><span class="arw" lang="ar">جَرّ</span></th></tr></thead><tbody>'+
          nrow(['தந்தை','father','පියා'],'أَبُو','أَبَا','أَبِي')+
          nrow(['சகோதரன்','brother','සහෝදරයා'],'أَخُو','أَخَا','أَخِي')+
          nrow(['வாய்','mouth','කට'],'فُو','فَا','فِي')+
          nrow(['உடையவர்','possessor of','හිමි'],'ذُو','ذَا','ذِي')+
          nrow(['கணவரின் உறவினர்','in-law','නෑදෑයා'],'حَمُو','حَمَا','حَمِي')+
        '</tbody></table></div>'+
      '</div>'+
      '<div class="exlist">'+
        rx('🚪','جَاءَ <mark>أَبُو</mark> عَمْرٍو.',['அபூ அம்ர் வந்தார் (எழுவாய்: <span class="arw">و</span>).','Abu ʿAmr came (the doer: <span class="arw">و</span>).','අබූ අම්ර් ආවා (කර්තෘ: <span class="arw">و</span>).'])+
        rx('👀','رَأَيْتُ <mark>أَبَا</mark> عَمْرٍو.',['அபூ அம்ரைப் பார்த்தேன் (செயப்படுபொருள்: <span class="arw">ا</span>).','I saw Abu ʿAmr (the object: <span class="arw">ا</span>).','මම අබූ අම්ර්ව දැක්කා (කර්මය: <span class="arw">ا</span>).'])+
        rx('➡️','ذَهَبْتُ إِلَى <mark>أَبِي</mark> عَمْرٍو.',['அபூ அம்ரிடம் போனேன் (முன்னிடைச் சொல்லுக்குப் பின்: <span class="arw">ي</span>).','I went to Abu ʿAmr (after a preposition: <span class="arw">ي</span>).','මම අබූ අම්ර් ළඟට ගියා (පූර්ව නිපාතයට පසු: <span class="arw">ي</span>).'])+
      '</div>'+
      '<div class="note-box">'+bi('தமிழும் முடிவை மாற்றுகிறது: அப்பா / அப்பாவை / அப்பாவிடம். அரபி உள்ளே உள்ள நீண்ட உயிரை மாற்றுகிறது: <span class="arw">و / ا / ي</span>. பாடநூலின் உதாரணம் <span class="arw">أَبُو بَكْرٍ</span>; 23-ஆம் புத்தகத்தின் <span class="arw">يَا أَبَا عَمْرٍو</span>-வும் இதே நஸ்ப்.','Tamil and Sinhala change the ending too (அப்பா / அப்பாவை, තාත්තා / තාත්තාව). Arabic changes the long vowel: <span class="arw">و / ا / ي</span>. The textbook\'s example is <span class="arw">أَبُو بَكْرٍ</span>, and the <span class="arw">يَا أَبَا عَمْرٍو</span> of booklet 23 is the same naṣb.','සිංහලයද අවසානය වෙනස් කරයි: තාත්තා / තාත්තාව / තාත්තාට. අරාබිය දීර්ඝ ස්වරය වෙනස් කරයි: <span class="arw">و / ا / ي</span>. පෙළපොතේ උදාහරණය <span class="arw">أَبُو بَكْرٍ</span>; 23 වන පොතේ <span class="arw">يَا أَبَا عَمْرٍو</span> ද මෙම නස්බ්මයි.')+'</div>'+
      '<div class="verse"><span class="arw" lang="ar">«الحَمْوُ المَوْتُ»</span>'+TE('கணவரின் (ஆண்) உறவினர் மரணம்: அவர்கள் மனைவியுடன் தனித்திருப்பதைப் பற்றிய கடுமையான எச்சரிக்கை.','"The in-law is death": a strong warning about the husband\'s male relatives being alone with the wife.','"නෑදෑයා මරණයයි": සැමියාගේ පිරිමි ඥාතීන් බිරිඳ සමඟ තනිව සිටීම ගැන දැඩි අනතුරු ඇඟවීමකි.','div')+'<small>صحيح البخاري ومسلم</small></div>'+
      '<div class="note-box">'+bi('இங்கே <span class="arw">ال</span> இருப்பதால் சாதாரண ழம்மா: <span class="arw">الحَمْوُ</span>. <span class="arw">و / ا / ي</span> முடிவுகள், சொல்லுக்குப் பின் வேறு பெயர்ச்சொல் அல்லது பிரதிப்பெயர் வரும்போதுதான் (<span class="arw">أَبُوهُ</span>, <span class="arw">ذُو مَالٍ</span>). <span class="arw">ذُو</span>-க்குப் பின் எப்போதும் ஒரு பெயர்ச்சொல் வரும்.','Here it has <span class="arw">ال</span>, so it takes an ordinary ḍamma: <span class="arw">الحَمْوُ</span>. The <span class="arw">و / ا / ي</span> endings come only when another noun or a pronoun follows (<span class="arw">أَبُوهُ</span>, <span class="arw">ذُو مَالٍ</span>). <span class="arw">ذُو</span> is always followed by a noun.','මෙහි <span class="arw">ال</span> ඇති නිසා සාමාන්‍ය ළම්මාවක්: <span class="arw">الحَمْوُ</span>. <span class="arw">و / ا / ي</span> අවසාන එන්නේ පසුව වෙනත් නාම පදයක් හෝ සර්වනාමයක් ආ විට පමණි (<span class="arw">أَبُوهُ</span>, <span class="arw">ذُو مَالٍ</span>). <span class="arw">ذُو</span> ට පසු සැමවිටම නාම පදයක් එයි.')+'</div>'},

    /* 6 — al-mafʿūl al-muṭlaq */
    {type:'html',title:['<span class="arw">المَفْعُولُ المُطْلَقُ</span>: வினை தன் பெயரைத் திரும்பச் சொல்கிறது','<span class="arw">المَفْعُولُ المُطْلَقُ</span>: the verb repeats its own noun','<span class="arw">المَفْعُولُ المُطْلَقُ</span>: ක්‍රියාව තම නාම පදය නැවත කියයි'],

          ['رَكَعَ المُصَلِّي <mark>رَكَعَاتٍ</mark>.',['தொழுபவர் பல ருகூஉகள் செய்தார்.','The worshipper bowed several times.','සලාතය කරන්නා කිහිප වතාවක් රුකූ කළා.']]])+

      '<div class="note-box">'+bi('தமிழிலும் இது உண்டு: "பாட்டுப் பாடினான்", "ஆட்டம் ஆடினான்". ஆங்கிலத்தில் "sing a song".','English does this too: "sing a song", "sleep a deep sleep". So do Tamil (பாட்டுப் பாடினான்) and Sinhala (නැටුමක් නැටුවා).','සිංහලයේද මෙය ඇත: "නැටුමක් නැටුවා". ඉංග්‍රීසියේ "sing a song".')+'</div>'+

        rx('🙇','وَقَفَ الطُّلَّابُ <mark>احْتِرَامًا</mark> لِلْمُعَلِّمِ.',['மாணவர்கள் ஆசிரியருக்கு மரியாதையாக எழுந்து நின்றார்கள்.','The students stood up out of respect for the teacher.','සිසුන් ගුරුවරයාට ගෞරවය පිණිස නැගිට්ටා.'])+
        rx('🚫','نَبْتَعِدُ عَنِ الشَّرِّ <mark>خَوْفًا</mark> مِنَ العِقَابِ.',['தண்டனைக்குப் பயந்து தீமையிலிருந்து விலகுகிறோம்.','We keep away from evil out of fear of punishment.','දඬුවමට බියෙන් අපි නපුරෙන් ඈත් වෙමු.'])+
        rx('🖼️','تُقَامُ المَعَارِضُ <mark>تَشْجِيعًا</mark> لِلْمَوْهُوبِينَ.',['திறமைசாலிகளை ஊக்குவிக்கக் கண்காட்சிகள் நடத்தப்படுகின்றன.','Exhibitions are held to encourage the talented.','දක්ෂයන් දිරිමත් කිරීමට ප්‍රදර්ශන පවත්වනු ලැබේ.'])+
        rx('✈️','يُسَافِرُ العَالِمُ <mark>طَلَبًا</mark> لِلْعِلْمِ.',['அறிஞர் அறிவைத் தேடிப் பயணம் செய்கிறார்.','The scholar travels in search of knowledge.','විද්වතා දැනුම සොයා ගමන් කරයි.'])+
        rx('🏥','زُرْتُ المَرِيضَ <mark>اطْمِئْنَانًا</mark> عَلَيْهِ.',['நோயாளியின் நலம் அறிந்து மனம் அமைதியடைய அவரைச் சந்தித்தேன்.','I visited the sick man to set my mind at rest about him.','ලෙඩාගේ සුවදුක් දැන සිත සනසා ගැනීමට මම ඔහුව බලන්න ගියා.'])+
        rx('🏭','يَبْنِي العُمَّالُ المَصَانِعَ <mark>رَغْبَةً</mark> فِي زِيَادَةِ الإِنْتَاجِ.',['உற்பத்தியைக் கூட்டும் விருப்பத்தில் தொழிலாளர்கள் தொழிற்சாலைகள் கட்டுகிறார்கள்.','Workers build factories wanting to raise production.','නිෂ්පාදනය වැඩි කිරීමේ කැමැත්තෙන් කම්කරුවෝ කම්හල් ඉදි කරති.'])+
        rx('🎓','تَغْتَرِبُ الطَّالِبَةُ <mark>ابْتِغَاءَ</mark> العِلْمِ.',['மாணவி அறிவைத் தேடி வெளிநாடு செல்கிறாள்.','The student goes abroad seeking knowledge.','ශිෂ්‍යාව දැනුම සොයා විදෙස් ගත වෙයි.'])+
      '</div>'+
      '<div class="callout"><h3>'+TE('இரண்டு வாக்கியங்களை ஒன்றாக்குதல்','Joining two sentences into one','වාක්‍ය දෙකක් එකක් කිරීම')+'</h3>'+
        join('يَنَامُ الطِّفْلُ مُبَكِّرًا','يُرِيدُ المُحَافَظَةَ عَلَى صِحَّتِهِ','يَنَامُ الطِّفْلُ مُبَكِّرًا <mark>مُحَافَظَةً</mark> عَلَى صِحَّتِهِ.',['குழந்தை தன் உடல்நலத்தைப் பாதுகாக்க நேரத்தோடு தூங்குகிறது.','The child sleeps early to look after his health.','දරුවා තම සෞඛ්‍යය රැකගැනීමට කලින් නිදාගනී.'])+
        join('يُكَرِّمُ المُعَلِّمُ المُتَفَوِّقِينَ','يُرِيدُ تَشْجِيعَهُمْ','يُكَرِّمُ المُعَلِّمُ المُتَفَوِّقِينَ <mark>تَشْجِيعًا</mark> لَهُمْ.',['சிறந்த மாணவர்களை ஊக்குவிக்க ஆசிரியர் அவர்களைக் கௌரவிக்கிறார்.','The teacher honours the top students to encourage them.','ඉහළම සිසුන් දිරිමත් කිරීමට ගුරුවරයා ඔවුන්ට ගෞරව කරයි.'])+
        join('أُكْثِرُ مِنَ القِرَاءَةِ','أُرِيدُ زِيَادَةَ المَعْرِفَةِ','أُكْثِرُ مِنَ القِرَاءَةِ <mark>حِرْصًا</mark> عَلَى زِيَادَةِ المَعْرِفَةِ.',['அறிவைக் கூட்டும் ஆர்வத்தில் நிறைய வாசிக்கிறேன்.','I read a lot, eager to increase my knowledge.','දැනුම වැඩි කරගැනීමේ උනන්දුවෙන් මම බොහෝ කියවමි.'])+
      '</div>'+
      '<div class="note-box">'+bi('தமிழ் இதற்கு "-க்காக" சேர்க்கிறது: மரியாதைக்காக, அறிவுக்காக.','Tamil adds -க்காக (மரியாதைக்காக), Sinhala uses පිණිස or -ෙන් (ගෞරවය පිණිස, බියෙන්). Arabic needs no extra word: just the fatḥa.','සිංහලයේ "පිණිස" හෝ "-ෙන්": ගෞරවය පිණිස, බියෙන්. අරාබියට අමතර වචනයක් අවශ්‍ය නැත: ෆත්හාව පමණයි.')+'</div>'},

    /* 8 — al-mafʿūl fīhi */
    {type:'html',title:['<span class="arw">المَفْعُولُ فِيهِ</span>: எப்போது? எங்கே?','<span class="arw">المَفْعُولُ فِيهِ</span>: when? where?','<span class="arw">المَفْعُولُ فِيهِ</span>: කවදාද? කොහේද?'],
     intro:['பாடம் 24: நேரம் அல்லது இடத்தைக் காட்டும் சொல், <span class="arw">فِي</span> மறைந்து ஃபத்ஹா மட்டும். இதன் இன்னொரு பெயர் <span class="arw">الظَّرْف</span>.','Lesson 24: a word of time or place, with the <span class="arw">فِي</span> dropped and a fatḥa instead. Its other name is <span class="arw">الظَّرْف</span>.','24 වන පාඩම: කාලය හෝ ස්ථානය පෙන්වන වචනයක්, <span class="arw">فِي</span> ඉවත් කර ෆත්හාවක් සමඟ. එහි අනෙක් නම <span class="arw">الظَّرْف</span>.'],
     html:'<div class="eq">'+WB('سَافَرْتُ فِي اللَّيْلِ',['இரவில் பயணம் செய்தேன்','I travelled in the night','මම රාත්‍රියේ ගමන් කළා'])+'<span class="op">=</span>'+WB('سَافَرْتُ لَيْلًا',['அதே பொருள்: فِي இல்லை, ஃபத்ஹா','the same: no فِي, a fatḥa','එකමයි: فِي නැත, ෆත්හාවක්'],'add')+'</div>'+
      '<div class="note-box">'+bi('சோதனை: முன்னால் <span class="arw">فِي</span> வைக்க முடியுமா? அது "எப்போது" அல்லது "எங்கே" என்று சொல்கிறதா? <span class="arw">سَافَرْتُ لَيْلًا</span> = "இரவில் பயணம் செய்தேன்", "இரவைப் பயணம் செய்தேன்" அல்ல.','The test: could <span class="arw">فِي</span> go in front, and does it say when or where? <span class="arw">سَافَرْتُ لَيْلًا</span> is "I travelled at night", not "I travelled the night". English drops "on" in the same way: "see you Friday".','පරීක්ෂාව: ඉදිරියෙන් <span class="arw">فِي</span> තැබිය හැකිද? එය "කවදාද" හෝ "කොහේද" කියයිද? <span class="arw">سَافَرْتُ لَيْلًا</span> = "මම රාත්‍රියේ ගමන් කළා".')+'</div>'+
      '<div class="callout"><h3>'+TE('நேரம்: <span class="arw">ظَرْفُ زَمَانٍ</span>','Time: <span class="arw">ظَرْفُ زَمَانٍ</span>','කාලය: <span class="arw">ظَرْفُ زَمَانٍ</span>')+'</h3>'+
        chips([['🌅','صَبَاحًا',['காலையில்','in the morning','උදේ']],['🌤️','عَصْرًا',['பிற்பகலில்','in the afternoon','හවස් වරුවේ']],['🌆','مَسَاءً',['மாலையில்','in the evening','සවස']],['🌙','لَيْلًا',['இரவில்','at night','රාත්‍රියේ']],['🌃','اللَّيْلَةَ',['இன்றிரவு','tonight','අද රෑ']],['🌧️','شِتَاءً',['குளிர்காலத்தில்','in winter','ශීත කාලයේ']],['⚡','لَحْظَةً',['ஒரு கணம்','for a moment','මොහොතකට']],['⏱️','الآنَ',['இப்போது','now','දැන්']]])+
        bi('<span class="arw">لَيْلًا</span> = பொதுவாக இரவில்; <span class="arw">اللَّيْلَةَ</span> = இன்று இரவு.','<span class="arw">لَيْلًا</span> = at night in general; <span class="arw">اللَّيْلَةَ</span> = tonight.','<span class="arw">لَيْلًا</span> = සාමාන්‍යයෙන් රාත්‍රියේ; <span class="arw">اللَّيْلَةَ</span> = අද රෑ.')+
      '</div>'+
      '<div class="callout"><h3>'+TE('இடம்: <span class="arw">ظَرْفُ مَكَانٍ</span>','Place: <span class="arw">ظَرْفُ مَكَانٍ</span>','ස්ථානය: <span class="arw">ظَرْفُ مَكَانٍ</span>')+'</h3><div class="eq">'+
        place('amam','أَمَامَ',['முன்னால்','in front of','ඉදිරියෙන්'])+
        place('khalf','خَلْفَ',['பின்னால்','behind','පිටුපසින්'])+
        place('fawq','فَوْقَ',['மேலே','above','ඉහළින්'])+
        place('taht','تَحْتَ',['கீழே','under','යටින්'])+
        place('hawl','حَوْلَ',['சுற்றி','around','වටේ'])+
        place('ind','عِنْدَ',['அருகில்','at, by','ළඟ'])+
      '</div></div>'+
      '<div class="exlist">'+
        ex('يَقَعُ المَسْجِدُ <mark>أَمَامَ</mark> المَدْرَسَةِ.',['பள்ளிவாசல் பாடசாலைக்கு முன்னால் இருக்கிறது (இடம்).','The mosque is in front of the school (place).','පල්ලිය පාසල ඉදිරියෙන් පිහිටා ඇත (ස්ථානය).'])+
        ex('تُشْرِقُ الشَّمْسُ <mark>صَبَاحًا</mark>.',['சூரியன் காலையில் உதிக்கிறது (நேரம்).','The sun rises in the morning (time).','හිරු උදේ උදා වේ (කාලය).'])+
        ex('يَشْتَدُّ البَرْدُ <mark>شِتَاءً</mark>.',['குளிர்காலத்தில் குளிர் கடுமையாகிறது (நேரம்).','The cold gets harsh in winter (time).','ශීත කාලයේ සීතල දැඩි වෙයි (කාලය).'])+
        ex('نَلْتَقِي <mark>عَصْرًا</mark> <mark>عِنْدَ</mark> المَلْعَبِ.',['பிற்பகலில் விளையாட்டு மைதானத்தருகே சந்திப்போம் (இரண்டும்!).','We meet in the afternoon by the playing field (both!).','අපි හවස් වරුවේ ක්‍රීඩාංගණය ළඟ හමුවෙමු (දෙකම!).'])+
      '</div>'+
      '<div class="duo">'+
        panel('✅','جِئْتُكَ يَوْمَ الجُمُعَةِ',['வெள்ளிக்கிழமை வந்தேன்: "எப்போது?" → ظَرْف, நஸ்ப்','I came to you on Friday: "when?" → ẓarf, naṣb','මම සිකුරාදා ආවා: "කවදාද?" → ẓarf, නස්බ්'],null,null,COL[4])+
        panel('❌','يَوْمُ الجُمُعَةِ يَوْمٌ مُبَارَكٌ',['வெள்ளிக்கிழமை பற்றிய வாக்கியம் → ظَرْف அல்ல, ரஃப்','a sentence about Friday → not a ẓarf, rafʿ','සිකුරාදා ගැන වාක්‍යයක් → ẓarf නොවේ, රෆ්'],null,null,'var(--bad-soft)')+
        panel('📍','عِنْدَ المَلْعَبِ · عِنْدَ الفَجْرِ',['அருகில் / அந்த நேரத்தில் → ظَرْف','at a place / at a time → ẓarf','ස්ථානයක / වේලාවක → ẓarf'],null,null,COL[4])+
        panel('✋','عِنْدِي قَلَمٌ',['"என்னிடம் உண்டு" → ظَرْف அல்ல','"I have" → not a ẓarf','"මට තියෙනවා" → ẓarf නොවේ'],null,null,'var(--bad-soft)')+

    /* 9 — al-mafʿūl maʿahu */
    {type:'html',title:['<span class="arw">المَفْعُولُ مَعَهُ</span>: "உடன்" என்று பொருள்படும் وَ','<span class="arw">المَفْعُولُ مَعَهُ</span>: the وَ that means "with"','<span class="arw">المَفْعُولُ مَعَهُ</span>: "සමඟ" යන අර්ථය දෙන وَ'],
     intro:['பாடம் 24: <span class="arw">مَعَ</span> வர வேண்டிய இடத்தில் ஒரு <span class="arw">وَ</span> (<span class="arw">وَاوُ المَعِيَّةِ</span>), அதன் பின் நஸ்ப்.','Lesson 24: a <span class="arw">وَ</span> stands where <span class="arw">مَعَ</span> would be (<span class="arw">وَاوُ المَعِيَّةِ</span>), and the noun after it is in naṣb.','24 වන පාඩම: <span class="arw">مَعَ</span> තිබිය යුතු තැන <span class="arw">وَ</span> එකක් (<span class="arw">وَاوُ المَعِيَّةِ</span>), ඊට පසු නාම පදය නස්බ්.'],
     html:'<div class="eq">'+WB('سِرْتُ وَالشَّاطِئَ',['கடற்கரையோடு நடந்தேன்','I walked along the shore','මම වෙරළ දිගේ ඇවිද්දා'],'add','🏖️')+'<span class="op">=</span>'+WB('سِرْتُ مَعَ الشَّاطِئِ',['அதே பொருள்','the same meaning','එකම අර්ථය'],'','🚶')+'</div>'+
      '<div class="duo">'+
        panel('👨‍🏫 🧑‍🎓','دَخَلَ المُعَلِّمُ وَالطُّلَّابُ',['இருவரும் நுழைந்தனர் → "-உம்" (عَطْف): ழம்மா','both came in → "and" (ʿaṭf): ḍamma','දෙපිරිසම ඇතුළු වුණා → "සහ" (عَطْف): ළම්මා'],null,null,COL[1])+
        panel('🚶 🏖️','سِرْتُ وَالشَّاطِئَ',['கடற்கரை நடக்காது! → "உடன்" (مَعِيَّة): ஃபத்ஹா','the shore does not walk! → "with" (maʿiyyah): fatḥa','වෙරළ ඇවිදින්නේ නැහැ! → "සමඟ" (مَعِيَّة): ෆත්හා'],null,null,COL[5])+
      '</div>'+
      '<div class="note-box">'+bi('சோதனை: <span class="arw">وَ</span>-க்குப் பின் உள்ள சொல் ரஃப் (முந்தைய சொல்லைப் பின்பற்றுகிறது) → "-உம்". நஸ்ப் → "உடன்".','The test: if the noun after <span class="arw">وَ</span> is in rafʿ (it follows the word before), it is "and". If it is in naṣb, it is "with".','පරීක්ෂාව: <span class="arw">وَ</span> ට පසු නාම පදය රෆ් නම් (පෙර වචනය අනුගමනය කරයි) → "සහ". නස්බ් නම් → "සමඟ".')+'</div>'+
      '<div class="exlist">'+
        ex('اسْتَيْقَظَ المُسَافِرُ <mark>وَأَذَانَ</mark> الفَجْرِ.',['பயணி ஃபஜ்ர் அதானுடன் கண் விழித்தார்.','The traveller woke up with the dawn call to prayer.','මගියා ෆජ්ර් අදාන් එක්කම අවදි වුණා.'])+
        ex('يَمْشِي المَاشِي <mark>وَالرَّصِيفَ</mark>.',['பாதசாரி நடைபாதையோடு நடக்கிறார்.','The pedestrian walks along the pavement.','පදිකයා පදික වේදිකාව දිගේ ඇවිදියි.'])+

        ex('سِرْتُ <mark>وَغُرُوبَ</mark> الشَّمْسِ.',['சூரியன் மறையும் நேரத்தோடு நடந்தேன்.','I walked with the sunset.','මම හිරු බැසයන වේලාවේ ඇවිද්දා.'])+
        ex('سَارَ القَائِدُ <mark>وَالجَيْشَ</mark>.',['தளபதி படையுடன் சென்றார்.','The commander marched with the army.','සෙන්පතියා හමුදාව සමඟ ගමන් කළා.'])+
        ex('كَيْفَ أَنْتَ <mark>وَالِامْتِحَانَ</mark>؟',['பரீட்சையோடு எப்படிப் போகிறது?','How are you getting on with the exam?','විභාගය එක්ක කොහොමද?'])+

      '</div>'+
      '<div class="callout"><h3>'+TE('மூன்று வகை <span class="arw">وَ</span>','Three kinds of <span class="arw">وَ</span>','<span class="arw">وَ</span> වර්ග තුනක්')+'</h3>'+

    /* quiz */
    {type:'quiz',title:['உங்களை நீங்களே சோதியுங்கள்','Check yourself','ඔබම පරීක්ෂා කරන්න'],
     items:[
      {q:bi('தாரிக் எந்தப் பீடத்துக்கு விண்ணப்பித்தான்?','Which faculty did Ṭāriq apply to?','තාරික් අයදුම් කළේ කුමන පීඨයටද?'),opts:['كُلِّيَّةُ الطِّبِّ','كُلِّيَّةُ الهَنْدَسَةِ','كُلِّيَّةُ الآدَابِ'],a:1,why:['அவன் பொறியியல் பீடத்துக்குச் சமர்ப்பித்தான்: <span class="arw">لِيُقَدِّمَ أَوْرَاقَهُ إِلَى كُلِّيَّةِ الهَنْدَسَةِ</span>.','He handed his documents to engineering: <span class="arw">لِيُقَدِّمَ أَوْرَاقَهُ إِلَى كُلِّيَّةِ الهَنْدَسَةِ</span>.','ඔහු ඉංජිනේරු පීඨයට භාර දුන්නා: <span class="arw">لِيُقَدِّمَ أَوْرَاقَهُ إِلَى كُلِّيَّةِ الهَنْدَسَةِ</span>.']},
      {q:bi('அஹ்மதை ஏற்றுக்கொள்ளச் சம்மதித்தவர் யார்?','Who agreed to accept Aḥmad?','අහ්මද්ව ගන්න එකඟ වුණේ කවුද?'),opts:['عَمِيدُ كُلِّيَّةِ الآدَابِ','رَئِيسُ قِسْمِ الطِّبِّ','مُدِيرُ المَرْكَزِ'],a:0,why:['கலைப் பீடத்தின் பீடாதிபதி.','The dean of the faculty of arts.','කලා පීඨයේ පීඨාධිපති.']},
      {q:A('حَصَلَ '+B+' تَقْدِيرِ «مُمْتَازٍ».'),opts:['فِي','عَلَى','عَنْ'],a:1,why:['حَصَلَ எப்போதும் عَلَى உடன்.','حَصَلَ always takes عَلَى.','حَصَلَ සැමවිටම عَلَى සමඟ.']},
      {q:bi('<span class="arw">رَغِبَ عَنْ</span> என்றால்?','<span class="arw">رَغِبَ عَنْ</span> means…','<span class="arw">رَغِبَ عَنْ</span> යනු?'),opts:[ONE('விரும்பினான்','wanted','කැමති වුණා'),ONE('புறக்கணித்தான்','turned away from','ඉවත හැරුණා')],a:1,optCls:'txt-opt',why:['فِي = விரும்பினான்; عَنْ = புறக்கணித்தான்.','With فِي it is "wanted"; with عَنْ, "turned away from".','فِي = කැමති වුණා; عَنْ = ඉවත හැරුණා.']},
      {q:bi('<span class="arw">لَا عَجَبَ فِي ذٰلِكَ</span> என்றால்?','<span class="arw">لَا عَجَبَ فِي ذٰلِكَ</span> means…','<span class="arw">لَا عَجَبَ فِي ذٰلِكَ</span> යනු?'),opts:[ONE('அதில் ஆச்சரியமே இல்லை','there is no surprise at all in that','ඒකේ කිසිම පුදුමයක් නැහැ'),ONE('அது ஆச்சரியம்','that is surprising','ඒක පුදුමයි')],a:0,optCls:'txt-opt',why:['முழு வகையையும் மறுக்கும் لَا.','The لَا that denies a whole kind.','සම්පූර්ණ වර්ගයම ප්‍රතික්ෂේප කරන لَا.']},
      {q:bi('<span class="arw">فَقِير</span>-இன் எதிர்ச்சொல்?','The opposite of <span class="arw">فَقِير</span>?','<span class="arw">فَقِير</span> හි විරුද්ධ පදය?'),opts:['غَنِيّ','قَبِيح','جَمِيل'],a:0,why:['ஏழை ↔ பணக்காரர்.','Poor ↔ rich.','දුප්පත් ↔ පොහොසත්.']},
      {q:bi('<span class="arw">مَرْأَة</span>-இன் பன்மை?','The plural of <span class="arw">مَرْأَة</span>?','<span class="arw">مَرْأَة</span> හි බහුවචනය?'),opts:['مَرْأَات','نِسَاء','نَاس'],a:1,why:['வேறு சொல்லிலிருந்து வரும் பன்மை: نِسَاء.','A plural from a different word: نِسَاء.','වෙනත් වචනයකින් එන බහුවචනය: نِسَاء.']},
      {q:A('رَأَيْتُ '+B+' فِي المَسْجِدِ.'),opts:['أَخُوكَ','أَخَاكَ','أَخِيكَ'],a:1,why:['செயப்படுபொருள் → ا.','The object → ا.','කර්මය → ا.']},
      {q:A('ذَهَبْتُ إِلَى '+B+' بَكْرٍ.'),opts:['أَبُو','أَبَا','أَبِي'],a:2,why:['முன்னிடைச் சொல்லுக்குப் பின் → ي.','After a preposition → ي.','පූර්ව නිපාතයට පසු → ي.']},
      {q:A('رَأَيْتُ '+B+' فِي المَكْتَبَةِ.'),opts:['الطَّالِبَاتَ','الطَّالِبَاتِ'],a:1,why:['ـَات பன்மை நஸ்பில் கஸ்ரா பெறுகிறது, ஃபத்ஹா ஒருபோதும் இல்லை.','An -āt plural takes a kasra in naṣb, never a fatḥa.','ـَات බහුවචනය නස්බ්හිදී කස්රා ගනී, කිසිදා ෆත්හා නොවේ.']},
      {q:A('قَرَأْتُ '+B+'.'),opts:['قِصَّتَانِ','قِصَّتَيْنِ'],a:1,why:['இருமை செயப்படுபொருள் → ـَيْنِ.','A dual object → ـَيْنِ.','ද්විවචන කර්මය → ـَيْنِ.']},
      {q:bi('<span class="arw">نَامَ الطِّفْلُ نَوْمًا عَمِيقًا</span>: <span class="arw">نَوْمًا</span> எது?','<span class="arw">نَامَ الطِّفْلُ نَوْمًا عَمِيقًا</span>: what is <span class="arw">نَوْمًا</span>?','<span class="arw">نَامَ الطِّفْلُ نَوْمًا عَمِيقًا</span>: <span class="arw">نَوْمًا</span> කුමක්ද?'),opts:['المَفْعُولُ بِهِ','المَفْعُولُ المُطْلَقُ','المَفْعُولُ لِأَجْلِهِ'],a:1,why:['அதே வினையின் மஸ்தர், வகையைச் சொல்கிறது.','The same verb\'s maṣdar, telling the kind.','එම ක්‍රියාවේම මස්දර්, වර්ගය කියයි.']},
      {q:bi('<span class="arw">وَقَفَ الطُّلَّابُ احْتِرَامًا لِلْمُعَلِّمِ</span>: <span class="arw">احْتِرَامًا</span> எது?','<span class="arw">وَقَفَ الطُّلَّابُ احْتِرَامًا لِلْمُعَلِّمِ</span>: what is <span class="arw">احْتِرَامًا</span>?','<span class="arw">وَقَفَ الطُّلَّابُ احْتِرَامًا لِلْمُعَلِّمِ</span>: <span class="arw">احْتِرَامًا</span> කුමක්ද?'),opts:['المَفْعُولُ المُطْلَقُ','المَفْعُولُ لِأَجْلِهِ','المَفْعُولُ فِيهِ'],a:1,why:['வேறு வினையின் மஸ்தர்; "ஏன் நின்றார்கள்?" என்பதற்குப் பதில்.','A different verb\'s maṣdar; it answers "why did they stand?"','වෙනත් ක්‍රියාවක මස්දර්; "ඇයි නැගිට්ටේ?" යන්නට පිළිතුර.']},
      {q:bi('<span class="arw">دَارَ اللَّاعِبُ دَوْرَتَيْنِ</span>: இங்கே மஸ்தர் என்ன செய்கிறது?','<span class="arw">دَارَ اللَّاعِبُ دَوْرَتَيْنِ</span>: what does the maṣdar do here?','<span class="arw">دَارَ اللَّاعِبُ دَوْرَتَيْنِ</span>: මෙහි මස්දර් කරන්නේ කුමක්ද?'),opts:[ONE('வலியுறுத்துகிறது','stresses the verb','අවධාරණය කරයි'),ONE('வகையைச் சொல்கிறது','tells the kind','වර්ගය කියයි'),ONE('எண்ணிக்கையைச் சொல்கிறது','counts it','ගණන කියයි')],a:2,optCls:'txt-opt',why:['இருமை → எண்ணிக்கை.','A dual → a count.','ද්විවචනය → ගණන.']},
      {q:A('سَافَرْتُ '+B+'.'),opts:['لَيْلٌ','لَيْلًا','لَيْلٍ'],a:1,why:['நேரத்தைக் காட்டும் ظَرْف → நஸ்ப்.','A ẓarf of time → naṣb.','කාලය පෙන්වන ظَرْف → නස්බ්.']},
      {q:bi('<span class="arw">يَوْمُ الجُمُعَةِ يَوْمٌ مُبَارَكٌ</span>: இங்கே <span class="arw">يَوْمُ</span> ஒரு ظَرْف ஆகுமா?','<span class="arw">يَوْمُ الجُمُعَةِ يَوْمٌ مُبَارَكٌ</span>: is <span class="arw">يَوْمُ</span> a ẓarf here?','<span class="arw">يَوْمُ الجُمُعَةِ يَوْمٌ مُبَارَكٌ</span>: මෙහි <span class="arw">يَوْمُ</span> ظَرْف එකක්ද?'),opts:[ONE('ஆம்','yes','ඔව්'),ONE('இல்லை','no','නැහැ')],a:1,optCls:'txt-opt',why:['வாக்கியம் வெள்ளிக்கிழமையைப் பற்றியது; அதனால் ரஃப்.','The sentence is about Friday, so it is in rafʿ.','වාක්‍යය සිකුරාදා ගැනයි; එබැවින් රෆ්.']},

        rx('👥','هُنَاكَ اخْتِلَافَاتٌ كَثِيرَةٌ بَيْنَ التَّعْلِيمِ فِي المَاضِي، وَالتَّعْلِيمِ فِي الحَاضِرِ. <mark>وَمِنْ</mark> تِلْكَ الِاخْتِلَافَاتِ، أَنَّ فُرَصَ التَّعْلِيمِ كَانَتْ قَلِيلَةً فِي المَاضِي، <mark>حَيْثُ</mark> كَانَ يَلْتَحِقُ بِالمَدَارِسِ طُلَّابٌ قَلِيلُونَ، هُمْ –فِي الغَالِبِ– أَبْنَاءُ الأَغْنِيَاءِ وَسُكَّانُ المُدُنِ. <mark>أَمَّا</mark> اليَوْمَ، <mark>فَ</mark>قَدْ أَصْبَحَ التَّعْلِيمُ <mark>حَقًّا</mark> لِكُلِّ مُوَاطِنٍ؛ فَ<mark>كَثُرَ</mark> عَدَدُ الطُّلَّابِ، وَانْتَشَرَتِ المَدَارِسُ فِي كُلِّ مَكَانٍ، وَ<mark>شَاعَ</mark> القَوْلُ: «التَّعْلِيمُ كَالمَاءِ وَالهَوَاءِ».',['கடந்த காலக் கல்விக்கும் இன்றைய கல்விக்கும் இடையே பல வேறுபாடுகள் உள்ளன. அவற்றுள் சில: முன்பு கல்வி வாய்ப்புகள் குறைவு; அதனால் சில மாணவர்களே பாடசாலைகளில் சேர்ந்தார்கள், பெரும்பாலும் பணக்காரர்களின் பிள்ளைகளும் நகரவாசிகளும். இன்றோ கல்வி ஒவ்வொரு குடிமகனின் உரிமையாகிவிட்டது; மாணவர் தொகை கூடியது, பாடசாலைகள் எல்லா இடங்களிலும் பரவின, "கல்வி தண்ணீர், காற்றைப் போன்றது" என்ற கூற்றும் பரவியது.','There are many differences between education in the past and today. Among them: opportunities were few in the past, so only a few students joined schools, mostly the children of the rich and city people. As for today, education has become a right for every citizen: the number of students has grown, schools have spread everywhere, and the saying has spread: "Education is like water and air."','අතීත අධ්‍යාපනය සහ අද අධ්‍යාපනය අතර වෙනස්කම් බොහොමයක් ඇත. ඉන් සමහරක්: අතීතයේ අධ්‍යාපන අවස්ථා අඩු විය; එබැවින් පාසල්වලට ඇතුළු වූයේ සිසුන් ස්වල්පයකි, බොහෝ විට පොහොසතුන්ගේ දරුවන් සහ නගරවාසීන්. අද නම් අධ්‍යාපනය සෑම පුරවැසියෙකුගේම අයිතියක් වී ඇත; සිසුන් ගණන වැඩි විය, පාසල් හැම තැනම පැතිරුණි, "අධ්‍යාපනය ජලය සහ වාතය වැනියි" යන කියමනද පැතිරුණි.'])+
        rx('🐪','كَانَ طُلَّابُ العِلْمِ –فِي المَاضِي– يُسَافِرُونَ مِنْ بَلَدٍ إِلَى بَلَدٍ؛ <mark>لِ</mark>طَلَبِ العِلْمِ، وَكَانُوا يُوَاجِهُونَ فِي سَفَرِهِمْ <mark>كَثِيرًا مِنَ التَّعَبِ</mark>؛ فَكَانُوا يَرْكَبُونَ <mark>الجِمَالَ</mark> أَيَّامًا وَأَشْهُرًا.',['முன்பு அறிவைத் தேடுபவர்கள் அறிவுக்காக நாட்டுக்கு நாடு பயணம் செய்தார்கள்; பயணத்தில் மிகுந்த களைப்பை எதிர்கொண்டார்கள்: நாட்கணக்கிலும் மாதக்கணக்கிலும் ஒட்டகங்களில் சென்றார்கள்.','In the past, students of knowledge travelled from country to country to seek knowledge, and faced great hardship on their journeys: they rode camels for days and months.','අතීතයේ දැනුම සොයන්නෝ දැනුම සඳහා රටින් රටට ගමන් කළහ; ගමනේදී බොහෝ වෙහෙසට මුහුණ දුන්හ: දින ගණන් සහ මාස ගණන් ඔටුවන් පිට ගියහ.'])+
        rx('🚗','أَمَّا اليَوْمَ، فَالمَدَارِسُ وَالجَامِعَاتُ كَثِيرَةٌ، فِي كُلِّ مَدِينَةٍ وَقَرْيَةٍ <mark>تَقْرِيبًا</mark>، <mark>حَيْثُ</mark> يَذْهَبُ الطَّالِبُ إِلَى مَدْرَسَتِهِ، أَوْ جَامِعَتِهِ بِالسَّيَّارَةِ، أَوْ <mark>سَيْرًا عَلَى الأَقْدَامِ</mark>.',['இன்றோ பாடசாலைகளும் பல்கலைக்கழகங்களும் ஏறக்குறைய ஒவ்வொரு நகரத்திலும் கிராமத்திலும் உள்ளன; அதனால் மாணவர் தன் பாடசாலைக்கோ பல்கலைக்கழகத்துக்கோ காரில், அல்லது நடந்தே போகிறார்.','As for today, schools and universities are many, in nearly every city and village, so the student goes to his school or university by car, or on foot.','අද නම් පාසල් සහ විශ්වවිද්‍යාල බොහෝය, දළ වශයෙන් සෑම නගරයකම සහ ගමකම; එබැවින් සිසුවා තම පාසලට හෝ විශ්වවිද්‍යාලයට කාරයෙන් හෝ පයින් යයි.'])+
        rx('💻','وَمِنْ نَاحِيَةٍ <mark>أُخْرَى</mark>، يَسْتَطِيعُ الطَّالِبُ أَنْ يَتَعَلَّمَ، <mark>وَهُوَ فِي بَيْتِهِ</mark> عَنْ طَرِيقِ الشَّبَكَةِ الدَّوْلِيَّةِ.',['இன்னொரு பக்கம், மாணவர் தன் வீட்டில் இருந்தபடியே இணையம் மூலம் கற்க முடியும்.','From another side, the student can learn while he is at home, through the internet.','තවත් පැත්තකින්, සිසුවාට ගෙදර සිටම අන්තර්ජාලය හරහා ඉගෙන ගත හැක.'])+
        rx('🎓','مِنَ الِاخْتِلَافَاتِ أَيْضًا، أَنَّ المُعَلِّمَ كَانَ لَا يَطْلُبُ <mark>أَجْرًا</mark> عَلَى عَمَلِهِ فِي المَاضِي؛ لِأَنَّهُ كَانَ يَطْلُبُ الأَجْرَ مِنَ اللّٰهِ. وَكَانَ <mark>هَدَفُ</mark> الطَّالِبِ طَلَبَ العِلْمِ. أَمَّا اليَوْمَ، فَقَدِ اخْتَلَفَ الأَمْرُ، فَالمُعَلِّمُ يَطْلُبُ كَثِيرًا مِنَ الأَجْرِ، وَالطَّالِبُ يُفَكِّرُ فِي <mark>الشَّهَادَةِ</mark> قَبْلَ العِلْمِ؛ لِأَنَّهَا <mark>وَسِيلَةٌ</mark> إِلَى العَمَلِ.',['இன்னொரு வேறுபாடு: முன்பு ஆசிரியர் தன் வேலைக்குக் கூலி கேட்கவில்லை; அல்லாஹ்விடமே நற்கூலியைத் தேடினார். மாணவரின் இலக்கு அறிவைத் தேடுவதாக இருந்தது. இன்றோ நிலை மாறிவிட்டது: ஆசிரியர் அதிகக் கூலி கேட்கிறார்; மாணவர் அறிவைவிட முதலில் சான்றிதழைப் பற்றி யோசிக்கிறார், ஏனென்றால் அது வேலைக்கான வழி.','Another difference: in the past the teacher asked no wage for his work, because he sought his reward from Allah, and the student\'s aim was to seek knowledge. Today things have changed: the teacher asks for a large wage, and the student thinks of the certificate before knowledge, because it is a means to a job.','තවත් වෙනසක්: අතීතයේ ගුරුවරයා තම වැඩට කුලියක් ඉල්ලුවේ නැත; ඔහු ප්‍රතිඵල පැතුවේ අල්ලාහ්ගෙනි. සිසුවාගේ ඉලක්කය දැනුම සෙවීම විය. අද තත්ත්වය වෙනස් වී ඇත: ගුරුවරයා විශාල කුලියක් ඉල්ලයි; සිසුවා දැනුමට පෙර සහතිකය ගැන සිතයි, මන්ද එය රැකියාවකට මාර්ගයකි.'])+

          ['<mark>أَمَّا</mark> اليَوْمَ، <mark>فَ</mark>قَدْ أَصْبَحَ التَّعْلِيمُ حَقًّا.',['இன்றைய நிலையைப் பொறுத்தவரை, கல்வி ஒரு உரிமையாகிவிட்டது.','As for today, education has become a right.','අද නම්, අධ්‍යාපනය අයිතියක් වී ඇත.']],

          ['يُوَاجِهُونَ <mark>كَثِيرًا مِنَ التَّعَبِ</mark>',['"நிறைய"; நிறைய என்ன? களைப்பு.','"Much"; much what? Hardship.','"ගොඩක්"; මොනවාද? වෙහෙස.']]])+

        rung('١','دَرَسَ زَيْدٌ <mark>نَائِمًا</mark>.',['ஒரு சொல், நஸ்பில்','one word, in naṣb','එක් වචනයක්, නස්බ්හි'],'نَائِمًا')+
        rung('٢','دَرَسَ زَيْدٌ <mark>يَنَامُ</mark>.',['நிகழ்கால வினை','a present-tense verb','වර්තමාන ක්‍රියාවක්'],'يَنَامُ')+
        rung('٣','دَرَسَ زَيْدٌ <mark>وَهُوَ نَائِمٌ</mark>.',['<span class="arw">وَ + هُوَ</span> + சொல்: இப்போது <span class="arw">نَائِمٌ</span>, <span class="arw">نَائِمًا</span> அல்ல','<span class="arw">وَ + هُوَ</span> + a word: now <span class="arw">نَائِمٌ</span>, not <span class="arw">نَائِمًا</span>','<span class="arw">وَ + هُوَ</span> + වචනය: දැන් <span class="arw">نَائِمٌ</span>, <span class="arw">نَائِمًا</span> නොවේ'],'وَهُوَ نَائِمٌ')+
        rung('٤','دَرَسَ زَيْدٌ <mark>وَهُوَ يَنَامُ</mark>.',['<span class="arw">وَ + هُوَ</span> + வினை: <span class="arw">وَ</span> கட்டாயம்','<span class="arw">وَ + هُوَ</span> + a verb: the <span class="arw">وَ</span> must be there','<span class="arw">وَ + هُوَ</span> + ක්‍රියාව: <span class="arw">وَ</span> අනිවාර්යයි'],'وَهُوَ يَنَامُ')+
      '</div>'+
      '<div class="exlist">'+
        rx('💻','يَسْتَطِيعُ الطَّالِبُ أَنْ يَتَعَلَّمَ، <mark>وَهُوَ فِي بَيْتِهِ</mark>.',['மாணவர் தன் வீட்டில் இருந்தபடியே கற்க முடியும். (பாடம் 25)','The student can learn while he is at home. (Lesson 25)','සිසුවාට ගෙදර සිටම ඉගෙන ගත හැක. (25 වන පාඩම)'])+
        rx('📖','كَيْفَ يَتْرُكُونَ العِلْمَ، <mark>وَالإِسْلَامُ يَدْعُو إِلَيْهِ</mark>؟!',['இஸ்லாம் அறிவின் பக்கம் அழைத்துக்கொண்டிருக்கும்போது அவர்கள் அதை எப்படி விடுவார்கள்?! (பாடம் 27)','How can they leave knowledge while Islam calls to it?! (Lesson 27)','ඉස්ලාමය දැනුමට කැඳවමින් සිටියදී ඔවුන් එය අතහරින්නේ කෙසේද?! (27 වන පාඩම)'])+
      '</div>'+
      '<div class="callout"><h3>'+TE('நான்காவது வகை <span class="arw">وَ</span>: <span class="arw">وَاوُ الحَالِ</span>','A fourth kind of <span class="arw">وَ</span>: <span class="arw">وَاوُ الحَالِ</span>','හතරවන <span class="arw">وَ</span> වර්ගය: <span class="arw">وَاوُ الحَالِ</span>')+'</h3>'+
        bi('24-ஆம் புத்தகத்தின் மூன்று <span class="arw">وَ</span>-களுடன் (-உம், சத்தியம், உடன்) இது நான்காவது: "-போது". தமிழில் "-கொண்டு", "-படியே": தூங்கிக்கொண்டு படித்தான், வீட்டில் இருந்தபடியே.','Add it to the three kinds of <span class="arw">وَ</span> in booklet 24 (and, oath, with): this one means "while". Tamil says -கொண்டு or -படியே, Sinhala -ගෙන or -දී.','24 වන පොතේ <span class="arw">وَ</span> වර්ග තුනට (සහ, දිවුරුම, සමඟ) මෙය හතරවැන්නයි: "-දී". සිංහලයේ "-ගෙන", "-දී": නිදාගෙන ඉගෙන ගත්තා, ගෙදර සිටියදී.')+
      '</div>'},

    /* 7 — tamyīz of a word */
    {type:'html',title:['<span class="arw">التَّمْيِيز</span>: "எதில்?"','<span class="arw">التَّمْيِيز</span>: "of what?"','<span class="arw">التَّمْيِيز</span>: "කුමක්ද?"'],
     intro:['பாடம் 26: தெளிவில்லாத (<span class="arw">مُبْهَم</span>) சொல்லை அல்லது வாக்கியத்தைத் தெளிவாக்கும் சொல். <span class="arw">مَيَّزَ</span> = வேறுபடுத்தி அறி.','Lesson 26: the word that clears up a vague (<span class="arw">مُبْهَم</span>) word or sentence. <span class="arw">مَيَّزَ</span> = to tell apart.','26 වන පාඩම: පැහැදිලි නැති (<span class="arw">مُبْهَم</span>) වචනයක් හෝ වාක්‍යයක් පැහැදිලි කරන වචනය. <span class="arw">مَيَّزَ</span> = වෙන් කර හඳුනාගැනීම.'],
     html:'<div class="eq">'+WB('اِشْتَرَيْتُ كِيلُو …',['ஒரு கிலோ… எதில்?','a kilo… of what?','කිලෝ එකක්… මොනවාද?'],'','⚖️')+'<span class="op">→</span>'+WB('أَرُزًّا',['அரிசி!','of rice!','සහල්!'],'add','🍚')+'</div>'+
      '<div class="callout"><h3>'+TE('மூன்று அடையாளங்கள்','Its three marks','එහි ලකුණු තුන')+'</h3>'+
        chips([['🚫','نَكِرَة',['ال இல்லை','no ال','ال නැත']],['☝️','مُفْرَد',['ஒருமை','singular','ඒකවචන']],['✏️','مَنْصُوب',['முடிவு ـًا','ends in ـًا','අවසානය ـًا']]])+
      '</div>'+
      '<div class="exlist">'+
        rx('⚖️','اِشْتَرَتْ أُمِّي رِطْلًا <mark>عَسَلًا</mark>.',['என் தாய் ஒரு இறாத்தல் தேன் வாங்கினார். எடை (<span class="arw">وَزْن</span>)','My mother bought a pound of honey. Weight (<span class="arw">وَزْن</span>)','මගේ අම්මා රාත්තලක් මී පැණි ගත්තා. බර (<span class="arw">وَزْن</span>)'])+
        rx('🥛','اِشْتَرَيْتُ لِتْرًا <mark>حَلِيبًا</mark>.',['ஒரு லீற்றர் பால் வாங்கினேன். கொள்ளளவு (<span class="arw">كَيْل</span>)','I bought a litre of milk. Volume (<span class="arw">كَيْل</span>)','මම කිරි ලීටරයක් ගත්තා. පරිමාව (<span class="arw">كَيْل</span>)'])+
        rx('📏','مَلَكْتُ فَدَّانًا <mark>أَرْضًا</mark>.',['ஒரு ஏக்கர் நிலம் எனக்குச் சொந்தம். பரப்பு (<span class="arw">مَسَاحَة</span>)','I own an acre of land. Area (<span class="arw">مَسَاحَة</span>)','මට අක්කරයක ඉඩමක් අයිතියි. වර්ගඵලය (<span class="arw">مَسَاحَة</span>)'])+
        rx('🐄','فِي الحَقْلِ عِشْرُونَ <mark>بَقَرَةً</mark>.',['வயலில் இருபது மாடுகள். எண் (<span class="arw">عَدَد</span>); "மாடு" ஒருமையில்!','In the field there are twenty cows. Number (<span class="arw">عَدَد</span>); "cow" stays singular!','කෙතේ එළදෙනුන් විස්සක් ඉන්නවා. සංඛ්‍යාව (<span class="arw">عَدَد</span>); "එළදෙන" ඒකවචනයෙන්!'])+
      '</div>'+
      '<div class="note-box">'+bi('தமிழும் இப்படித்தான்: "ஒரு கிலோ அரிசி" (இடையில் சொல் இல்லை), அரபியின் <span class="arw">كِيلُو أَرُزًّا</span> போல. <span class="arw">كُوبًا مِنَ العَصِيرِ</span> (<span class="arw">مِنْ</span> உடன்) என்பது வேறு அமைப்பு.','English needs "of"; Tamil and Sinhala do not (ஒரு கிலோ அரிசி, සහල් කිලෝ එකක්), and neither does Arabic: <span class="arw">كِيلُو أَرُزًّا</span>. <span class="arw">كُوبًا مِنَ العَصِيرِ</span>, with <span class="arw">مِنْ</span>, is a different construction.','සිංහලයත් එසේමයි: "සහල් කිලෝ එකක්" (අතරට වචනයක් නැත), අරාබියේ <span class="arw">كِيلُو أَرُزًّا</span> මෙන්. <span class="arw">كُوبًا مِنَ العَصِيرِ</span> (<span class="arw">مِنْ</span> සමඟ) වෙනත් ව්‍යුහයකි.')+'</div>'+
      '<div class="exrow"><span class="arw" lang="ar" style="font-size:30px;line-height:2">اِشْتَرَيْتُ '+MW('مِتْرًا',1)+' '+MW('حَرِيرًا',6)+'</span>'+
        bi('ஒரு மீற்றர் பட்டு வாங்கினேன். <span class="arw">مِتْرًا</span> = செயப்படுபொருள் (வாங்கியது); <span class="arw">حَرِيرًا</span> = தம்யீஸ் (எதன் மீற்றர்?). பட்டு மீற்றரை விவரிக்கவில்லை, அதனால் பண்பும் அல்ல.','I bought a metre of silk. <span class="arw">مِتْرًا</span> is the object (what I bought); <span class="arw">حَرِيرًا</span> is the tamyīz (a metre of what?). Silk does not describe the metre, so it is not an adjective either.','මම සේද මීටරයක් ගත්තා. <span class="arw">مِتْرًا</span> = කර්මය (ගත් දේ); <span class="arw">حَرِيرًا</span> = තම්යීස් (මොනවායේ මීටරයක්ද?). සේද මීටරය විස්තර නොකරයි, එබැවින් විශේෂණයක්ද නොවේ.')+
      '</div>'},

    /* 8 — tamyīz of a sentence + the naṣb family */
    {type:'html',title:['முழு வாக்கியத்தின் தம்யீஸ்','The tamyīz of a whole sentence','සම්පූර්ණ වාක්‍යයක තම්යීස්'],
     intro:['சில நேரம் முழு வாக்கியமே தெளிவில்லாமல் இருக்கும்; கடைசியில் வரும் ஒரு சொல் அதைத் தெளிவாக்குகிறது.','Sometimes the whole sentence is vague, and one word at the end clears it up.','සමහර විට මුළු වාක්‍යයම පැහැදිලි නැත; අගට එන එක් වචනයක් එය පැහැදිලි කරයි.'],
     html:verse('﴿وَاشْتَعَلَ الرَّأْسُ <mark>شَيْبًا</mark>﴾',['என் தலை நரையால் தீப்பற்றியது போல் வெண்மையாகிவிட்டது.','And my head has blazed with grey.','මගේ හිස පැසුණු කෙස්වලින් ගිනි ගත්තාක් මෙන් සුදු වී ඇත.'],'سورة مريم ١٩:٤')+
      verse('﴿أَنَا أَكْثَرُ مِنكَ <mark>مَالًا</mark>﴾',['நான் உன்னைவிடச் செல்வத்தில் அதிகமானவன்.','I am greater than you in wealth.','මම ඔබට වඩා ධනයෙන් වැඩියි.'],'سورة الكهف ١٨:٣٤')+
      '<div class="callout"><h3>'+TE('வாக்கியத்தின் ஒரு சொல்லிலிருந்து மாற்றப்பட்டது (<span class="arw">مُحَوَّل</span>)','Turned from one word of the sentence (<span class="arw">مُحَوَّل</span>)','වාක්‍යයේ එක් වචනයකින් හැරවූ (<span class="arw">مُحَوَّل</span>)')+'</h3>'+
        turn('اشْتَعَلَ شَيْبُ الرَّأْسِ','اشْتَعَلَ الرَّأْسُ <mark>شَيْبًا</mark>',['எழுவாயிலிருந்து (<span class="arw">فَاعِل</span>)','from the doer (<span class="arw">فَاعِل</span>)','කර්තෘගෙන් (<span class="arw">فَاعِل</span>)'])+
        turn('غَرَسْتُ شَجَرَ الحَدِيقَةِ','غَرَسْتُ الحَدِيقَةَ <mark>شَجَرًا</mark>',['செயப்படுபொருளிலிருந்து (<span class="arw">مَفْعُول بِهِ</span>): தோட்டத்தில் மரங்கள் நட்டேன்','from the object (<span class="arw">مَفْعُول بِهِ</span>): I planted the garden with trees','කර්මයෙන් (<span class="arw">مَفْعُول بِهِ</span>): මම උයනේ ගස් සිටෙව්වා'])+
        turn('عِلْمُ مُحَمَّدٍ أَكْثَرُ مِنْ عِلْمِكَ','مُحَمَّدٌ أَكْثَرُ مِنْكَ <mark>عِلْمًا</mark>',['தொடக்கச் சொல்லிலிருந்து (<span class="arw">مُبْتَدَأ</span>)','from the subject of a nominal sentence (<span class="arw">مُبْتَدَأ</span>)','නාම වාක්‍යයේ ආරම්භක පදයෙන් (<span class="arw">مُبْتَدَأ</span>)'])+

        AI('نَعَمْ، تَأَثَّرَتْ بِهَا كَثِيرًا، <mark>فَقَدِ</mark> <mark>اتَّصَلَ</mark> عُلَمَاءُ أُورُوبَّا بِعُلَمَاءِ المُسْلِمِينَ، وَ<mark>أَخَذُوا عَنْهُمُ</mark> العِلْمَ، وَتَرْجَمُوا كُتُبَهُمْ، وَدَرَّسُوهَا فِي جَامِعَاتِهِمْ.',['ஆம், மிகவும். ஐரோப்பிய அறிஞர்கள் முஸ்லிம் அறிஞர்களுடன் தொடர்பு கொண்டு, அவர்களிடமிருந்து அறிவைப் பெற்று, அவர்களின் நூல்களை மொழிபெயர்த்து, தங்கள் பல்கலைக்கழகங்களில் கற்பித்தார்கள்.','Yes, greatly. The scholars of Europe made contact with the Muslim scholars, took knowledge from them, translated their books and taught them in their universities.','ඔව්, ඉතා බොහෝ. යුරෝපීය විද්වතුන් මුස්ලිම් විද්වතුන් හා සම්බන්ධ වී, ඔවුන්ගෙන් දැනුම ලබා, ඔවුන්ගේ පොත් පරිවර්තනය කර, තම විශ්වවිද්‍යාලවල ඉගැන්වූහ.'])+

        rx('🔢','يَلْتَحِقُ التَّلَامِيذُ بِالمَدْرَسَةِ الِابْتِدَائِيَّةِ –<mark>عَادَةً</mark>– فِي السَّادِسَةِ مِنْ أَعْمَارِهِمْ. وَ<mark>تَبْلُغُ</mark> سَنَوَاتُ الدِّرَاسَةِ فِي المَرْحَلَةِ الِابْتِدَائِيَّةِ سِتَّ سَنَوَاتٍ. وَتَبْلُغُ سَنَوَاتُ الدِّرَاسَةِ فِي المَرْحَلَةِ المُتَوَسِّطَةِ ثَلَاثَ سَنَوَاتٍ، <mark>وَكَذٰلِكَ</mark> فِي المَرْحَلَةِ الثَّانَوِيَّةِ. <mark>أَمَّا</mark> المَرْحَلَةُ الجَامِعِيَّةُ، <mark>فَ</mark>تَتَرَاوَحُ بَيْنَ أَرْبَعِ وَسِتِّ سَنَوَاتٍ.',['மாணவர்கள் வழக்கமாகத் தங்கள் ஆறாவது வயதில் ஆரம்பப் பாடசாலையில் சேர்கிறார்கள். ஆரம்பப் பிரிவில் படிப்புக் காலம் ஆறு ஆண்டுகள். இடைநிலையில் மூன்று ஆண்டுகள்; உயர்நிலையிலும் அப்படியே. பல்கலைக்கழகப் படிநிலையோ நான்கிலிருந்து ஆறு ஆண்டுகள் வரை.','Pupils usually join primary school at the age of six. Primary lasts six years, intermediate three years, and secondary likewise. As for university, it ranges between four and six years.','සිසුන් සාමාන්‍යයෙන් වයස අවුරුදු හයේදී ප්‍රාථමික පාසලට ඇතුළු වෙති. ප්‍රාථමික අදියර අවුරුදු හයකි; මධ්‍යම අදියර අවුරුදු තුනකි, ද්විතීයික අදියරද එසේමය. විශ්වවිද්‍යාල අදියර නම් අවුරුදු හතරත් හයත් අතර වේ.'])+
        rx('🎓','<mark>بَعْدَ أَنْ يُنْهِيَ</mark> الطَّالِبُ المَرْحَلَةَ الثَّانَوِيَّةَ، يَلْتَحِقُ بِالجَامِعَاتِ، أَوِ <mark>المَعَاهِدِ</mark>، <mark>إِذَا</mark> حَصَلَ عَلَى تَقْدِيرٍ طَيِّبٍ. وَبَعْدَ أَنْ يَحْصُلَ الطَّالِبُ عَلَى الشَّهَادَةِ الجَامِعِيَّةِ بِتَقْدِيرِ جَيِّدٍ جِدًّا أَوْ مُمْتَازٍ، يَلْتَحِقُ بِ<mark>الدِّرَاسَاتِ العُلْيَا</mark>؛ <mark>لِلْحُصُولِ عَلَى</mark> شَهَادَةِ المَاجِسْتِيرِ، ثُمَّ شَهَادَةِ الدُّكْتُورَاهْ.',['மாணவர் உயர்நிலைப் படிநிலையை முடித்த பின், நல்ல தரம் பெற்றால், பல்கலைக்கழகங்களிலோ நிறுவகங்களிலோ சேர்கிறார். "மிக நன்று" அல்லது "மிகச் சிறப்பு" தரத்துடன் பல்கலைக்கழகப் பட்டம் பெற்ற பின், முதுமாணியையும் பின்னர் கலாநிதிப் பட்டத்தையும் பெற உயர் கல்வியில் சேர்கிறார்.','After the student finishes secondary school, he joins a university or an institute, if he gets a good grade. And after he obtains his university degree with "very good" or "excellent", he joins higher studies, to obtain a master\'s degree, then a doctorate.','සිසුවා ද්විතීයික අදියර අවසන් කළ පසු, හොඳ ශ්‍රේණියක් ලැබුවොත්, විශ්වවිද්‍යාලයකට හෝ ආයතනයකට ඇතුළු වෙයි. "ඉතා හොඳ" හෝ "විශිෂ්ට" ශ්‍රේණියෙන් විශ්වවිද්‍යාල උපාධිය ලැබූ පසු, පශ්චාත් උපාධියක් සහ ඉන්පසු ආචාර්ය උපාධියක් ලබා ගැනීමට උසස් අධ්‍යාපනයට ඇතුළු වෙයි.'])+
        rx('🏛️','مِنْ نَاحِيَةٍ أُخْرَى، فِي البِلَادِ العَرَبِيَّةِ <mark>نَوْعَانِ مِنَ التَّعْلِيمِ</mark>، هُمَا: التَّعْلِيمُ <mark>الحُكُومِيُّ</mark>، وَ<mark>تُشْرِفُ عَلَيْهِ</mark> الدَّوْلَةُ؛ فَتَبْنِي المَدَارِسَ، وَ<mark>تُوَفِّرُ</mark> الكُتُبَ وَالمُدَرِّسِينَ، وَالتَّعْلِيمُ <mark>الأَهْلِيُّ</mark>، وَتُشْرِفُ عَلَيْهِ بَعْضُ <mark>الجَمْعِيَّاتِ</mark> وَ<mark>الأَفْرَادُ</mark>.',['இன்னொரு பக்கம், அரபு நாடுகளில் இரண்டு வகைக் கல்வி உண்டு: அரசாங்கக் கல்வி; அதை அரசு மேற்பார்வை செய்கிறது: பாடசாலைகளைக் கட்டுகிறது, புத்தகங்களையும் ஆசிரியர்களையும் வழங்குகிறது. மற்றது தனியார் கல்வி; அதைச் சில சங்கங்களும் தனிநபர்களும் மேற்பார்வை செய்கிறார்கள்.','On the other hand, the Arab countries have two kinds of education: government education, which the state oversees (it builds the schools and provides the books and teachers), and private education, which some associations and individuals oversee.','තවත් පැත්තකින්, අරාබි රටවල අධ්‍යාපන වර්ග දෙකක් ඇත: රජයේ අධ්‍යාපනය, එය රජය අධීක්ෂණය කරයි (පාසල් ඉදි කරයි, පොත් සහ ගුරුවරුන් සපයයි); සහ පෞද්ගලික අධ්‍යාපනය, එය සමහර සංගම් සහ පුද්ගලයන් අධීක්ෂණය කරති.'])+

    {type:'html',title:['நான்கு சிறுகதைகள்','Four short stories','කෙටි කතා හතරක්'],
     intro:['பாடம் 29-இன் முதல் பகுதி. ஒவ்வொரு கதையையும் வாசித்து, பின் மொழிபெயர்ப்பைப் பாருங்கள்.','Part one of Lesson 29. Read each story, then check the translation.','29 වන පාඩමේ පළමු කොටස. එක් එක් කතාව කියවා, පසුව පරිවර්තනය බලන්න.'],
     html:'<div class="exlist">'+
        block('الكِتَابُ العَجِيبُ','🐇📖',['அற்புதமான புத்தகம்','The wonderful book','පුදුම පොත'],[
          ['<mark>ذَاتَ يَوْمٍ</mark> وَجَدَ الأَرْنَبُ كِتَابًا <mark>مُلْقًى</mark> عَلَى أَرْضِ الغَابَةِ، وَجَدَ بِدَاخِلِ الكِتَابِ الكَثِيرَ مِنَ القِصَصِ العَجِيبَةِ.',['ஒரு நாள் முயல் காட்டுத் தரையில் கிடந்த ஒரு புத்தகத்தைக் கண்டது; அதனுள் பல அற்புதமான கதைகளைக் கண்டது.','One day the rabbit found a book lying on the forest floor; inside it he found many wonderful stories.','දවසක් හාවා වනාන්තරයේ බිම වැටී තිබූ පොතක් දුටුවා; එහි ඇතුළේ පුදුම කතා රැසක් දුටුවා.']],
          ['فَقَرَّرَ أَنْ يَقْرَأَهُ. <mark>تَجَمَّعَتْ حَوْلَهُ</mark> الحَيَوَانَاتُ <mark>لِتَسْتَمِعَ</mark> إِلَى هٰذِهِ القِصَصِ الرَّائِعَةِ، بَدَأَ الأَرْنَبُ فِي قِرَاءَةِ هٰذَا الكِتَابِ العَجِيبِ.',['எனவே அதை வாசிக்க முடிவு செய்தது. இந்த அருமையான கதைகளைக் கேட்க விலங்குகள் அதைச் சுற்றிக் கூடின; முயல் அந்த அற்புதப் புத்தகத்தை வாசிக்கத் தொடங்கியது.','So he decided to read it. The animals gathered around him to listen to these marvellous stories, and the rabbit began reading the wonderful book.','ඉතින් එය කියවන්න තීරණය කළා. මේ අපූරු කතා අසන්න සතුන් ඔහු වටා රැස් වුණා; හාවා පුදුම පොත කියවන්න පටන් ගත්තා.']],
          ['وَكَانَتِ الحَيَوَانَاتُ <mark>مُنْدَهِشَةً</mark>. <mark>يَا لَهُ مِنْ</mark> كِتَابٍ عَجِيبٍ!',['விலங்குகள் வியப்படைந்தன. என்ன ஒரு அற்புதமான புத்தகம்!','The animals were amazed. What a wonderful book!','සතුන් පුදුමයට පත් වුණා. මොනතරම් පුදුම පොතක්ද!']]])+
        block('الطِّفْلُ مَالِك','👦🛒',['மாலிக் என்ற சிறுவன்','The child Mālik','මාලික් නම් දරුවා'],[
          ['كَانَ هُنَاكَ طِفْلٌ اسْمُهُ مَالِك. ذَاتَ يَوْمٍ ذَهَبَ مَالِك مَعَ أُمِّهِ إِلَى السُّوقِ. كَانَ مَالِك طِفْلًا صَغِيرًا وَ<mark>شَقِيًّا</mark>، وَهُوَ أَيْضًا طِفْلٌ لَا يَسْتَمِعُ إِلَى كَلَامِ أُمِّهِ.',['மாலிக் என்ற ஒரு சிறுவன் இருந்தான். ஒரு நாள் அவன் தாயுடன் சந்தைக்குப் போனான். அவன் சிறிய, குறும்புக்காரச் சிறுவன்; தாயின் பேச்சைக் கேட்காதவனும் கூட.','There was a child called Mālik. One day he went with his mother to the market. He was a small, naughty child, and he did not listen to his mother.','මාලික් නම් දරුවෙක් හිටියා. දවසක් ඔහු අම්මා එක්ක වෙළඳපොළට ගියා. ඔහු පුංචි, දඟකාර දරුවෙක්; අම්මාගේ කතාවට ඇහුම්කන් නොදෙන දරුවෙක්.']],
          ['ذَهَبَ الطِّفْلُ مَالِك بَعِيدًا فَ<mark>ضَاعَ</mark> مِنْ أُمِّهِ. <mark>بَحَثَتِ</mark> الأُمُّ عَنْ طِفْلِهَا وَ<mark>صَارَتْ تَصْرُخُ</mark>: طِفْلِي طِفْلِي.',['மாலிக் தூரம் போய்த் தாயிடமிருந்து தொலைந்துபோனான். தாய் தன் பிள்ளையைத் தேடி, "என் பிள்ளை! என் பிள்ளை!" என்று கத்தத் தொடங்கினாள்.','Mālik went far away and got lost from his mother. She searched for her child and began to shout, "My child! My child!"','මාලික් දුර ගිහින් අම්මාගෙන් අතරමං වුණා. අම්මා දරුවා සොයමින් "මගේ දරුවා! මගේ දරුවා!" කියා කෑ ගසන්න පටන් ගත්තා.']],
          ['وَجَدَتِ الأُمُّ طِفْلَهَا مَالِك وَقَالَتْ: <mark>لَا تَتْرُكْ</mark> يَدِي أَبَدًا مَرَّةً أُخْرَى.',['தாய் மாலிக்கைக் கண்டுபிடித்து, "இனி ஒருபோதும் என் கையை விடாதே" என்றாள்.','The mother found Mālik and said, "Never let go of my hand again."','අම්මා මාලික්ව හොයාගෙන "ආයෙ කවදාවත් මගේ අත අත්හරින්න එපා" කීවා.']]])+
        block('اِصْبِرْ وَفَكِّرْ','🔧💡',['பொறுமையாக இரு, யோசி','Be patient and think','ඉවසන්න, සිතන්න'],[
          ['حُسَامٌ غُلَامٌ <mark>نَاجِحٌ</mark> فِي دِرَاسَتِهِ وَيُرِيدُ أَنْ <mark>يُصْبِحَ</mark> مُهَنْدِسًا نَاجِحًا أَيْضًا.',['ஹுஸாம் படிப்பில் வெற்றிகரமான ஒரு சிறுவன்; வெற்றிகரமான பொறியியலாளராகவும் ஆக விரும்புகிறான்.','Ḥusām is a boy who does well in his studies, and he wants to become a successful engineer too.','හුසාම් ඉගෙනීමේ සාර්ථක කොලුවෙක්; සාර්ථක ඉංජිනේරුවෙක් වෙන්නත් කැමතියි.']],
          ['كَانَ يَقُومُ بِبَعْضِ <mark>التَّجَارِبِ</mark> وَلٰكِنَّهُ <mark>لَمْ يَسْتَطِعْ</mark> إِتْمَامَ المُهِمَّةِ فَيَحْزَنُ كَثِيرًا، فَقَالَتْ لَهُ أُمُّهُ: المُهَنْدِسُ المَاهِرُ <mark>لَا يَيْأَسُ</mark>.',['அவன் சில சோதனைகள் செய்தான்; ஆனால் வேலையை முடிக்க முடியவில்லை, மிகவும் கவலைப்பட்டான். அவன் தாய் சொன்னாள்: "திறமையான பொறியியலாளர் நம்பிக்கை இழப்பதில்லை.','He was doing some experiments, but he could not finish the task, and it made him very sad. His mother said: "A skilled engineer does not despair.','ඔහු පරීක්ෂණ කිහිපයක් කළා; නමුත් කාර්යය අවසන් කරන්න බැරි වුණා, ඉතින් ගොඩක් දුක් වුණා. අම්මා කීවා: "දක්ෂ ඉංජිනේරුවා බලාපොරොත්තු අත් නොහරියි.']],
          ['<mark>لَا بُدَّ أَنْ</mark> تَصْبِرَ وَتُفَكِّرَ لِتَكُونَ <mark>مُبْدِعًا</mark> فِي حَلِّ كُلِّ المَشَاكِلِ.',['எல்லாப் பிரச்சினைகளையும் தீர்ப்பதில் புதுமையாளனாக ஆக, நீ பொறுமையாக இருந்து யோசிக்க வேண்டும்."','You must be patient and think, so that you become creative in solving every problem."','සෑම ගැටලුවක්ම විසඳීමේදී නිර්මාණශීලී වෙන්න, ඔබ ඉවසා සිතිය යුතුයි."']]])+
        block('يَوْمُ العُطْلَةِ','🏖️',['விடுமுறை நாள்','The day off','නිවාඩු දවස'],[
          ['ذَهَبَ حَازِمٌ إِلَى <mark>الشَّاطِئِ</mark> مَعَ عَائِلَتِهِ فِي العُطْلَةِ. ذَهَبَتْ أُمُّهُ مَعَهُ إِلَى السُّوقِ لِشِرَاءِ بَعْضِ الحَاجَاتِ ثُمَّ ذَهَبُوا <mark>جَمِيعًا</mark> بِالسَّيَّارَةِ إِلَى الشَّاطِئِ.',['விடுமுறையில் ஹாஸிம் தன் குடும்பத்துடன் கடற்கரைக்குப் போனான். அவன் தாய் சில பொருட்கள் வாங்க அவனுடன் சந்தைக்குப் போனார்; பிறகு எல்லோரும் காரில் கடற்கரைக்குப் போனார்கள்.','Ḥāzim went to the beach with his family on the holiday. His mother went with him to the market to buy a few things, then they all went together by car to the beach.','නිවාඩුවේ හාසිම් පවුලත් එක්ක වෙරළට ගියා. අම්මා බඩු ටිකක් ගන්න ඔහු එක්ක වෙළඳපොළට ගියා; ඊට පස්සේ හැමෝම කාරෙකින් වෙරළට ගියා.']],
          ['وَ<mark>عِنْدَ وُصُولِ</mark> الأُسْرَةِ <mark>قَابَلَتْ</mark> أُخْتُهُ صَدِيقَاتِهَا ثُمَّ ذَهَبْنَ لِلسِّبَاحَةِ.',['குடும்பம் வந்து சேர்ந்தபோது, அவன் சகோதரி தன் தோழிகளைச் சந்தித்தாள்; பிறகு அவர்கள் நீந்தப் போனார்கள்.','When the family arrived, his sister met her friends, and then they went swimming.','පවුල ළඟා වූ විට, ඔහුගේ සහෝදරිය යෙහෙළියන් හමු වුණා; ඊට පස්සේ ඔවුන් පීනන්න ගියා.']],
          ['<mark>اِسْتَمْتَعَتِ</mark> الأُسْرَةُ بِالعُطْلَةِ كَثِيرًا حَيْثُ <mark>قَضَتْ وَقْتًا مُمْتِعًا</mark>.',['குடும்பம் விடுமுறையை மிகவும் அனுபவித்தது; இனிய நேரத்தைக் கழித்தது.','The family enjoyed the holiday very much, for it spent a pleasant time.','පවුල නිවාඩුව බොහෝ සෙයින් වින්දා; රසවත් කාලයක් ගත කළා.']]])+
      '</div>'},

    /* 6 — grammar from the stories */
    {type:'html',title:['கதைகளிலிருந்து இலக்கணம்','Grammar from the stories','කතාවලින් ව්‍යාකරණ'],
     intro:['கதைகளில் வந்த சிறிய இலக்கணக் குறிப்புகள்; பலவற்றை முன்பே சந்தித்திருக்கிறீர்கள்.','Small grammar points from the stories; you have met many of them before.','කතාවල ආ කුඩා ව්‍යාකරණ කරුණු; ඒවායින් බොහොමයක් කලින් හමු වී ඇත.'],
     html:'<div class="eq">'+WB('أَلْقَى',['போட்டான், எறிந்தான்','threw down','වීසි කළා'])+'<span class="op">→</span>'+WB('مُلْقًى',['போடப்பட்டது, கிடக்கிறது','thrown down, lying','වැටී ඇති'],'add')+'</div>'+
      '<div class="note-box">'+bi('<span class="arw">مُلْقًى</span> என்பது <span class="arw">اسْمُ مَفْعُولٍ</span>: செயல் யார் மீது நடந்ததோ அது. <span class="arw">كِتَابًا مُلْقًى</span> = போடப்பட்டுக் கிடந்த புத்தகம்.','<span class="arw">مُلْقًى</span> is an <span class="arw">اسْمُ مَفْعُولٍ</span>: the thing the action was done to. <span class="arw">كِتَابًا مُلْقًى</span> = a book that had been thrown down, lying there.','<span class="arw">مُلْقًى</span> යනු <span class="arw">اسْمُ مَفْعُولٍ</span>: ක්‍රියාව සිදු වූ දෙය. <span class="arw">كِتَابًا مُلْقًى</span> = වීසි කර තිබූ පොතක්.')+'</div>'+
      '<div class="exlist">'+
        rx('😲','<mark>يَا لَهُ مِنْ</mark> كِتَابٍ عَجِيبٍ!',['வியப்பு: "என்ன ஒரு…!" இது அழைக்கும் <span class="arw">يَا</span> அல்ல (19-ஆம் புத்தகம்).','Wonder: "What a…!" This is not the <span class="arw">يَا</span> of calling someone (booklet 19).','විශ්මය: "මොනතරම්…ද!" මෙය කෙනෙකු ඇමතීමේ <span class="arw">يَا</span> නොවේ (19 වන පොත).'])+
        rx('🐾','وَ<mark>كَانَتِ</mark> الحَيَوَانَاتُ مُنْدَهِشَةً.',['மனிதர் அல்லாதவற்றின் பன்மை → பெண்பால் வினை <span class="arw">كَانَتْ</span>.','A plural of non-humans → feminine verb <span class="arw">كَانَتْ</span>.','මිනිසුන් නොවන දේවල බහුවචනය → ස්ත්‍රී ලිංග ක්‍රියාව <span class="arw">كَانَتْ</span>.'])+
        rx('📢','<mark>صَارَتْ</mark> تَصْرُخُ',['<span class="arw">صَارَ</span> + வினை = "-க்கத் தொடங்கினாள்": கத்தத் தொடங்கினாள்.','<span class="arw">صَارَ</span> + a verb = "began to": she began to shout.','<span class="arw">صَارَ</span> + ක්‍රියාව = "පටන් ගත්තා": කෑ ගසන්න පටන් ගත්තා.'])+
        rx('🚫','<mark>لَمْ يَسْتَطِعْ</mark> إِتْمَامَ المُهِمَّةِ',['<span class="arw">لَمْ</span> வினையின் கடைசியில் சுகூன் இடுகிறது (<span class="arw">يَسْتَطِيعُ → لَمْ يَسْتَطِعْ</span>), பொருள் இறந்தகாலம் ஆகிறது: முடியவில்லை (15-ஆம் புத்தகம்).','<span class="arw">لَمْ</span> puts a sukūn on the end (<span class="arw">يَسْتَطِيعُ → لَمْ يَسْتَطِعْ</span>) and turns the meaning to the past: he could not (booklet 15).','<span class="arw">لَمْ</span> ක්‍රියාවේ අගට සුකූන් තබයි (<span class="arw">يَسْتَطِيعُ → لَمْ يَسْتَطِعْ</span>), අර්ථය අතීතයට හරවයි: බැරි වුණා (15 වන පොත).'])+
        rx('❗','<mark>لَا بُدَّ أَنْ</mark> تَصْبِرَ',['"தப்பிக்க வழியே இல்லை" → "கட்டாயம் வேண்டும்": நீ பொறுமையாக இருக்க வேண்டும்.','"There is no escape from" → "must": you must be patient.','"ගැලවීමක් නැත" → "අනිවාර්යයෙන්": ඔබ ඉවසිය යුතුයි.'])+
        rx('✋','<mark>لَا تَتْرُكْ</mark> يَدِي',['தடை: <span class="arw">لَا</span> + சுகூன் = "விடாதே" (16-ஆம் புத்தகத்தின் <span class="arw">لَا تَأْكُلْ</span> போல).','A prohibition: <span class="arw">لَا</span> + sukūn = "do not let go" (like <span class="arw">لَا تَأْكُلْ</span> in booklet 16).','තහනම: <span class="arw">لَا</span> + සුකූන් = "අත්හරින්න එපා" (16 වන පොතේ <span class="arw">لَا تَأْكُلْ</span> මෙන්).'])+
        rx('🚗','<mark>عِنْدَ وُصُولِ</mark> الأُسْرَةِ',['<span class="arw">عِنْدَ</span> + மஸ்தர் = "…-ஆன போது": குடும்பம் வந்து சேர்ந்தபோது.','<span class="arw">عِنْدَ</span> + a maṣdar = "at the time of": when the family arrived.','<span class="arw">عِنْدَ</span> + මස්දර් = "…විට": පවුල ළඟා වූ විට.'])+
        rx('✅','الإِسْلَامُ هُوَ <mark>الحَلُّ</mark>',['<span class="arw">حَلّ</span> = தீர்வு: "இஸ்லாமே தீர்வு". <span class="arw">مُبْدِع</span> = புதுமையாளன், <span class="arw">إِبْدَاع</span> = படைப்பாற்றல்.','<span class="arw">حَلّ</span> = a solution: "Islam is the solution". <span class="arw">مُبْدِع</span> = creative, <span class="arw">إِبْدَاع</span> = creativity.','<span class="arw">حَلّ</span> = විසඳුම: "ඉස්ලාමය විසඳුමයි". <span class="arw">مُبْدِع</span> = නිර්මාණශීලී, <span class="arw">إِبْدَاع</span> = නිර්මාණශීලිත්වය.'])+
      '</div>'},

    /* 7 — the exception */
    {type:'html',title:['<span class="arw">الاِسْتِثْنَاءُ</span>: "…தவிர"','<span class="arw">الاِسْتِثْنَاءُ</span>: "except…"','<span class="arw">الاِسْتِثْنَاءُ</span>: "…හැර"'],
     intro:['பாடம் 29-இன் இரண்டாம் பகுதி. ஒரு குழுவைப் பற்றிச் சொல்லி, அதிலிருந்து ஒருவரை வெளியே எடுத்தல். <span class="arw">لَا إِلٰهَ إِلَّا اللّٰهُ</span>-இல் இதை முதலில் சந்தித்தோம்.','Part two of Lesson 29. Say something about a group, then take one out of it. You first met it in <span class="arw">لَا إِلٰهَ إِلَّا اللّٰهُ</span>.','29 වන පාඩමේ දෙවන කොටස. කණ්ඩායමක් ගැන යමක් කියා, එයින් එක් අයෙක් ඉවත් කිරීම. මුලින්ම හමු වූයේ <span class="arw">لَا إِلٰهَ إِلَّا اللّٰهُ</span> හිදීය.'],
     html:'<div class="eq"><span class="emo" style="font-size:30px;letter-spacing:2px">🧑‍🎓🧑‍🎓🧑‍🎓🧑‍🎓🧑‍🎓</span><span class="op">−</span><span class="emo" style="font-size:30px;opacity:.4">🧑‍🎓</span></div>'+
      '<div class="exrow"><span class="arw" lang="ar" style="font-size:30px;line-height:2">حَضَرَ '+MW('الطُّلَّابُ',1)+' '+MW('إِلَّا',5)+' '+MW('طَالِبًا',3)+'.</span>'+
        bi('ஒரு மாணவனைத் தவிர மாணவர்கள் (எல்லோரும்) வந்தார்கள்.','The students came, except one student.','එක් සිසුවෙකු හැර සිසුන් (සියල්ලෝම) ආවා.')+'</div>'+
      '<div class="breakdown" style="direction:rtl">'+
        bd('الطُّلَّابُ','المُسْتَثْنَى مِنْهُ',['குழு (விடப்படலாம்)','the group (may be left out)','කණ්ඩායම (අත්හැරිය හැක)'],1)+
        bd('إِلَّا','أَدَاةُ الاِسْتِثْنَاءِ',['கருவி','the tool','මෙවලම'],5)+
        bd('طَالِبًا','المُسْتَثْنَى',['வெளியே எடுக்கப்பட்டவர்','the one taken out','ඉවත් කළ අය'],3)+
      '</div>'+
      '<div class="callout"><h3>'+TE('கருவிகள்: <span class="arw">إِلَّا</span> மற்றும் அதன் சகோதரிகள்','The tools: <span class="arw">إِلَّا</span> and its sisters','මෙවලම්: <span class="arw">إِلَّا</span> සහ එහි සහෝදරියන්')+'</h3>'+
        '<div class="eq"><span class="chip" style="background:var(--mark)"><span class="arw" lang="ar">إِلَّا</span></span><span class="chip"><span class="arw" lang="ar">غَيْرُ</span></span><span class="chip"><span class="arw" lang="ar">سِوَى</span></span><span class="chip"><span class="arw" lang="ar">خَلَا</span></span><span class="chip"><span class="arw" lang="ar">عَدَا</span></span><span class="chip"><span class="arw" lang="ar">حَاشَا</span></span></div>'+
        bi('இந்தப் பாடத்தில் <span class="arw">إِلَّا</span> மட்டும்; மற்ற ஐந்துக்கும் தனி விதிகள் உண்டு. தமிழில் "தவிர" பின்னால் வருகிறது (ஒரு மாணவனைத் தவிர); அரபியில் <span class="arw">إِلَّا</span> முன்னால்.','This lesson takes <span class="arw">إِلَّا</span> only; the other five have rules of their own. Tamil and Sinhala put "except" after the word (ஒரு மாணவனைத் தவிர, එක් සිසුවෙකු හැර); Arabic puts <span class="arw">إِلَّا</span> before it.','මෙම පාඩමේ <span class="arw">إِلَّا</span> පමණි; අනෙක් පහට තමන්ගේම නීති ඇත. සිංහලයේ "හැර" පසුව එයි (එක් සිසුවෙකු හැර); අරාබියේ <span class="arw">إِلَّا</span> ඉදිරියෙන්.')+
      '</div>'+
      '<div class="callout"><h3>'+TE('இரண்டு கேள்விகள் எல்லாவற்றையும் தீர்மானிக்கின்றன','Two questions decide everything','ප්‍රශ්න දෙකක් සියල්ල තීරණය කරයි')+'</h3><div class="ladder">'+
        '<div class="rung"><div class="num">1</div><div class="qtext">'+TE('மறுப்பு (<span class="arw">مَا</span>, <span class="arw">لَا</span>) உண்டா?','Is there a negation (<span class="arw">مَا</span>, <span class="arw">لَا</span>)?','නිෂේධයක් (<span class="arw">مَا</span>, <span class="arw">لَا</span>) තිබේද?')+'</div><div class="ans"><span class="chip"><span class="arw" lang="ar">مُثْبَت / مَنْفِيّ</span></span></div></div>'+
        '<div class="rung"><div class="num">2</div><div class="qtext">'+TE('குழு வாக்கியத்தில் இருக்கிறதா?','Is the group in the sentence?','කණ්ඩායම වාක්‍යයේ තිබේද?')+'</div><div class="ans"><span class="chip"><span class="arw" lang="ar">تَامّ / نَاقِص</span></span></div></div>'+
      '</div>'+bi('<span class="arw">تَامّ</span> = மூன்று பகுதிகளும் இருக்கின்றன ("முழு வாக்கியம்" என்று பொருளல்ல). குழு இல்லையென்றால் <span class="arw">نَاقِص</span>.','<span class="arw">تَامّ</span> means all three parts are there (not "a full sentence"). If the group is missing, it is <span class="arw">نَاقِص</span>.','<span class="arw">تَامّ</span> = කොටස් තුනම ඇත ("සම්පූර්ණ වාක්‍යයක්" යන්න නොවේ). කණ්ඩායම නැත්නම් <span class="arw">نَاقِص</span>.')+'</div>'},

    /* 8 — the three cases */
    {type:'html',title:['<span class="arw">إِلَّا</span>-இன் மூன்று நிலைகள்','The three cases of <span class="arw">إِلَّا</span>','<span class="arw">إِلَّا</span> හි අවස්ථා තුන'],
     intro:['ஒவ்வொரு நிலையிலும் <span class="arw">إِلَّا</span>-க்குப் பின் வரும் சொல்லின் முடிவு வேறு.','In each case the word after <span class="arw">إِلَّا</span> takes a different ending.','එක් එක් අවස්ථාවේ <span class="arw">إِلَّا</span> ට පසු වචනයේ අවසානය වෙනස්.'],
     html:'<div class="exlist">'+
        block('تَامٌّ مُثْبَتٌ','1️⃣',['குழு உண்டு, மறுப்பு இல்லை → கட்டாயம் நஸ்ப்','group stated, no negation → must be naṣb (<span class="arw">وَاجِبُ النَّصْبِ</span>)','කණ්ඩායම ඇත, නිෂේධය නැත → අනිවාර්යයෙන් නස්බ්'],[
          ['حَضَرَ الطُّلَّابُ إِلَّا <mark>طَالِبًا</mark>.',['ஒரு மாணவனைத் தவிர மாணவர்கள் வந்தார்கள்.','The students came, except one student.','එක් සිසුවෙකු හැර සිසුන් ආවා.']],
          ['فَهِمْتُ الدَّرْسَ إِلَّا <mark>فِقْرَةً</mark>.',['ஒரு பந்தியைத் தவிரப் பாடத்தைப் புரிந்துகொண்டேன்.','I understood the lesson, except one paragraph.','එක් ඡේදයක් හැර පාඩම තේරුම් ගත්තා.']]])+
        block('تَامٌّ مَنْفِيٌّ','2️⃣',['குழு உண்டு, மறுப்பு உண்டு → நஸ்ப், அல்லது குழுவின் அதே முடிவு (<span class="arw">بَدَل</span>)','group stated, with negation → naṣb, or the same ending as the group (<span class="arw">بَدَل</span>)','කණ්ඩායම ඇත, නිෂේධය ඇත → නස්බ්, හෝ කණ්ඩායමේම අවසානය (<span class="arw">بَدَل</span>)'],[
          ['مَا حَضَرَ الطُّلَّابُ إِلَّا <mark>طَالِبًا</mark> / <mark>طَالِبٌ</mark>',['ஒரு மாணவனைத் தவிர மாணவர்கள் வரவில்லை. இரண்டும் சரி: <span class="arw">طَالِبٌ</span> என்பது <span class="arw">الطُّلَّابُ</span>-இன் ழம்மாவைப் பின்பற்றுகிறது.','The students did not come, except one. Both are right: <span class="arw">طَالِبٌ</span> copies the ḍamma of <span class="arw">الطُّلَّابُ</span>.','එක් සිසුවෙකු හැර සිසුන් ආවේ නැත. දෙකම නිවැරදියි: <span class="arw">طَالِبٌ</span>, <span class="arw">الطُّلَّابُ</span> හි ළම්මාව අනුගමනය කරයි.']],
          ['مَا رَأَيْتُ الطُّلَّابَ إِلَّا <mark>طَالِبًا</mark>',['இங்கே இரண்டு வழிகளும் ஒரே சொல்லைத் தருகின்றன: குழுவே நஸ்பில் இருக்கிறது.','Here both roads give the same word: the group itself is in naṣb.','මෙහි මාර්ග දෙකම එකම වචනය දෙයි: කණ්ඩායමම නස්බ්හි ඇත.']]])+
        block('نَاقِصٌ مَنْفِيٌّ (المُفَرَّغُ)','3️⃣',['குழு இல்லை, மறுப்பு உண்டு → வாக்கியத்தில் அதன் இடத்தைப் பொறுத்து','group left out, with negation → by its place in the sentence','කණ්ඩායම නැත, නිෂේධය ඇත → වාක්‍යයේ එහි ස්ථානය අනුව'],[])+

        '<div class="dt-wrap"><table class="dt"><tbody>'+

          strike(S+'مَا</s> قَرَأْتُ '+S+'إِلَّا</s> كِتَابًا','قَرَأْتُ كِتَابًا',['செயப்படுபொருள் → ஃபத்ஹா','object → fatḥa','කර්මය → ෆත්හා'])+
          strike(S+'مَا</s> اعْتَمَدْتُ '+S+'إِلَّا</s> عَلَى نَفْسِي','اِعْتَمَدْتُ عَلَى نَفْسِي',['முன்னிடைக்குப் பின் → கஸ்ரா','after a preposition → kasra','පූර්ව නිපාතයට පසු → කස්රා'])+

    if(b.learn){
      s+='<div class="learn"><h3>'+ONE('இந்தப் புத்தகத்தில்','In this booklet','මෙම පොතේ')+'</h3><ul>';
      b.learn.forEach(function(l){s+='<li><div>'+TE(l[0],l[1],l[2])+'</div></li>';});
      s+='</ul></div>';
    }
    s+='<div class="cover-src">'+ONE('உங்கள் குறிப்புகளிலிருந்து: ','From your notes: ','ඔබේ සටහන් වලින්: ')+m.src+'</div>';
    return {cls:'cover',style:'--c:'+color(m.no),html:s};
  }

  function cardHTML(c){
    var s='<div class="card tap" tabindex="0">';
    if(c.tag)s+='<span class="tag one '+c.tag[0]+'">'+TE(c.tag[1],c.tag[2],c.tag[3])+'</span>';
    s+='<div class="pic" aria-hidden="true">'+c.pic+'</div>';
    s+='<div class="arw cw" lang="ar">'+c.ar+'</div>';
    if(c.tr)s+='<div class="tr">'+c.tr+'</div>';
    s+='<div class="mean hideable">'+TE(c.ta,c.en,c.si,'div')+'</div>';
    if(c.note)s+='<div class="note hideable">'+bi(c.note[0],c.note[1],c.note[2])+'</div>';
    if(c.ex)s+='<div class="ex"><span class="arw" lang="ar">'+c.ex[0]+'</span><div class="hideable">'+bi(c.ex[1],c.ex[2],c.ex[3])+'</div></div>';
    return s+'</div>';
  }

  function seeded(n){var x=(n*7919+17)%233280;return function(){x=(x*9301+49297)%233280;return x/233280;};}
  function shuffle(arr,rnd){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function bookCards(b){var out=[];b.pages.forEach(function(p){if(p.type==='cards')p.cards.forEach(function(c){out.push(c);});});return out;}
  /* Picture quiz built from the booklet's own cards: odd items show picture + meaning → pick the Arabic;
     even items show the Arabic → pick the picture. */
  function picQuiz(b,n){
    var rnd=seeded(b.no),cards=shuffle(bookCards(b).filter(function(c){return !c.noQuiz;}),rnd),items=[];
    for(var i=0;i<cards.length&&items.length<n;i++){
      var c=cards[i],toPic=items.length%2===1;
      var pool=shuffle(cards.filter(function(d){return d.ar!==c.ar&&d.pic!==c.pic&&d.ta!==c.ta;}),rnd).slice(0,2);
      if(pool.length<2)continue;
      var opts=shuffle([c].concat(pool),rnd),a=opts.indexOf(c);
      var why=[A(c.ar)+' = '+c.ta,A(c.ar)+' = '+c.en,A(c.ar)+' = '+c.si];
      if(toPic)items.push({q:'<div class="pq">'+A(c.ar,'big')+'</div>',opts:opts.map(function(o){return o.pic;}),optCls:'pic-opt',a:a,why:why});
      else items.push({q:'<div class="pq"><span class="pq-pic" aria-hidden="true">'+c.pic+'</span><div class="pq-mean">'+TE(c.ta,c.en,c.si,'div')+'</div></div>',opts:opts.map(function(o){return o.ar;}),a:a,why:why});
    }
    return items;
  }
  function quizHTML(items){
    var s='<div class="quiz">';
    items.forEach(function(q,i){
      s+='<div class="q" data-a="'+q.a+'"><div class="qn">'+(i+1)+'</div><div class="qbody"><div class="qprompt">'+q.q+'</div><div class="opts" dir="'+(q.optCls==='txt-opt'?'ltr':'rtl')+'">';
      q.opts.forEach(function(o,j){s+='<button type="button" class="opt '+(q.optCls||'')+'" data-i="'+j+'">'+o+'</button>';});
      s+='</div><div class="why" hidden><p class="verdict"></p>'+bi(q.why[0],q.why[1],q.why[2])+'</div></div></div>';
    });
    return s+'</div><div class="score"><span class="score-text">'+ONE('ஒவ்வொரு கேள்விக்கும் ஒரு பதிலைத் தொடுங்கள்','Tap one answer for each question','සෑම ප්‍රශ්නයකටම එක් පිළිතුරක් ස්පර්ශ කරන්න')+'</span><button type="button" class="btn retry">'+ONE('மீண்டும்','Try again','නැවත')+'</button></div>';
  }

  function renderPage(p,b){
    if(p.type==='picquiz'){
      p={type:'quiz',items:picQuiz(b,p.n||8),
         title:p.title||['படக் கேள்விகள்','Picture quiz','පින්තූර ප්‍රශ්න'],
         intro:p.intro||['படத்தைப் பார்த்து அரபுச் சொல்லைத் தேர்ந்தெடுங்கள்; அல்லது அரபுச் சொல்லைப் பார்த்து படத்தைத் தேர்ந்தெடுங்கள்.','See the picture and pick the Arabic word, or see the Arabic word and pick the picture.','පින්තූරය බලා අරාබි වචනය තෝරන්න; නැතහොත් අරාබි වචනය බලා පින්තූරය තෝරන්න.']};
    }
    if(p.type==='sheet'&&p.auto){
      p={type:'sheet',title:p.title||['ஒரு பக்கச் சுருக்கம்','One-page summary','එක් පිටුවේ සාරාංශය'],intro:p.intro,
         rows:bookCards(b).filter(function(c){return !c.noSheet;}).map(function(c){return [c.pic,c.ar,c.ta,c.en,c.si];})};
    }
    var s=p.title?title(p.title):'';
    if(p.intro)s+=bi(p.intro[0],p.intro[1],p.intro[2]);
    if(p.before)s+=p.before;
    if(p.type==='cards'){
      s+='<div class="cards">'+p.cards.map(cardHTML).join('')+'</div>';
    }else if(p.type==='examples'){
      s+='<div class="exlist">';
      p.items.forEach(function(it){s+='<div class="exrow tap" tabindex="0"><span class="arw" lang="ar">'+it[0]+'</span><div class="hideable">'+bi(it[1],it[2],it[3])+'</div></div>';});
      s+='</div>';
    }else if(p.type==='quiz'){
      s+=quizHTML(p.items);
    }else if(p.type==='sheet'){
      s+='<div class="sheet-wrap"><table class="sheet"><thead><tr><th></th><th class="a">عربي</th><th class="ta">தமிழ்</th><th class="si">සිංහල</th><th class="en">English</th></tr></thead><tbody>';
      p.rows.forEach(function(r){s+='<tr><td class="p" aria-hidden="true">'+r[0]+'</td><td class="a" lang="ar">'+r[1]+'</td><td class="ta" lang="ta">'+r[2]+'</td><td class="si" lang="si">'+(r[4]||'')+'</td><td class="en">'+r[3]+'</td></tr>';});
      s+='</tbody></table></div>';
    }
    if(p.html)s+=p.html;
    if(p.after)s+=p.after;
    return {cls:'',html:s};
  }

  function endNav(b){
    var i=readyNos.indexOf(b.no);
    var prev=i>0?MANIFEST[readyNos[i-1]-1]:null, next=i<readyNos.length-1?MANIFEST[readyNos[i+1]-1]:null;
    var s='<nav class="endnav" aria-label="Booklets">';
    if(prev)s+='<a href="#book-'+prev.no+'"><small>← '+ONE('முந்தைய புத்தகம்','Previous booklet','පෙර පොත')+'</small><span class="t">'+prev.no+'. '+ONE(prev.ta,prev.en,prev.si)+'</span></a>';
    else s+='<a href="#"><small>← '+ONE('நூலகம்','Library','පුස්තකාලය')+'</small><span class="t">'+ONE('எல்லாப் புத்தகங்களும்','All booklets','සියලු පොත්')+'</span></a>';
    if(next)s+='<a class="next" href="#book-'+next.no+'"><small>'+ONE('அடுத்த புத்தகம்','Next booklet','ඊළඟ පොත')+' →</small><span class="t">'+next.no+'. '+ONE(next.ta,next.en,next.si)+'</span></a>';
    else s+='<a class="next" href="#"><small>'+ONE('நூலகம்','Library','පුස්තකාලය')+' →</small><span class="t">'+ONE('மேலும் புத்தகங்கள் விரைவில்','More booklets coming','තවත් පොත් ඉක්මනින්')+'</span></a>';
    return s+'</nav>';
  }

  function renderBook(b){
    var m=MANIFEST[b.no-1];
    var pages=[coverPage(b,m)].concat(b.pages.map(function(p){return renderPage(p,b);}));
    var h=toolbar(m)+'<main class="pages">';
    pages.forEach(function(p,i){
      h+='<section class="page '+p.cls+'" id="p'+(i+1)+'"'+(p.style?' style="'+p.style+'"':'')+'>'+p.html+
        '<footer class="page-foot">'+ONE('பக்கம் '+(i+1),'Page '+(i+1),'පිටුව '+(i+1))+' · <span class="arw" lang="ar">'+arNum(i+1)+'</span></footer></section>';
    });
    h+=endNav(b)+'</main>';
    app.innerHTML=h;
  }

  var arrivalHelpChecked=false;
  function showArrivalHelp(){
    if(arrivalHelpChecked)return;
    arrivalHelpChecked=true;
    var help=document.querySelector('.language-help');
    if(!help)return;
    try{
      if(localStorage.getItem('arabic-booklets-language-help-seen'))return;
    }catch(e){}
    help.open=true;
    try{localStorage.setItem('arabic-booklets-language-help-seen','1');}catch(e){}
  }

  function route(){
    var mm=/^#book-(\d+)$/.exec(location.hash||'');
    if(mm&&byNo[+mm[1]])renderBook(byNo[+mm[1]]);else renderLibrary();
    applyPrefs();
    showArrivalHelp();
    window.scrollTo(0,0);
  }

  function updateScore(page){
    var qs=page.querySelectorAll('.q'),done=0,right=0;
    qs.forEach(function(q){if(q.dataset.done){done++;if(q.dataset.done==='right')right++;}});
    var t=page.querySelector('.score-text');if(!t)return;
    if(!done){t.innerHTML=ONE('ஒவ்வொரு கேள்விக்கும் ஒரு பதிலைத் தொடுங்கள்','Tap one answer for each question','සෑම ප්‍රශ්නයකටම එක් පිළිතුරක් ස්පර්ශ කරන්න');return;}
    var all=done===qs.length,n=qs.length;
    t.innerHTML=ONE((all?'முடிந்தது! ':'')+n+' கேள்விகளில் '+right+' சரி',(all?'Done! ':'')+right+' of '+n+' correct',(all?'අවසන්! ':'')+'ප්‍රශ්න '+n+' න් '+right+' ක් නිවැරදියි');
  }

  app.addEventListener('click',function(e){
    var closeHelp=e.target.closest('.language-help-close');
    if(closeHelp){
      var help=closeHelp.closest('details');
      help.open=false;
      help.querySelector('summary').focus();
      return;
    }
    var seg=e.target.closest('.seg button');
    if(seg){
      var l=seg.dataset.lang,on=LANGS.filter(function(x){return prefs.show[x];});
      if(prefs.show[l]&&on.length===1)return;
      prefs.show[l]=!prefs.show[l];savePrefs();applyPrefs();return;
    }
    if(e.target.closest('.flashbtn')){prefs.flash=!prefs.flash;savePrefs();applyPrefs();document.querySelectorAll('.tap.open').forEach(function(t){t.classList.remove('open');});return;}
    var opt=e.target.closest('.opt');
    if(opt){
      var q=opt.closest('.q');if(q.dataset.done)return;
      var a=+q.dataset.a,i=+opt.dataset.i;
      q.querySelectorAll('.opt').forEach(function(o){o.disabled=true;if(+o.dataset.i===a)o.classList.add('right');});
      var ok=i===a;if(!ok)opt.classList.add('wrong');
      q.dataset.done=ok?'right':'wrong';
      var w=q.querySelector('.why'),v=w.querySelector('.verdict');
      v.className='verdict '+(ok?'ok':'no');
      v.innerHTML=ok?ONE('சரி!','Correct!','නිවැරදියි!'):ONE('இல்லை — சரியான பதில் பச்சையில்.','Not quite. The right answer is in green.','නැහැ — නිවැරදි පිළිතුර කොළ පාටින්.');
      w.hidden=false;
      updateScore(q.closest('.page'));return;
    }
    var retry=e.target.closest('.retry');
    if(retry){
      var pg=retry.closest('.page');
      pg.querySelectorAll('.q').forEach(function(q){delete q.dataset.done;q.querySelector('.why').hidden=true;q.querySelectorAll('.opt').forEach(function(o){o.disabled=false;o.classList.remove('right','wrong');});});
      updateScore(pg);pg.scrollIntoView({block:'start'});return;
    }
    var tap=e.target.closest('.tap');
    if(tap&&document.body.classList.contains('flash'))tap.classList.toggle('open');
  });
  app.addEventListener('keydown',function(e){
    var tap=e.target.closest&&e.target.closest('.tap');
    if(tap&&(e.key==='Enter'||e.key===' ')&&document.body.classList.contains('flash')){e.preventDefault();tap.classList.toggle('open');}
  });
  window.addEventListener('hashchange',route);
  route();
})();
</script>

</html>
