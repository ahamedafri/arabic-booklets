<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Arabic Picture Booklets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&family=Hind+Madurai:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap">
<style>
/* Layout: a library shelf of booklet covers; each booklet opens as a single column of paper pages under a sticky toolbar.
   Languages: Tamil (blue), Sinhala (red-brown), English (grey); each can be switched off. */
:root{
  --bg:#e9f1ed; --paper:#ffffff; --paper-2:#f4f8f6; --ink:#14201c; --muted:#5d6b66; --line:#d5e0db;
  --accent:#0e7c66; --accent-soft:#dcefe8; --on-accent:#ffffff;
  --ta:#1b4d8c; --ta-line:#9fbbe0; --si:#93391a; --si-line:#e2ab92; --en:#56625d;
  --pf:#d7eee6; --pm:#fbedc8;
  --m:#0d6c88; --m-soft:#dbedf3; --f:#a03d77; --f-soft:#f6e0ec;
  --good:#1e7a3c; --good-soft:#e0f2e5; --bad:#b2352e; --bad-soft:#f8e1df;
  --mark:#ffe27a;
  --font-display:"Baloo Thambi 2","Noto Sans Sinhala","Hind Madurai","Nirmala UI",system-ui,sans-serif;
  --font-body:"Hind Madurai","Noto Sans Sinhala","Nirmala UI","Latha",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-si:"Noto Sans Sinhala","Iskoola Pota","Nirmala UI",system-ui,sans-serif;
  --font-ar:"Noto Naskh Arabic","Traditional Arabic","Segoe UI",serif;
  --font-emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --tap-hint:"தொட்டுப் பாருங்கள்";
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1715; --paper:#17221f; --paper-2:#1d2a26; --ink:#e5ede9; --muted:#98a9a3; --line:#2b3a35;
    --accent:#43c4a2; --accent-soft:#17362d; --on-accent:#04110d;
    --ta:#92bbf2; --ta-line:#3a5a86; --si:#f1a487; --si-line:#7a4330; --en:#aab7b1;
    --pf:#183a30; --pm:#3b3113;
    --m:#6cc5e1; --m-soft:#12303a; --f:#e98dc1; --f-soft:#3a1a2c;
    --good:#72d391; --good-soft:#163424; --bad:#f28b84; --bad-soft:#3e1b19;
    --mark:#6a5814;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1715; --paper:#17221f; --paper-2:#1d2a26; --ink:#e5ede9; --muted:#98a9a3; --line:#2b3a35;
  --accent:#43c4a2; --accent-soft:#17362d; --on-accent:#04110d;
  --ta:#92bbf2; --ta-line:#3a5a86; --si:#f1a487; --si-line:#7a4330; --en:#aab7b1;
  --pf:#183a30; --pm:#3b3113;
  --m:#6cc5e1; --m-soft:#12303a; --f:#e98dc1; --f-soft:#3a1a2c;
  --good:#72d391; --good-soft:#163424; --bad:#f28b84; --bad-soft:#3e1b19;
  --mark:#6a5814;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
body.hide-ta{--tap-hint:"ස්පර්ශ කර බලන්න"}
body.hide-ta.hide-si{--tap-hint:"tap to check"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.arw{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate;color:var(--ink);font-weight:400}
.ta{font-family:var(--font-body);color:var(--ta)}
.si{font-family:var(--font-si);color:var(--si)}
.en{color:var(--en)}
body.hide-ta .ta, body.hide-si .si, body.hide-en .en{display:none!important}
/* .one: show only the first switched-on language (small labels) */
body:not(.hide-ta) .one .si, body:not(.hide-ta) .one .en, body.hide-ta:not(.hide-si) .one .en{display:none!important}
/* .stack: first switched-on language big, the rest small underneath */
.stack{display:flex;flex-direction:column;gap:0}
.stack>.ta,.stack>.si,.stack>.en{font-size:var(--small,15px);line-height:1.4;font-weight:500;margin:0}
.stack>.ta, body.hide-ta .stack>.si, body.hide-ta.hide-si .stack>.en{font-family:var(--font-display);font-size:var(--big,26px);font-weight:700;color:var(--ink);line-height:1.25}
mark{background:var(--mark);color:inherit;border-radius:5px;padding:0 4px}
.emo{font-family:var(--font-emoji);font-style:normal}

/* Toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:8px}
.tb-in{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px}
.tb-back{font-weight:600;text-decoration:none;white-space:nowrap}
.tb-back .ta, .tb-back .si, .tb-back .en{color:var(--accent)}
.tb-title{font-family:var(--font-display);font-weight:700;font-size:16px;flex:1 1 120px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .ta, .tb-title .si, .tb-title .en{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:34px;white-space:nowrap;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.language-help{position:relative}
.language-help summary{list-style:none;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--accent);font-weight:700;cursor:pointer}
.language-help summary::-webkit-details-marker{display:none}
.language-help-close{position:absolute;right:6px;top:6px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:var(--paper);color:var(--ink);font-size:22px;cursor:pointer}
.language-help-panel{position:fixed;right:12px;z-index:2;width:min(15rem,calc(100vw - 2rem));padding:12px 48px 12px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px #0002}
.seg button[data-lang="si"]{font-family:var(--font-si)}
.flashbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:34px;white-space:nowrap}
.flashbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.flashbtn[aria-pressed="true"] .ta, .flashbtn[aria-pressed="true"] .si, .flashbtn[aria-pressed="true"] .en{color:var(--paper)}

/* Library */
.lib{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:34px;padding-top:22px}
.lib-head{display:flex;flex-direction:column;gap:10px;max-width:760px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lib-head h1{font-family:var(--font-display);font-size:clamp(32px,6vw,46px);font-weight:800;line-height:1.1}
.lib-sub{font-family:var(--font-display);font-size:clamp(17px,2.6vw,21px);font-weight:600;line-height:1.4}
.lib-sub.si{font-family:var(--font-si)}
.bi{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 22px}
@media (min-width:641px){body.n2 .bi{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.bi>p{padding-left:11px;border-left:3px solid var(--line)}
.bi>p.ta{border-left-color:var(--ta-line)}
.bi>p.si{border-left-color:var(--si-line)}




.seg button[aria-pressed="true"]::before{content:"✓";margin-inline-end:.35em}


.shelf-head{border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px;--big:22px;--small:15px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.bookcard{--c:#0f9b7a;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:246px;padding:14px 14px 14px 22px;
  background:var(--paper);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:5px 14px 14px 5px;text-decoration:none;color:var(--ink);
  box-shadow:0 10px 22px -16px rgba(0,0,0,.35);transition:transform .15s ease, box-shadow .15s ease}
a.bookcard:hover{transform:translateY(-3px);box-shadow:0 16px 26px -16px rgba(0,0,0,.45)}
.bc-no{font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--c)}
.bc-pic{font-family:var(--font-emoji);font-size:44px;line-height:1.25;margin:4px 0}
.bc-ar{font-size:22px;line-height:1.6;font-weight:600;align-self:stretch;text-align:right}
.bc-titles{--big:17px;--small:13.5px;align-self:stretch}
.bc-src{font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.bc-status{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--accent-soft)}
.bc-status .ta,.bc-status .si,.bc-status .en{color:var(--accent)}
.bookcard.soon{opacity:.62;border-left-style:dashed;box-shadow:none}
.bookcard.soon .bc-status{background:var(--paper-2)}
.bookcard.soon .bc-status .ta,.bookcard.soon .bc-status .si,.bookcard.soon .bc-status .en{color:var(--muted)}

/* Booklet pages */
.pages{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-top:16px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px clamp(16px,4.5vw,36px) 16px;display:flex;flex-direction:column;gap:18px;
  box-shadow:0 1px 0 var(--line),0 14px 28px -22px rgba(0,0,0,.35);scroll-margin-top:72px;min-width:0}
.page-foot{margin-top:4px;border-top:1px dashed var(--line);padding-top:10px;text-align:center;font-size:12.5px;color:var(--muted)}
.page-foot .ta,.page-foot .si,.page-foot .en,.page-foot .arw{color:var(--muted)}
.page-foot .arw{font-size:14px}
.ptitle{--big:clamp(22px,4vw,27px);--small:15px}

/* Cover */
.cover{--c:#0f9b7a;align-items:center;text-align:center;gap:12px;border-top:12px solid var(--c);padding-top:30px}
.cover-art{width:min(210px,60vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--font-emoji);font-size:clamp(70px,18vw,104px);
  background:color-mix(in srgb,var(--c) 16%,var(--paper));border:3px solid color-mix(in srgb,var(--c) 45%,var(--paper))}
.cover-art .arw{font-size:clamp(90px,22vw,130px);line-height:1;color:var(--c)}
.cover-no{font-family:var(--font-display);font-weight:800;letter-spacing:.04em}
.cover-no .ta,.cover-no .si,.cover-no .en{color:var(--c)}
.cover-ar{font-size:clamp(30px,6vw,40px);line-height:1.6;font-weight:700}
.cover-titles{--big:clamp(26px,5vw,34px);--small:18px;align-items:center}
.learn{align-self:stretch;text-align:left;background:var(--paper-2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.learn h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.learn h3 .ta,.learn h3 .si,.learn h3 .en{color:var(--muted)}
.learn ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.learn li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.learn li::before{content:"✓";color:var(--c);font-weight:700}
.learn li span{display:block}
.learn li .ta,.learn li .si{font-weight:500}
.learn li .en{font-size:14px}
.cover-src{font-size:13px;color:var(--muted)}
.cover-src .ta,.cover-src .si,.cover-src .en{color:var(--muted)}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.card{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--paper-2);padding:14px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.card .pic{font-family:var(--font-emoji);font-size:46px;line-height:1.15}
.card .cw{font-size:36px;line-height:1.65;font-weight:600}
.card .tr{font-size:13px;color:var(--muted);font-style:italic;margin-top:-4px}
.mean{display:flex;flex-direction:column;gap:0}
.mean .ta,.mean .si{font-weight:600;font-size:17px;line-height:1.4}
.mean .si{font-size:16px}
.mean .en{font-size:14.5px}
.card .note{align-self:stretch;font-size:13.5px;text-align:left}
.card .note .bi, .card .ex .bi{grid-template-columns:minmax(0,1fr);gap:2px}
.card .note .bi>p, .card .ex .bi>p{border-left:0;padding-left:0}
.card .ex{align-self:stretch;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;text-align:center;font-size:13.5px}
.card .ex .arw{display:block;font-size:22px;line-height:1.8}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;align-self:center}
.tag .ta,.tag .si,.tag .en{color:var(--ink)}
.tag.pf{background:var(--pf)}
.tag.pm{background:var(--pm)}
body.flash .hideable{filter:blur(7px);opacity:.5;user-select:none;transition:filter .2s ease, opacity .2s ease}
body.flash .open .hideable{filter:none;opacity:1}
body.flash .tap{cursor:pointer}
body.flash .tap:not(.open)::after{content:var(--tap-hint);font-size:11.5px;color:var(--muted);margin-top:2px}

/* Text helpers */
.big{font-size:34px;line-height:1.7}
.note-box{background:var(--paper-2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.callout{border:2px solid var(--accent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--accent) 6%,var(--paper))}
.callout h3{font-family:var(--font-display);font-size:17px;font-weight:700}
.callout h3 .ta,.callout h3 .si,.callout h3 .en{color:var(--accent)}

/* Examples */
.exlist{display:flex;flex-direction:column;gap:12px}
.exrow{border-radius:14px;background:var(--paper-2);padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.exrow .arw{font-size:27px;line-height:1.85;text-align:right}
.exrow .bi>p{border-left:0;padding-left:0}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px 12px}
.qn{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center}
.qbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.qprompt .arw{font-size:26px;line-height:1.9}
.qprompt .bi>p{border-left:0;padding-left:0}
.blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--accent);margin:0 6px;vertical-align:baseline}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-family:var(--font-ar);font-size:22px;line-height:1.6;min-height:48px;padding:2px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink);text-decoration:line-through}
.why{font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.why .bi>p{border-left:0;padding-left:0}
.verdict{font-weight:700}
.verdict.ok .ta,.verdict.ok .si,.verdict.ok .en{color:var(--good)}
.verdict.no .ta,.verdict.no .si,.verdict.no .en{color:var(--bad)}
.score{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--paper-2);border-radius:14px;padding:12px 16px}
.score-text{font-weight:600}
.btn{border:1px solid var(--accent);background:var(--accent);border-radius:999px;padding:6px 16px;font-weight:600;cursor:pointer;min-height:38px}
.btn .ta,.btn .si,.btn .en{color:var(--on-accent)}

/* Summary sheet */
.sheet-wrap{overflow-x:auto}
.sheet{width:100%;border-collapse:collapse;font-size:15px}
.sheet th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
.sheet td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.sheet td.p{font-family:var(--font-emoji);font-size:24px;width:44px;text-align:center}
.sheet td.a{font-family:var(--font-ar);font-size:23px;direction:rtl;text-align:right;white-space:nowrap;font-weight:600}
.sheet th.a{text-align:right}

/* Word breakdown */
.breakdown{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:14px;padding:6px 16px 10px;background:var(--paper-2);min-width:96px;direction:ltr}
.bd.hl{border-color:var(--accent);background:var(--accent-soft)}
.bd .arw{font-size:34px;line-height:1.7}
.bd .ta,.bd .si{font-weight:600}
.bd .en{font-size:13.5px}
.readdir{text-align:center;font-size:14px;color:var(--muted)}
.readdir .ta, .readdir .si, .readdir .en{color:var(--muted)}
.qmarks{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.qm{display:flex;flex-direction:column;align-items:center;border-radius:16px;background:var(--paper-2);padding:6px 26px 12px;min-width:130px;text-align:center}
.qm-glyph{font-size:72px;line-height:1.2;font-weight:700;font-family:var(--font-display);color:var(--accent)}
.qm-glyph.arw{font-family:var(--font-ar);color:var(--accent)}
.qm .ta,.qm .si{font-weight:600}
.qm .en{font-size:13.5px}

/* Ladder */
.ladder{display:flex;flex-direction:column}
.rung{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(0,auto);gap:10px 14px;align-items:center;padding:12px 0}
.rung .num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700}
.rung .qtext span{display:block}
.rung .qtext .ta,.rung .qtext .si{font-weight:600}
.rung .qtext .en{font-size:14.5px}
.ans{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.chip{display:inline-flex;flex-direction:column;align-items:center;border-radius:12px;background:var(--accent-soft);padding:0 12px 4px;min-width:64px}
.chip .arw{font-size:24px;line-height:1.7;font-weight:600}
.chip small{font-size:11.5px;line-height:1.2;text-align:center}
.ifnot{display:flex;align-items:center;gap:10px;font-size:13px;padding-left:12px}
.ifnot .ta,.ifnot .si,.ifnot .en{color:var(--muted)}
.ifnot::before{content:"↓";font-size:18px;color:var(--accent);font-weight:700}

/* Chat */
.chat{display:flex;flex-direction:column;gap:6px}
.pair{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.msg{max-width:min(88%,520px);border-radius:18px;padding:6px 14px 8px;display:flex;flex-direction:column;gap:0}
.msg.q{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .arw{font-size:24px;line-height:1.85;text-align:right}
.msg .ta,.msg .si{font-size:14.5px}
.msg .en{font-size:13.5px}
.who{font-size:11.5px}
.who .ta,.who .si,.who .en{color:var(--muted)}

/* Duo / pairs */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.dpanel{border-radius:14px;background:var(--paper-2);padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.dpanel .emo{font-size:40px;line-height:1.2}
.dpanel .key{font-size:32px;line-height:1.7;font-weight:700;color:var(--accent)}
.dpanel .ta,.dpanel .si{font-weight:600}
.dpanel .eg{font-size:22px;line-height:1.8;margin-top:4px}
.dpanel .ta.eg,.dpanel .si.eg,.dpanel .en.eg{font-size:16px;line-height:1.4}
.dpanel .en{font-size:14px}
.group{display:flex;flex-direction:column;gap:12px;padding-bottom:18px;border-bottom:1px dashed var(--line)}
.group:last-of-type{border-bottom:0;padding-bottom:0}
.group h3{font-family:var(--font-display);font-size:19px;font-weight:700}
.group h3 .arw{font-size:22px}

/* Equations */
.eqs{display:flex;flex-direction:column;gap:10px}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.eq .op{font-size:22px;font-weight:700;color:var(--muted)}
.wbox{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:0 14px 6px;min-width:96px;border:1.5px solid var(--line);background:var(--paper);text-align:center}
.wbox .arw{font-size:28px;line-height:1.7;font-weight:600}
.wbox .ta,.wbox .si{font-size:13.5px;font-weight:600}
.wbox .en{font-size:12.5px}
.wbox.m{background:var(--m-soft);border-color:var(--m)}
.wbox.f{background:var(--f-soft);border-color:var(--f)}
.wbox.add{background:var(--mark);border-color:var(--mark)}
.wbox.add .arw{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:13.5px}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid}
.sw.m{background:var(--m-soft);border-color:var(--m)}
.sw.f{background:var(--f-soft);border-color:var(--f)}
.sw.pf{background:var(--pf);border-color:var(--accent)}
.sw.pm{background:var(--pm);border-color:#c79a1e}

/* Contrast */
.contrast{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cpanel{border-radius:16px;padding:10px 14px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:2px solid}
.cpanel.m{background:var(--m-soft);border-color:var(--m)}
.cpanel.f{background:var(--f-soft);border-color:var(--f)}
.cpanel .huge{font-size:clamp(46px,11vw,64px);line-height:1.7;font-weight:700}
.cpanel .mk{font-family:var(--font-ar);font-size:34px;line-height:1.3}
.cpanel.m .mk{color:var(--m)}
.cpanel.f .mk{color:var(--f)}
.cpanel .ta,.cpanel .si{font-weight:600}
.cpanel .en{font-size:14px}

/* Tree */
.tree-wrap{overflow-x:auto;margin:0 -4px;padding:4px}
.tree{display:block;width:100%;min-width:680px;height:auto}
.tree .box{stroke:var(--line);stroke-width:1.5;fill:var(--paper-2)}
.tree .pf .box{fill:var(--pf)}
.tree .pm .box{fill:var(--pm)}
.tree .me .box{fill:var(--accent);stroke:var(--accent)}
.tree .ln{stroke:var(--muted);stroke-width:1.6;fill:none}
.tree .wed{stroke:var(--f);stroke-width:2.4}
.fo{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 6px;line-height:1.25}
.fo .t-ar{font-family:var(--font-ar);font-size:23px;font-weight:600;line-height:1.45;color:var(--ink)}
.fo .ta{font-size:12.5px;font-weight:600}
.fo .si{font-size:12.5px;font-weight:600;line-height:1.35}

.me .fo .t-ar,.me .fo .ta,.me .fo .si,.me .fo .en{color:var(--on-accent)}

.fo-cap .ta{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--ink)}
.fo-cap .si{font-size:12.5px;font-weight:600}
.fo-cap .en{font-size:11.5px}

.endnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

.sheet td.p .ic{width:30px;height:30px}

.pq{display:flex;align-items:center;gap:14px}

.pq-mean .ta,.pq-mean .si{font-weight:600}

.clock .hh{stroke:var(--accent);stroke-width:3.6}
.clock .mh{stroke-width:2.2}
.clock .cd{fill:var(--ink);stroke:none}
.clocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.clocks>div{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--paper-2);border-radius:14px;padding:8px 6px}
.clocks .arw{font-size:19px;line-height:1.7;font-weight:600}

.opp-side{background:var(--paper-2);border-radius:14px;padding:6px 10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center}
.opp-side .emo{font-size:32px;line-height:1.2}
.opp-side .arw{font-size:26px;line-height:1.6;font-weight:600}

.opp-side .en{font-size:13px}
.opp-mid{align-self:center;font-size:22px;color:var(--muted);font-weight:700}

/* Scrollable illustrations */
.wide{overflow-x:auto;margin:0 -4px;padding:4px}
.wide>*{min-width:560px}

.plan{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:4px solid var(--ink);border-radius:6px;background:var(--paper)}
.room{border:2px solid var(--ink);padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-height:120px}
.room .arw{font-size:21px;font-weight:700;line-height:1.6}
.room .ta,.room .si{font-size:13px;font-weight:600}
.room .en{font-size:12px}
.furn{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:6px;font-family:var(--font-emoji);font-size:26px;line-height:1.2;align-items:center}

/* Sky strip (prayer times) */
.sky{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-radius:16px;overflow:hidden}
.sky>div{padding:12px 6px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.sky .emo{font-size:34px;line-height:1.3}
.sky .arw{font-size:24px;line-height:1.7;font-weight:700;color:inherit}
.sky .ta,.sky .si,.sky .en{color:inherit;font-size:13px}
.sky .no{font-size:12px;opacity:.8}

.weekrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}

.day .ta,.day .si,.day .en{font-size:12px}
.day .emo{font-size:22px}
.day.hl{border-color:var(--accent);background:var(--accent-soft)}

.thirds .ta,.thirds .si,.thirds .en{font-size:13px;font-weight:600}

.dt td.n{font-family:var(--font-display);font-weight:700;font-size:18px}
.tile{display:inline-grid;place-items:center;min-width:42px;height:42px;border-radius:10px;font-family:var(--font-ar);font-size:26px;font-weight:700;color:#fff}

       '</div>'},

    {type:'html',title:['ـة சேர்த்தால் பெண்பால்','Add ـة to make it feminine','ـة එකතු කළ විට ස්ත්‍රී ලිංග'],
     intro:['ஆண்பால் சொல்லின் கடைசியில் <b class="arw">ـة</b> (தா மர்பூதா) சேர்த்தால், பெரும்பாலும் அது பெண்பால் ஆகிவிடும். ـة-க்கு முன் உள்ள எழுத்து ஃபத்ஹா (ـَ) பெறும்.',
            'Add <b class="arw">ـة</b> (tā marbūṭa) to the end of a masculine word and it usually becomes feminine. The letter just before ـة takes a fatḥa (ـَ).',
            'පුරුෂ ලිංග වචනයක අගට <b class="arw">ـة</b> (තා මර්බූතා) එකතු කළ විට, බොහෝවිට එය ස්ත්‍රී ලිංග වේ. ـة ට පෙර ඇති අකුරට ෆත්හා (ـَ) ලැබේ.'],
     html:'<div class="legend"><span><i class="sw m"></i>'+ONE('ஆண்பால்','masculine','පුරුෂ ලිංග')+'</span><span><i class="sw f"></i>'+ONE('பெண்பால்','feminine','ස්ත්‍රී ලිංග')+'</span></div>'+
      '<div class="eqs">'+
        eq('جَدّ',['தாத்தா','grandfather','සීයා'],'ـة','جَدَّة',['பாட்டி','grandmother','ආච්චි'])+
        eq('عَمّ',['சித்தப்பா','father\'s brother','බාප්පා'],'ـة','عَمَّة',['அத்தை','father\'s sister','නැන්දා'])+
        eq('خَال',['மாமா','mother\'s brother','මාමා'],'ـة','خَالَة',['சித்தி','mother\'s sister','පුංචි අම්මා'])+
        eq('زَوْج',['கணவன்','husband','සැමියා'],'ـة','زَوْجَة',['மனைவி','wife','බිරිඳ'])+
        eq('اِبْن',['மகன்','son','පුතා'],'ـة','اِبْنَة',['மகள்','daughter','දුව'])+
        eq('وَالِد',['தந்தை','father','පියා'],'ـة','وَالِدَة',['தாய்','mother','මව'])+
      '</div>'+
      '<div class="callout"><h3>'+ONE('விதியைப் பின்பற்றாதவை','The ones that break the rule','නීතියට අනුගත නොවන ඒවා')+'</h3>'+
        bi('இந்த இரண்டு ஜோடிகளையும் தனியாக மனப்பாடம் செய்யுங்கள்:','Learn these two pairs on their own:','මෙම යුගල දෙක වෙනම කටපාඩම් කරන්න:')+
        '<div class="eqs">'+
          '<div class="eq">'+pairBox('أَب',['தந்தை','father','පියා'],'m')+'<span class="op">↔</span>'+pairBox('أُمّ',['தாய்','mother','මව'],'f')+'</div>'+
          '<div class="eq">'+pairBox('أَخ',['சகோதரன்','brother','සහෝදරයා'],'m')+'<span class="op">↔</span>'+pairBox('أُخْت',['சகோதரி','sister','සහෝදරිය'],'f')+'</div>'+
        '</div>'+
        bi('<span class="arw">أُخْت</span> கடைசியில் இருப்பது <span class="arw">ت</span>, <span class="arw">ة</span> அல்ல.','<span class="arw">أُخْت</span> ends in an open <span class="arw">ت</span>, not <span class="arw">ة</span>.','<span class="arw">أُخْت</span> අවසානයේ ඇත්තේ <span class="arw">ت</span>, <span class="arw">ة</span> නොවේ.')+
      '</div>'+
      '<div class="note-box">'+bi('இதே விதி தொழில்களுக்கும் வேலை செய்கிறது: <span class="arw">مُدَرِّس</span> (ஆசிரியர்) → <span class="arw">مُدَرِّسَة</span> (ஆசிரியை). அதை அடுத்த புத்தகத்தில் பார்ப்போம்.',
        'The same rule works for jobs: <span class="arw">مُدَرِّس</span> (male teacher) → <span class="arw">مُدَرِّسَة</span> (female teacher). That is the next booklet.',
        'මෙම නීතියම රැකියා සඳහාත් ක්‍රියා කරයි: <span class="arw">مُدَرِّس</span> (ගුරුවරයා) → <span class="arw">مُدَرِّسَة</span> (ගුරුවරිය). එය ඊළඟ පොතේ.')+'</div>'
    },
    {type:'cards',title:['நான், நீ, அவன், அவள்','I, you, he, she','මම, ඔබ, ඔහු, ඇය'],
     intro:['இவை பிரதிப்பெயர்கள் (ضَمَائِر). யாரைப் பற்றிப் பேசுகிறோம் என்பதைப் படம் காட்டுகிறது.','These are pronouns (ضَمَائِر). Each picture shows who is meant.','මේවා සර්වනාම (ضَمَائِر) ය. පින්තූරයෙන් පෙන්වන්නේ කවුරුන්ද යන්නයි.'],
     cards:[
      {pic:'🙋',ar:'أَنَا',tr:'ana',ta:'நான்',si:'මම',en:'I'},
      {pic:'👉🧔',ar:'أَنْتَ',tr:'anta',ta:'நீ (ஆணிடம்)',si:'ඔබ (පිරිමියෙකුට)',en:'you (to a man)'},
      {pic:'👉🧕',ar:'أَنْتِ',tr:'anti',ta:'நீ (பெண்ணிடம்)',si:'ඔබ (කාන්තාවකට)',en:'you (to a woman)'},
      {pic:'👨',ar:'هُوَ',tr:'huwa',ta:'அவன் / அவர்',si:'ඔහු',en:'he'},
      {pic:'🧕',ar:'هِيَ',tr:'hiya',ta:'அவள் / அவர்',si:'ඇය',en:'she'},
      {pic:'👨‍👩‍👦',ar:'نَحْنُ',tr:'naḥnu',ta:'நாங்கள் / நாம்',si:'අපි',en:'we'}
     ],
     after:'<div class="callout"><h3>'+ONE('ஒரு சிறு கோடு, பெரிய வேறுபாடு','One small stroke, a big difference','එක් කුඩා ඉරක්, විශාල වෙනසක්')+'</h3>'+
       bi('தமிழில் "நீ" ஆணுக்கும் பெண்ணுக்கும் ஒன்றுதான். அரபியில் கடைசி உயிர்க்குறி மட்டுமே வேறுபடுகிறது:',
          'Tamil uses நீ and Sinhala uses ඔබ for a man or a woman. In Arabic only the last vowel mark changes:',
          'සිංහලෙන් "ඔබ" පිරිමියෙකුටත් කාන්තාවකටත් එකයි. අරාබියෙන් වෙනස් වන්නේ අවසාන ස්වර ලකුණ පමණි:')+
       '<div class="contrast">'+
         '<div class="cpanel m"><span class="arw huge" lang="ar">أَنْتَ</span><span class="mk" aria-hidden="true">ـَ</span>'+TE('மேலே கோடு (ஃபத்ஹா) → ஆணிடம்','stroke above (fatḥa) → to a man','උඩින් ඉර (ෆත්හා) → පිරිමියෙකුට')+'</div>'+
         '<div class="cpanel f"><span class="arw huge" lang="ar">أَنْتِ</span><span class="mk" aria-hidden="true">ـِ</span>'+TE('கீழே கோடு (கஸ்ரா) → பெண்ணிடம்','stroke below (kasra) → to a woman','යටින් ඉර (කස්රා) → කාන්තාවකට')+'</div>'+
       '</div></div>'},

     intro:['சொல்லின் கடைசியில் <b class="arw">ـِي</b> சேர்த்தால் "என்" என்று பொருள். தமிழில் "என்" முன்னால் வருகிறது; அரபியில் ـِي பின்னால் ஒட்டிக்கொள்கிறது.',

     intro:['இரண்டாம் புத்தகத்தில் கற்ற அதே விதி: ஆண்பால் தொழில் சொல்லுடன் ـة சேர்த்தால் பெண்ணுக்கான சொல் கிடைக்கும்.','The same rule as in booklet 2: add ـة to the job word for a man and you get the word for a woman.','2 වන පොතේ ඉගෙන ගත් එකම නීතිය: පිරිමි රැකියා වචනයට ـة එකතු කළ විට කාන්තාවකට වචනය ලැබේ.'],

    {type:'html',title:['தொழில் சொற்களின் ஒரு வடிவம்: فَعَّال','A job shape: فَعَّال','රැකියා හැඩයක්: فَعَّال'],
     intro:['பல தொழில் சொற்கள் ஒரே வடிவத்தில் உள்ளன: நடு எழுத்து இரட்டிக்கும் (ـّ ஷத்தா), அதன் பின் நீண்ட "ஆ" (ـَا). இந்த வடிவத்தைக் கண்டால் "இதைத் தொழிலாகச் செய்பவர்" என்று நினையுங்கள்.',
            'Many job words share one shape: the middle letter is doubled (ـّ shadda), then comes a long "aa" (ـَا). When you see this shape, think "the person who does this for a living".',
            'බොහෝ රැකියා වචනවලට එකම හැඩයක් ඇත: මැද අකුර දෙගුණ වේ (ـّ ෂද්දා), පසුව දිගු "ආ" (ـَا) එයි. මෙම හැඩය දුටු විට "මෙය රැකියාව ලෙස කරන්නා" යැයි සිතන්න.'],
     html:'<div class="note-box" style="align-items:center;text-align:center">'+A('فَعَّال','big')+
        TE('நடு எழுத்தில் ـّ, பின்னர் ـَا','ـّ on the middle letter, then ـَا','මැද අකුරේ ـّ, පසුව ـَا','div')+'</div>'+
      '<div class="eqs">'+
        '<div class="eq">'+WB('طَبَخَ',['சமைத்தார்','he cooked','ඉව්වා'])+'<span class="op">→</span>'+WB('طَبَّاخ',['சமையல்காரர்','cook','කෝකියා'],'',  '👨‍🍳')+'</div>'+
        '<div class="eq">'+WB('حَلَقَ',['சவரம் செய்தார்','he shaved','රැවුල කැපුවා'])+'<span class="op">→</span>'+WB('حَلَّاق',['முடிதிருத்துபவர்','barber','කොණ්ඩා කපන්නා'],'','💈')+'</div>'+

        '<div class="eq">'+WB('بَنَى',['கட்டினார்','he built','ගොඩනැගුවා'])+'<span class="op">→</span>'+WB('بَنَّاء',['கொத்தனார்','builder','මේසන් බාස්'],'','🧱')+'</div>'+

      '<div class="eq">'+['نَجَّار','حَدَّاد','سَبَّاك','بَقَّال'].map(function(w){return '<span class="chip"><span class="arw" lang="ar">'+w+'</span></span>';}).join('')+'</div>'

    {type:'examples',title:['யார் எங்கே வேலை செய்கிறார்கள்?','Who works where?','කවුරු කොහේ වැඩ කරනවාද?'],
     intro:['<b class="arw">يَعْمَلُ</b> = அவர் வேலை செய்கிறார், <b class="arw">تَعْمَلُ</b> = அவள் வேலை செய்கிறாள். <b class="arw">فِي</b> = -இல்.','<b class="arw">يَعْمَلُ</b> = he works, <b class="arw">تَعْمَلُ</b> = she works. <b class="arw">فِي</b> = in / at.','<b class="arw">يَعْمَلُ</b> = ඔහු වැඩ කරයි, <b class="arw">تَعْمَلُ</b> = ඇය වැඩ කරයි. <b class="arw">فِي</b> = තුළ / හි.'],
     items:[

      ['هِيَ <mark>مُدَرِّسَةٌ</mark>، تَعْمَلُ فِي المَدْرَسَةِ.','அவர் ஓர் ஆசிரியை; பாடசாலையில் வேலை செய்கிறார்.','She is a teacher; she works at the school.','ඇය ගුරුවරියකි; ඇය පාසලේ වැඩ කරයි.'],
      ['أَبِي <mark>مُهَنْدِسٌ</mark>، يَعْمَلُ فِي شَرِكَةٍ.','என் தந்தை ஒரு பொறியியலாளர்; ஒரு நிறுவனத்தில் வேலை செய்கிறார்.','My father is an engineer; he works for a company.','මගේ පියා ඉංජිනේරුවරයෙකි; ඔහු සමාගමක වැඩ කරයි.'],
      ['أُمِّي <mark>مُمَرِّضَةٌ</mark>.','என் தாய் ஒரு தாதி.','My mother is a nurse.','මගේ අම්මා හෙදියකි.'],
      ['<mark>الطَّيَّارُ</mark> فِي المَطَارِ.','விமானி விமான நிலையத்தில் இருக்கிறார்.','The pilot is at the airport.','ගුවන් නියමුවා ගුවන් තොටුපළේ ඉන්නවා.'],
      ['<mark>الطَّبَّاخُ</mark> فِي المَطْعَمِ.','சமையல்காரர் உணவகத்தில் இருக்கிறார்.','The cook is in the restaurant.','කෝකියා අවන්හලේ ඉන්නවා.'],

    {type:'html',title:['கட்டளை: "எழுந்திரு!"','The command: "Wake up!"','විධානය: "නැගිටින්න!"'],
     intro:['நிகழ்கால வினையிலிருந்து <b class="arw">يَـ</b>-ஐ நீக்குங்கள். தேவைப்பட்டால் முன்னால் <b class="arw">اِ</b> சேருங்கள். கடைசியில் சுகூன் (ـْ) வையுங்கள்.',
            'Take the present verb and drop <b class="arw">يَـ</b>. Add <b class="arw">اِ</b> in front if needed. End with a sukūn (ـْ).',
            'වර්තමාන ක්‍රියා පදයෙන් <b class="arw">يَـ</b> ඉවත් කරන්න. අවශ්‍ය නම් ඉදිරියෙන් <b class="arw">اِ</b> එකතු කරන්න. අගට සුකූන් (ـْ) තබන්න.'],
     html:'<div class="breakdown" dir="rtl">'+
        '<div class="bd"><span class="arw" lang="ar">يَسْتَيْقِظُ</span>'+TE('எழுகிறான்','he wakes up','අවදි වෙයි')+'</div>'+
        '<div class="bd"><span class="arw" lang="ar" style="color:var(--bad)">✂️ يَـ</span>'+TE('நீக்கு','drop it','ඉවත් කරන්න')+'</div>'+
        '<div class="bd hl"><span class="arw" lang="ar">اِسْتَيْقِظْ</span>'+TE('எழுந்திரு!','wake up!','නැගිටින්න!')+'</div>'+
      '</div>'+
      '<p class="readdir">← '+ONE('வலமிருந்து இடமாக','right to left','දකුණේ සිට වමට')+'</p>'+
      '<div class="eqs">'+
        cmd('يَنْتَظِرُ',['காத்திருக்கிறான்','he waits','බලා සිටී'],'اِنْتَظِرْ',['காத்திரு!','wait!','ඉන්න!'])+
        cmd('يَقْرَأُ',['வாசிக்கிறான்','he reads','කියවයි'],'اِقْرَأْ',['வாசி!','read!','කියවන්න!'])+
        cmd('يَضَعُ',['வைக்கிறான்','he puts','තබයි'],'ضَعْ',['வை!','put!','තබන්න!'])+
        cmd('يَأْكُلُ',['சாப்பிடுகிறான்','he eats','කයි'],'كُلْ',['சாப்பிடு!','eat!','කන්න!'])+
      '</div>'+
      '<div class="note-box">'+bi('<span class="arw">ضَعْ</span>-க்கு <span class="arw">اِ</span> தேவையில்லை, ஏனெனில் يَـ நீக்கிய பின் ضَ ஏற்கனவே உயிர்க்குறியுடன் தொடங்குகிறது. <span class="arw">كُلْ</span> ஒரு சிறப்புச் சொல்: மனப்பாடம் செய்யுங்கள்.',
        '<span class="arw">ضَعْ</span> needs no <span class="arw">اِ</span>, because after dropping يَـ the word already starts with a vowelled letter (ضَ). <span class="arw">كُلْ</span> is a special one: learn it by heart.',
        '<span class="arw">ضَعْ</span> ට <span class="arw">اِ</span> අවශ්‍ය නැත, මොකද يَـ ඉවත් කළ පසු වචනය දැනටමත් ස්වරයක් සහිත අකුරකින් (ضَ) පටන් ගනී. <span class="arw">كُلْ</span> විශේෂ වචනයකි: කටපාඩම් කරන්න.')+'</div>'},
    {type:'html',title:['ஏன்? எப்போது பயணம்?','Why? And the future','ඇයි? සහ අනාගතය'],
     intro:['<b class="arw">لِمَاذَا</b> (ஏன்) கேள்விக்கு பதில் <b class="arw">لِأَنَّ</b> (ஏனெனில்) அல்லது <b class="arw">لِـ</b> (-க்காக) என்று தொடங்கும்.','A <b class="arw">لِمَاذَا</b> (why) question is answered with <b class="arw">لِأَنَّ</b> (because) or <b class="arw">لِـ</b> (for).','<b class="arw">لِمَاذَا</b> (ඇයි) ප්‍රශ්නයට පිළිතුර <b class="arw">لِأَنَّ</b> (මොකද) හෝ <b class="arw">لِـ</b> (සඳහා) වලින් පටන් ගනී.'],
     html:'<div class="chat">'+
        CHAT('لِمَاذَا تُصَلِّي فِي البَيْتِ؟',['நீ ஏன் வீட்டில் தொழுகிறாய்?','Why do you pray at home?','ඔබ නිවසේ සලාතය කරන්නේ ඇයි?'],'<mark>لِأَنِّي</mark> لَا أَسْمَعُ الأَذَانَ.',['ஏனெனில் எனக்குப் பாங்கு கேட்பதில்லை.','Because I don\'t hear the adhan.','මොකද මට අදාන් ඇහෙන්නේ නැහැ.'])+
        CHAT('لِمَاذَا أَنْتَ مُسَافِرٌ إِلَى مَكَّةَ؟',['நீ ஏன் மக்காவுக்குப் பயணம் செய்கிறாய்?','Why are you travelling to Makkah?','ඔබ මක්කමට යන්නේ ඇයි?'],'<mark>لِلصَّلَاةِ</mark> فِي المَسْجِدِ الحَرَامِ.',['மஸ்ஜிதுல் ஹராமில் தொழுவதற்காக.','To pray in the Sacred Mosque.','මස්ජිදුල් හරාම්හි සලාතය ඉටු කිරීමට.'])+
      '</div>'+
      '<div class="group"><h3>'+ONE('எதிர்காலம்: سَـ','The future: سَـ','අනාගතය: سَـ')+'</h3>'+
        bi('நிகழ்கால வினையின் முன்னால் <b class="arw">سَـ</b> சேர்த்தால் "செய்வார்" என்று எதிர்காலம் ஆகிறது.','Put <b class="arw">سَـ</b> in front of a present verb and it becomes the future: "will".','වර්තමාන ක්‍රියා පදයට ඉදිරියෙන් <b class="arw">سَـ</b> එකතු කළ විට එය අනාගතය බවට පත් වේ: "කරනු ඇත".')+
        '<div class="eqs"><div class="eq">'+WB('سَـ',['போகும்','will','ඇත'],'add')+'<span class="op">+</span>'+WB('يُسَافِرُ',['பயணம் செய்கிறார்','he travels','ගමන් කරයි'])+'<span class="op">=</span>'+WB('سَيُسَافِرُ',['பயணம் செய்வார்','he will travel','ගමන් කරනු ඇත'],'','✈️')+'</div></div>'+
        '<div class="chat">'+CHAT('كَيْفَ <mark>سَتُسَافِرُ</mark> إِلَى المَدِينَةِ؟',['மதீனாவுக்கு எப்படிப் பயணம் செய்வாய்?','How will you travel to Madinah?','ඔබ මදීනාවට යන්නේ කොහොමද?'],'أَرْكَبُ الطَّائِرَةَ.',['விமானத்தில் செல்வேன்.','I will take the plane.','මම ගුවන් යානයෙන් යනවා.'])+'</div>'+
      '</div>'},

    {type:'html',title:['கட்டளை + பொருள், மற்றும் "அல்லது"','Commands with an object, and "or"','කර්මය සහිත විධාන, සහ "හෝ"'],

    {type:'html',title:['هٰذَا அல்லது هٰذِهِ?','هٰذَا or هٰذِهِ?','هٰذَا ද هٰذِهِ ද?'],
     intro:['<b class="arw">هٰذَا</b> = இது / இவர் (ஆண்பால்). <b class="arw">هٰذِهِ</b> = இது / இவர் (பெண்பால்). ـة-இல் முடியும் சொற்களும், بِنْت, أُمّ, اِبْنَة போன்ற பெண்களைக் குறிக்கும் சொற்களும் هٰذِهِ பெறும்.',
            '<b class="arw">هٰذَا</b> = this (masculine). <b class="arw">هٰذِهِ</b> = this (feminine). Words ending in ـة, and words for women such as بِنْت, أُمّ, اِبْنَة, take هٰذِهِ.',
            '<b class="arw">هٰذَا</b> = මේ (පුරුෂ ලිංග). <b class="arw">هٰذِهِ</b> = මේ (ස්ත්‍රී ලිංග). ـة න් අවසන් වන වචන සහ بِنْت, أُمّ, اِبْنَة වැනි කාන්තාවන් හඳුන්වන වචන هٰذِهِ ගනී.'],
     html:'<div class="contrast">'+

        '<div class="cpanel f"><span class="arw huge" lang="ar">هٰذِهِ</span>'+TE('பெண்பால்','feminine','ස්ත්‍රී ලිංග')+'</div>'+

            '<b class="arw">كِتَاب</b> (පොත) යන වචනයට කුඩා අගක් එකතු කළ විට එය කාගේද කිව හැක. ـكَ (පිරිමියෙකුට) සහ ـكِ (කාන්තාවකට) අතර වෙනස එක් කුඩා ස්වර ලකුණක් පමණි, 2 වන පොතේ أَنْتَ / أَنْتِ වගේම.'],
     cards:[

      {pic:'👉🧕',ar:'كِتَابُكِ',tr:'kitaabuki',ta:'உன் புத்தகம் (பெண்)',si:'ඔබේ පොත (කාන්තා)',en:'your book (to a woman)',note:['ـكِ = உன் (பெண்)','ـكِ = your (f)','ـكِ = ඔබේ (කාන්තා)']},

      {pic:'🧕',ar:'كِتَابُهَا',tr:'kitaabuhaa',ta:'அவளுடைய புத்தகம்',si:'ඇයගේ පොත',en:'her book',note:['ـهَا = அவளுடைய','ـهَا = her','ـهَا = ඇයගේ']}

    {type:'html',title:['பெண்ணிடம் பேசும்போது','Talking to a woman','කාන්තාවකට කතා කරන විට'],
     intro:['ஒரு பெண்ணிடம் பேசும்போது மூன்று அடையாளங்கள் வரும்: <b class="arw">أَنْتِ</b>, <b class="arw">ـكِ</b>, வினையில் <b class="arw">ـِينَ</b>.',
            'When you talk to a woman, three signs appear: <b class="arw">أَنْتِ</b>, <b class="arw">ـكِ</b>, and <b class="arw">ـِينَ</b> on the verb.',
            'කාන්තාවකට කතා කරන විට ලකුණු තුනක් පෙනේ: <b class="arw">أَنْتِ</b>, <b class="arw">ـكِ</b>, සහ ක්‍රියා පදයේ <b class="arw">ـِينَ</b>.'],

      '</div>'+
      '<div class="group"><h3>'+ONE('நாடும் நாட்டவரும்','Country and nationality','රට සහ ජාතිකත්වය')+'</h3>'+
        bi('நாட்டின் பெயருடன் <b class="arw">ـِيّ</b> சேர்த்தால் "அந்த நாட்டவர்". பெண்ணுக்கு மேலும் ـة.','Add <b class="arw">ـِيّ</b> to a country name for "a person from there". For a woman, add ـة as well.','රටේ නමට <b class="arw">ـِيّ</b> එකතු කළ විට "එම රටේ කෙනා". කාන්තාවකට ـة ද එකතු කරන්න.')+
        '<div class="eqs">'+
          '<div class="eq">'+WB('بَاكِسْتَان',['பாகிஸ்தான்','Pakistan','පාකිස්තානය'])+'<span class="op">+ ـِيّ =</span>'+WB('بَاكِسْتَانِيّ',['பாகிஸ்தானியர்','Pakistani','පාකිස්තානු ජාතිකයා'],'m')+'</div>'+

        '</div>'+

    {type:'html',title:['பிழையைக் கண்டுபிடிக்க 5 படிகள்','Five steps to find the mistake','වැරැද්ද සොයා ගැනීමට පියවර 5'],
     intro:['அடிக்கோடிட்ட ஒவ்வொரு சொல்லிலும் இந்த ஐந்து கேள்விகளைக் கேளுங்கள்.','Ask these five questions of every underlined word.','යටින් ඉරි ඇඳි සෑම වචනයකින්ම මෙම ප්‍රශ්න පහ අසන්න.'],
     html:'<div class="ladder">'+
       rung(1,['அந்த மனிதர் ஆணா, பெண்ணா?','Is the person male or female?','එම පුද්ගලයා පිරිමියෙක්ද, කාන්තාවක්ද?'],['هُوَ','هِيَ'])+
       rung(2,['வினையின் முதல் எழுத்து பொருந்துகிறதா?','Does the verb\'s first letter match?','ක්‍රියා පදයේ මුල් අකුර ගැළපේද?'],['يَـ','تَـ'])+
       rung(3,['தொழில் சொல் சரியான பாலிலா? பெண் → ـة','Is the job word the right gender? woman → ـة','රැකියා වචනය නිවැරදි ලිංගයේද? කාන්තා → ـة'],['ـة'])+
       rung(4,['هٰذَا / هٰذِهِ பெயர்ச்சொல்லுடன் பொருந்துகிறதா?','Does هٰذَا / هٰذِهِ match the noun?','هٰذَا / هٰذِهِ නාම පදයට ගැළපේද?'],['هٰذَا','هٰذِهِ'])+
       rung(5,['பெண்ணிடம் பேசுகிறோமா?','Are we talking to a woman?','අපි කාන්තාවකට කතා කරනවාද?'],['أَنْتِ','ـكِ','ـِينَ'])+
     '</div>'},

           'මුල් අකුරු හතර එකට <b class="arw">أَنَيْتُ</b> ලෙස කියවිය හැක: <b class="arw">أ</b> මම, <b class="arw">ن</b> අපි, <b class="arw">ي</b> ඔහු, <b class="arw">ت</b> ඔබ හෝ ඇය. කාන්තාවකට කතා කරන විට අගට <b class="arw">ـِينَ</b>.')+
      '</div>'+
      '<div class="note-box">'+bi('கவனம்: <span class="arw">تَسْكُنُ</span> என்பது "நீ (ஆண்) வசிக்கிறாய்" என்றும் "அவள் வசிக்கிறாள்" என்றும் பொருள்படும். வாக்கியம் எது என்று சொல்லும்.','Note: <span class="arw">تَسْكُنُ</span> means both "you (m) live" and "she lives". The sentence tells you which.','සැලකිය යුතුයි: <span class="arw">تَسْكُنُ</span> යන්න "ඔබ (පිරිමි) ජීවත් වෙනවා" සහ "ඇය ජීවත් වෙනවා" යන දෙකම අදහස් කරයි. වාක්‍යයෙන් කුමක්දැයි කියයි.')+'</div>'},
    {type:'html',title:['"...கின்ற": الَّذِي, الَّتِي','"Who / which": الَّذِي and الَّتِي','"...න": الَّذِي සහ الَّتِي'],
     intro:['தமிழில் விவரிப்பு முன்னால் வருகிறது: "வேலை செய்கின்ற மனிதர்". அரபியில் முதலில் பெயர்ச்சொல், பிறகு <b class="arw">الَّذِي</b> (ஆண்) அல்லது <b class="arw">الَّتِي</b> (பெண்), பிறகு விவரிப்பு.',

    {type:'html',title:['எதிர்ச்சொற்கள்','Opposites','ප්‍රතිවිරුද්ධ පද'],
     intro:['<b class="arw">ضِدّ</b> = எதிர்ச்சொல். <span class="arw">ضِدُّ كَبِير = صَغِير</span>. ஜோடியாகக் கற்றால் இரண்டும் நினைவில் நிற்கும்.','<b class="arw">ضِدّ</b> = opposite. <span class="arw">ضِدُّ كَبِير = صَغِير</span>. Learn them in pairs and both words stick.','<b class="arw">ضِدّ</b> = ප්‍රතිවිරුද්ධය. <span class="arw">ضِدُّ كَبِير = صَغِير</span>. යුගල ලෙස ඉගෙන ගත් විට දෙකම මතක හිටී.'],

    {type:'html',title:['உரையாடலை நிரப்புதல்: அஹ்மதும் ஸாராவும்','Filling in the dialogue: Ahmad and Sara','සංවාදය සම්පූර්ණ කිරීම: අහමද් සහ සාරා'],
     intro:['மஞ்சள் சொற்கள் பயிற்சித் தாளில் காலியாக இருந்தவை. ஒவ்வொன்றும் ஏன் என்று கீழே பாருங்கள்.','The yellow words were the blanks in your worksheet. The reasons are below.','කහ පාට වචන ඔබේ අභ්‍යාස පත්‍රයේ හිස්තැන් විය. හේතු පහතින් ඇත.'],

        line('a','سَارَة','أَنَا <mark>مِنْ</mark> تُونِسَ.',['நான் துனீசியாவைச் சேர்ந்தவள்.','I am from Tunisia.','මම ටියුනීසියාවෙන්.'])+
      '</div></div>'+
      '<div class="note-box">'+
        bi('<span class="arw">اسْمُكِ</span>: பெண்ணிடம் "உன்" = ـكِ. <span class="arw">اسْمِي</span>: "என்" = ـي. <span class="arw">كَيْفَ</span>: حَال வந்தால் كَيْفَ. <span class="arw">بِخَيْرٍ</span>: "நலமாக". <span class="arw">مِنْ</span>: நாடு = "-இலிருந்து".',

        M('وَهَلْ <mark>شُفِيَ</mark>؟',['அவர் குணமடைந்தாரா?','And was he cured?','ඔහු සුවය ලැබුවාද?'])+
        H('نَعَمْ، بَعْدَ أَنْ سَقَاهُ ثَلَاثَ مَرَّاتٍ.',['ஆம், மூன்று தடவை குடிக்கக் கொடுத்த பிறகு.','Yes, after he gave it to him three times.','ඔව්, තුන් වතාවක් පෙව්වාට පස්සේ.'])+
        M('العَسَلُ! سُبْحَانَ اللهِ.',['தேன்! சுப்ஹானல்லாஹ்.','Honey! Subhan Allah.','මී පැණි! සුබ්හානල්ලාහ්.'])+
        H('نَعَمِ، العَسَلُ. قَالَ تَعَالَى: ﴿فِيهِ شِفَاءٌ لِلنَّاسِ﴾',['ஆம், தேன். அல்லாஹ் கூறுகிறான்: "அதில் மனிதர்களுக்கு நிவாரணம் உண்டு."','Yes, honey. Allah says: "In it there is healing for people."','ඔව්, මී පැණි. අල්ලාහ් පවසයි: "එහි මිනිසුන්ට සුවය ඇත."'])+
        M('سَأَتَنَاوَلُ العَسَلَ مِثْلَ هٰذَا الصَّحَابِيِّ.',['இந்த ஸஹாபியைப் போல நானும் தேன் சாப்பிடுவேன்.','I will take honey like this Companion.','මමත් මේ සහාබිවරයා වගේ මී පැණි ගන්නම්.'])+
        H('تُوجَدُ مَحَلَّاتٌ لِبَيْعِ العَسَلِ فِي السُّوقِ المَرْكَزِيِّ.',['மத்திய சந்தையில் தேன் விற்கும் கடைகள் உள்ளன.','There are shops selling honey in the central market.','මධ්‍යම වෙළඳපොළේ මී පැණි විකුණන කඩ තියෙනවා.'])+
        M('سَأَذْهَبُ الآنَ إِلَى هُنَاكَ، وَأَشْتَرِي العَسَلَ.',['நான் இப்போதே அங்கே சென்று தேன் வாங்குவேன்.','I will go there now and buy honey.','මම දැන්ම එතනට ගිහින් මී පැණි ගන්නවා.'])+
        H('<mark>شَفَاكَ اللهُ</mark>.',['அல்லாஹ் உனக்குக் குணமளிப்பானாக.','May Allah cure you.','අල්ලාහ් ඔබට සුවය දෙත්වා.'])+
        M('جَزَاكَ اللهُ خَيْرًا.',['அல்லாஹ் உனக்கு நற்கூலி தருவானாக.','May Allah reward you with good.','අල්ලාහ් ඔබට යහපත් ප්‍රතිඵල දෙත්වා.'])+
      '</div></div>'+
      '<div class="verse"><span class="arw" lang="ar">﴿فِيهِ شِفَاءٌ لِلنَّاسِ﴾</span>'+TE('அதில் மனிதர்களுக்கு நிவாரணம் உண்டு.','In it there is healing for people.','එහි මිනිසුන්ට සුවය ඇත.','div')+'<small>سورة النحل ١٦:٦٩</small></div>'},
    {type:'html',title:['யார் குணமளிக்கிறார்?','Who cures?','සුවය දෙන්නේ කවුද?'],
     intro:['குணமளிப்பவன் அல்லாஹ். நோயாளி குணமடைகிறார். அரபியில் இவை ஒரே சொல்லின் இரண்டு வடிவங்கள்.','Allah is the one who cures; the patient is the one who is cured. In Arabic these are two forms of one word.','සුවය දෙන්නේ අල්ලාහ්ය; රෝගියා සුවය ලබයි. අරාබියෙන් මේවා එකම වචනයේ රූප දෙකකි.'],
     html:'<div class="contrast">'+
        '<div class="cpanel m"><span class="emo" style="font-size:38px">🤲</span><span class="arw" lang="ar" style="font-size:28px;line-height:1.8">شَفَى اللهُ المَرِيضَ</span>'+TE('அல்லாஹ் நோயாளிக்குக் குணமளித்தான்','Allah cured the patient','අල්ලාහ් රෝගියාට සුවය දුන්නා')+'</div>'+
        '<div class="cpanel f"><span class="emo" style="font-size:38px">😊</span><span class="arw" lang="ar" style="font-size:28px;line-height:1.8">شُفِيَ المَرِيضُ</span>'+TE('நோயாளி குணமடைந்தார்','the patient was cured','රෝගියා සුවය ලැබුවා')+'</div>'+
      '</div>'+
      bi('வேறுபாடு உயிர்க்குறிகளில் மட்டுமே: <span class="arw">شَفَى</span> (ஃபத்ஹா) / <span class="arw">شُفِيَ</span> (ழம்மா, கஸ்ரா).','The only difference is the vowel marks: <span class="arw">شَفَى</span> (fatḥa) / <span class="arw">شُفِيَ</span> (ḍamma, kasra).','වෙනස ස්වර ලකුණු පමණි: <span class="arw">شَفَى</span> (ෆත්හා) / <span class="arw">شُفِيَ</span> (ළම්මා, කස්රා).')+
      '<div class="group"><h3>'+ONE('துஆவாக இறந்தகாலம்','The past tense as a duʿāʾ','දුආවක් ලෙස අතීත කාලය')+'</h3>'+
        bi('இந்த வாக்கியங்கள் இறந்தகால வடிவில் இருந்தாலும் "...வானாக" என்ற பிரார்த்தனைகள்.','These look like past-tense sentences, but they are prayers: "may Allah...".','මේවා අතීත කාලයේ වගේ පෙනුණත් ප්‍රාර්ථනා ය: "අල්ලාහ් ... දෙත්වා".')+
        ex('<mark>شَفَاكَ اللهُ</mark>.',['அல்லாஹ் உனக்குக் குணமளிப்பானாக.','May Allah cure you.','අල්ලාහ් ඔබට සුවය දෙත්වා.'])+
        ex('<mark>جَزَاكَ اللهُ</mark> خَيْرًا.',['அல்லாஹ் உனக்கு நற்கூலி தருவானாக.','May Allah reward you with good.','අල්ලාහ් ඔබට යහපත් ප්‍රතිඵල දෙත්වා.'])+
        ex('لِكُلِّ دَاءٍ دَوَاءٌ.',['ஒவ்வொரு நோய்க்கும் ஒரு மருந்து உண்டு.','For every illness there is a medicine.','සෑම රෝගයකටම ඖෂධයක් ඇත.'])+
      '</div>'},

    {type:'html',title:['மருத்துவரிடம்','At the doctor\'s','වෛද්‍යවරයා ළඟ'],
     intro:['ஒரு நோயாளிக்கு இரத்த அழுத்தமும் சர்க்கரையும் அதிகம். மருத்துவர் மூன்று கட்டளைகள் இடுகிறார்.','A patient has high blood pressure and high sugar. The doctor gives three commands.','රෝගියෙකුට රුධිර පීඩනය සහ සීනි ඉහළයි. වෛද්‍යවරයා විධාන තුනක් දෙයි.'],
     html:'<div class="chat"><div class="pair">'+
        D('الضَّغْطُ مُرْتَفِعٌ، وَالسُّكَّرُ مُرْتَفِعٌ.',['இரத்த அழுத்தம் அதிகம்; சர்க்கரையும் அதிகம்.','Your blood pressure is high, and your sugar is high.','පීඩනය ඉහළයි, සීනිත් ඉහළයි.'])+
        D('مَاذَا حَصَلَ؟ لَمْ تَتَّبِعِ الحِمْيَةَ.',['என்ன நடந்தது? நீ பத்தியத்தைப் பின்பற்றவில்லை.','What happened? You did not follow the diet.','මොකද වුණේ? ඔබ ආහාර පාලනය අනුගමනය කළේ නැහැ.'])+
        P('قَدْ تَنَاوَلْتُ كَثِيرًا مِنَ السُّكَّرِيَّاتِ وَالدُّهُونِ وَالنَّشَوِيَّاتِ.',['இனிப்புகள், கொழுப்புகள், மாப்பொருட்களை அதிகம் சாப்பிட்டுவிட்டேன்.','I ate a lot of sugary things, fats and starches.','මම පැණිරස දේ, මේද සහ පිෂ්ඨය ගොඩක් කෑවා.'])+
        D('لَمْ تُمَارِسِ الرِّيَاضَةَ.',['நீ உடற்பயிற்சி செய்யவில்லை.','You did not exercise.','ඔබ ව්‍යායාම කළේ නැහැ.'])+
        P('حَاوَلْتُ وَلٰكِنْ لَمْ أَسْتَطِعْ، أَنَا مَشْغُولٌ دَائِمًا.',['முயன்றேன், ஆனால் முடியவில்லை; நான் எப்போதும் வேலையாக இருக்கிறேன்.','I tried but I couldn\'t; I am always busy.','මම උත්සාහ කළා, ඒත් බැරි වුණා; මම හැමදාම කාර්යබහුලයි.'])+
        D('حَالَتُكَ خَطِيرَةٌ. لَا بُدَّ مِنَ الحِمْيَةِ، وَلَا بُدَّ مِنَ الرِّيَاضَةِ؛ الدَّوَاءُ وَحْدَهُ لَا يَكْفِي.',['உன் நிலை ஆபத்தானது. பத்தியம் அவசியம், உடற்பயிற்சியும் அவசியம்; மருந்து மட்டும் போதாது.','Your condition is dangerous. Diet is a must and exercise is a must; medicine alone is not enough.','ඔබේ තත්ත්වය භයානකයි. ආහාර පාලනය අත්‍යවශ්‍යයි, ව්‍යායාමත් අත්‍යවශ්‍යයි; බෙහෙත් විතරක් මදි.'])+
        P('مَاذَا أَفْعَلُ يَا دُكْتُورُ؟',['டாக்டர், நான் என்ன செய்ய வேண்டும்?','What should I do, doctor?','දොස්තර මහත්තයා, මම මොකද කරන්න ඕනේ?'])+

     intro:['முன்னிடைச் சொல்லுக்கு ஒரே ஒரு வேலைதான்: அதற்குப் பின் வரும் பெயர்ச்சொல்லின் கடைசி எழுத்துக்கு கஸ்ரா (ـِ) கொடுப்பது. அந்தப் பெயர்ச்சொல் <b class="arw">مَجْرُور</b> எனப்படும். நான்காம் புத்தகத்தில் பார்த்த <span class="arw">المَطْبَخِ</span> இதுதான்!',
            'A preposition has just one job: it puts a kasra (ـِ) on the last letter of the noun after it. That noun is called <b class="arw">مَجْرُور</b>. This is the <span class="arw">المَطْبَخِ</span> you saw in booklet 4!',
            'පූර්ව නිපාතයට ඇත්තේ එක් කාර්යයක් පමණි: ඊට පසු එන නාම පදයේ අවසාන අකුරට කස්රා (ـِ) දීම. එම නාම පදය <b class="arw">مَجْرُور</b> ලෙස හැඳින්වේ. 4 වන පොතේ දුටු <span class="arw">المَطْبَخِ</span> මෙයයි!'],
     html:'<div class="eqs"><div class="eq">'+WB('البَطْنُ',['வயிறு','the stomach','බඩ'])+'<span class="op">+ فِي →</span>'+WB('فِي البَطْنِ',['வயிற்றில்','in the stomach','බඩේ'],'add',IC('stomach'))+'</div></div>'+
      '<div class="note-box" style="align-items:center;text-align:center"><span class="arw" style="font-size:64px;line-height:1.2;color:var(--accent)">ـِ</span>'+TE('ஒவ்வொரு முன்னிடைச் சொல்லுக்குப் பிறகும்','after every preposition','සෑම පූර්ව නිපාතයකටම පසු','div')+'</div>'+
      '<div class="eq">'+['إِلَى الطَّبِيبِ','عَلَى الطَّاوِلَةِ','مِنَ العَسَلِ','عَنِ البَيْتِ','بِالقَلَمِ','لِلنَّاسِ'].map(chip).join('')+'</div>'+
      '<div class="note-box">'+bi('<span class="arw">مِنْ</span>, <span class="arw">عَنْ</span> போன்றவற்றின் கடைசி சுகூன், அடுத்த சொல் ال உடன் தொடங்கும்போது உயிர்க்குறியாக மாறும்: <span class="arw">مِنَ العَسَلِ</span>, <span class="arw">عَنِ البَيْتِ</span>. இது உச்சரிப்புக்காக மட்டுமே.',
        'The final sukūn of <span class="arw">مِنْ</span> and <span class="arw">عَنْ</span> turns into a vowel when the next word starts with ال: <span class="arw">مِنَ العَسَلِ</span>, <span class="arw">عَنِ البَيْتِ</span>. That is only to make it easier to say.',
        '<span class="arw">مِنْ</span>, <span class="arw">عَنْ</span> හි අවසාන සුකූන්, ඊළඟ වචනය ال වලින් පටන් ගන්නා විට ස්වරයක් බවට පත් වේ: <span class="arw">مِنَ العَسَلِ</span>, <span class="arw">عَنِ البَيْتِ</span>. එය උච්චාරණයේ පහසුවට පමණි.')+'</div>'},
    {type:'html',title:['مِنْ-இன் ஐந்து பொருள்கள்','Five meanings of مِنْ','مِنْ හි අර්ථ පහ'],
     intro:['<b class="arw">مِنْ</b> சுமார் 13 பொருள்களில் வருகிறது. இந்தப் பாடத்தில் ஐந்து:','<b class="arw">مِنْ</b> is used in about 13 senses. This lesson has five:','<b class="arw">مِنْ</b> අර්ථ 13 ක් පමණ භාවිතා වේ. මෙම පාඩමේ පහක්:'],
     html:'<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+
        sense('🚌',['-இலிருந்து (தொடக்கம்)','from (a starting point)','සිට (ආරම්භය)'],'ذَهَبْتُ مِنْ كُولُومْبُو.',['கொழும்பிலிருந்து சென்றேன்.','I went from Colombo.','මම කොළඹ සිට ගියා.'])+
        sense('🥛',['எதனுடையது (விளக்கம்)','of (says what)','කුමකද (පැහැදිලි කිරීම)'],'شَرِبْتُ كُوبًا مِنَ المَاءِ.',['ஒரு கோப்பை தண்ணீர் குடித்தேன்.','I drank a cup of water.','මම වතුර කෝප්පයක් බිව්වා.'])+
        sense('🥄',['சிறிது (ஒரு பகுதி)','some of (a part)','ටිකක් (කොටසක්)'],'تَنَاوَلْتُ مِنَ العَسَلِ.',['தேனில் சிறிது சாப்பிட்டேன்.','I ate some of the honey.','මම මී පැණි ටිකක් කෑවා.'])+
        sense('😴',['-இலிருந்து (தூக்கத்திலிருந்து)','out of (sleep)','(නින්දෙන්) අවදි'],'أَسْتَيْقِظُ مِنَ النَّوْمِ مُبَكِّرًا.',['தூக்கத்திலிருந்து சீக்கிரம் எழுகிறேன்.','I wake up from sleep early.','මම නින්දෙන් කලින් අවදි වෙනවා.'])+
        sense('📏',['-ஐ விட (ஒப்பீடு)','than (comparing)','ට වඩා (සැසඳීම)'],'أَنَا أَكْبَرُ مِنْكَ.',['நான் உன்னை விட மூத்தவன்.','I am older than you.','මම ඔබට වඩා වයසින් වැඩියි.'])+
      '</div>'+
      '<div class="callout"><h3>'+ONE('முழுவதுமா, சிறிதா?','All of it, or some?','ඔක්කොමද, ටිකක්ද?')+'</h3>'+
        '<div class="contrast">'+
          '<div class="cpanel m"><span class="emo" style="font-size:36px">🍯➡️🫙</span><span class="arw" lang="ar" style="font-size:24px;line-height:1.8">تَنَاوَلْتُ العَسَلَ.</span>'+TE('தேனைச் சாப்பிட்டேன் (முழுவதும்).','I ate the honey (all of it).','මම මී පැණි කෑවා (ඔක්කොම).')+'</div>'+
          '<div class="cpanel f"><span class="emo" style="font-size:36px">🍯🥄</span><span class="arw" lang="ar" style="font-size:24px;line-height:1.8">تَنَاوَلْتُ <mark>مِنَ</mark> العَسَلِ.</span>'+TE('தேனில் சிறிது சாப்பிட்டேன்.','I ate some of the honey.','මම මී පැණි ටිකක් කෑවා.')+'</div>'+
        '</div></div>'},
    {type:'html',title:['தன் சொந்த முன்னிடைச் சொல்லுடன் வரும் சொற்கள்','Words that bring their own preposition','තමන්ගේම පූර්ව නිපාතය සමඟ එන වචන'],
     intro:['இந்தச் சொற்கள் எப்போதும் ஒரே முன்னிடைச் சொல்லுடன் வரும். ஜோடியாக மனப்பாடம் செய்யுங்கள். தமிழிலிருந்து சொல்லுக்குச் சொல் மொழிபெயர்க்க வேண்டாம்: தமிழில் "வீட்டிலிருந்து தொலைவில்", ஆனால் அரபியில் عَنْ, مِنْ அல்ல.',
            'These words always come with the same preposition. Learn them as pairs, and don\'t translate word for word from Tamil or Sinhala: "far from" is بَعِيدٌ عَنْ, not مِنْ.',
            'මෙම වචන සැමවිටම එකම පූර්ව නිපාතය සමඟ එයි. යුගල ලෙස කටපාඩම් කරන්න. සිංහලෙන් වචනයෙන් වචනයට පරිවර්තනය නොකරන්න: "ට දුර" යන්න بَعِيدٌ عَنْ මිස مِنْ නොවේ.'],
     html:'<div class="eqs">'+
        pair('شَعَرَ',['உணர்ந்தார்','he felt','දැනුණා'],'بِـ','أَشْعُرُ بِأَلَمٍ',['வலி உணர்கிறேன்','I feel pain','මට වේදනාවක් දැනෙනවා'])+
        pair('فَكَّرَ',['யோசித்தார்','he thought','හිතුවා'],'بِـ / فِي','تُفَكِّرُ بِالمُشْكِلَةِ',['பிரச்சினையைப் பற்றி யோசிக்கிறாள்','she thinks about the problem','ඇය ප්‍රශ්නය ගැන හිතනවා'])+
        pair('ذَهَبَ',['சென்றார்','he went','ගියා'],'إِلَى','ذَهَبْتُ إِلَى الطَّبِيبِ',['மருத்துவரிடம் சென்றேன்','I went to the doctor','මම වෛද්‍යවරයා ළඟට ගියා'])+
        pair('اشْتَكَى',['முறையிட்டார்','he complained','පැමිණිලි කළා'],'مِنْ','اشْتَكَى مِنْ بَطْنِهِ',['வயிற்றைப் பற்றி முறையிட்டார்','he complained of his stomach','ඔහු බඩ ගැන පැමිණිලි කළා'])+
        pair('بَعِيد',['தொலைவில்','far','දුර'],'عَنْ','بَعِيدٌ عَنِ البَيْتِ',['வீட்டிலிருந்து தொலைவில்','far from the house','නිවසට දුරයි'])+
        pair('اخْتَلَفَ',['வேறுபட்டது','it differed','වෙනස් වුණා'],'عَنْ','تَخْتَلِفُ عَنْ',['-இலிருந்து வேறுபடுகிறது','it differs from','ට වඩා වෙනස්'])+
      '</div>'},

    {type:'html',title:['இரண்டு தோழிகள், இரண்டு பிரச்சினைகள்','Two friends, two problems','යෙහෙළියන් දෙදෙනෙක්, ප්‍රශ්න දෙකක්'],
     intro:['ஸைனப் மெலிந்தவள், எடை கூட வேண்டும். மர்யம் பருமனானவள், எடை குறைய வேண்டும். இருவராலும் முடியவில்லை!','Zaynab is thin and needs to gain weight. Maryam is heavy and needs to lose it. Neither can manage!','සෙයිනබ් කෙට්ටුයි, බර වැඩි විය යුතුයි. මර්යම් මහතයි, බර අඩු විය යුතුයි. දෙදෙනාටම බැහැ!'],

      '<div class="callout"><h3>'+ONE('தமிழிலும் இப்படித்தான்!','English and Tamil do this too','ඉංග්‍රීසියත් මෙහෙමයි')+'</h3>'+
        bi('தமிழிலும் ஒவ்வொரு காலத்துக்கும் வேறு வடிவம்: போகவில்லை (இறந்தகாலம்), போவதில்லை (இப்போது), போகமாட்டான் (எதிர்காலம்). அரபியில் அந்த வேலையை இந்த நான்கு சிறு சொற்கள் செய்கின்றன.',
           'English uses a different form for each time too: did not go, does not go, will never go. Tamil does the same (போகவில்லை, போவதில்லை, போகமாட்டான்). In Arabic, these four small words do that job.',

        'Your course\'s rule: <span class="arw">مَا</span> with a past verb, <span class="arw">لَا</span> with a present verb. (The Qur\'an sometimes uses مَا with a present verb too, e.g. <span class="arw">وَمَا يَنْطِقُ عَنِ الْهَوَى</span>, but as a beginner, follow the rule.)',

    {type:'html',title:['கடைசி உயிர்க்குறி சொல்லும் கதை','The last vowel tells the story','අවසාන ස්වරය කියන කතාව'],
     intro:['<b class="arw">لَا</b> வினையை மாற்றுவதில்லை. <b class="arw">لَمْ</b> கடைசியில் சுகூன் (ـْ) வைக்கிறது. <b class="arw">لَنْ</b> கடைசியில் ஃபத்ஹா (ـَ) வைக்கிறது. கடைசி எழுத்தைப் பாருங்கள்!',
            '<b class="arw">لَا</b> leaves the verb alone. <b class="arw">لَمْ</b> puts a sukūn (ـْ) on the end. <b class="arw">لَنْ</b> puts a fatḥa (ـَ) on the end. Watch the last letter!',

    {type:'html',title:['விருப்பம் இல்லை, மற்றும் பயனுள்ள தொடர்கள்','Not wanting, and some useful phrases','අකමැත්ත, සහ ප්‍රයෝජනවත් වාක්‍ය ඛණ්ඩ'],
     intro:['"விரும்பவில்லை" என்று சொல்ல <b class="arw">لَا تُرِيدُ أَنْ</b> + நிகழ்கால வினை. <b class="arw">أَنْ</b>-உம் <b class="arw">لَنْ</b> போலவே கடைசியில் ஃபத்ஹா தருகிறது: <span class="arw">أَنْ تَكُونَ</span>.',
            'To say "does not want to", use <b class="arw">لَا تُرِيدُ أَنْ</b> + a present verb. <b class="arw">أَنْ</b>, like <b class="arw">لَنْ</b>, gives the verb a fatḥa at the end: <span class="arw">أَنْ تَكُونَ</span>.',
            '"... ට අකමැතියි" කීමට <b class="arw">لَا تُرِيدُ أَنْ</b> + වර්තමාන ක්‍රියා පදය. <b class="arw">أَنْ</b> ද <b class="arw">لَنْ</b> මෙන් අගට ෆත්හා දෙයි: <span class="arw">أَنْ تَكُونَ</span>.'],
     html:'<div class="exlist">'+
        ex('زَيْنَبُ <mark>لَا تُرِيدُ أَنْ تَكُونَ</mark> نَحِيفَةً.',['ஸைனப் மெலிந்தவளாக இருக்க விரும்பவில்லை.','Zaynab does not want to be thin.','සෙයිනබ්ට කෙට්ටු වෙන්න ඕනේ නැහැ.'])+
        ex('مَرْيَمُ <mark>لَا تُرِيدُ أَنْ تَكُونَ</mark> سَمِينَةً.',['மர்யம் பருமனாக இருக்க விரும்பவில்லை.','Maryam does not want to be fat.','මර්යම්ට මහත් වෙන්න ඕනේ නැහැ.'])+
      '</div>'+
      '<div class="duo">'+
        '<div class="dpanel"><span class="emo">✈️</span><span class="arw eg" lang="ar">أُحِبُّ أَنْ أُسَافِرَ بِالجَوِّ.</span>'+TE('விமானத்தில் பயணம் செய்ய விரும்புகிறேன்.','I like to travel by air.','මම ගුවනින් ගමන් කරන්න කැමතියි.')+'</div>'+
        '<div class="dpanel"><span class="emo">🚢</span><span class="arw eg" lang="ar"><mark>لَا</mark> أُحِبُّ السَّفَرَ بِالبَحْرِ.</span>'+TE('கடல் வழிப் பயணம் எனக்குப் பிடிக்காது.','I don\'t like travelling by sea.','මම මුහුදෙන් ගමන් කරන්න කැමති නැහැ.')+'</div>'+
      '</div>'+
      '<div class="group"><h3>'+ONE('لَا உடன் வரும் நிலையான தொடர்கள்','Fixed phrases with لَا','لَا සමඟ එන ස්ථිර වාක්‍ය ඛණ්ඩ')+'</h3>'+
        ex('<mark>لَا بُدَّ مِنَ</mark> الحِمْيَةِ.',['பத்தியம் அவசியம் (தவிர்க்க முடியாது).','Diet is a must (there is no way round it).','ආහාර පාලනය අත්‍යවශ්‍යයි (මගහැරිය නොහැක).'])+
        ex('الدَّوَاءُ <mark>وَحْدَهُ لَا يَكْفِي</mark>.',['மருந்து மட்டும் போதாது.','Medicine alone is not enough.','බෙහෙත් විතරක් මදි.'])+
        ex('جَاءَ <mark>وَحْدَهُ</mark>.',['அவர் தனியாக வந்தார்.','He came alone.','ඔහු තනියම ආවා.'])+
      '</div>'},
    {type:'html',title:['உரையாடல்களில் لَمْ','لَمْ in the dialogues','සංවාදවල لَمْ'],
     intro:['13-ஆம் புத்தகத்தின் இரண்டு உரையாடல்களிலும் لَمْ பல இடங்களில் வருகிறது. கடைசி சுகூனைக் கவனியுங்கள்.','Both dialogues in booklet 13 use لَمْ many times. Watch for the sukūn at the end.','13 වන පොතේ සංවාද දෙකෙහිම لَمْ බොහෝ තැන්වල එයි. අවසාන සුකූන් බලන්න.'],
     html:'<div class="exlist">'+
        ex('لَمْ <mark>أَذْهَبْ</mark> إِلَى الطَّبِيبِ.',['நான் மருத்துவரிடம் போகவே இல்லை.','I did not go to the doctor at all.','මම වෛද්‍යවරයා ළඟට ගියේම නැහැ.'])+
        ex('لَمْ <mark>أَتَنَاوَلْ</mark> أَيَّ دَوَاءٍ.',['நான் எந்த மருந்தும் எடுக்கவில்லை.','I did not take any medicine.','මම කිසිම බෙහෙතක් ගත්තේ නැහැ.'])+
        ex('لَمْ <mark>أَسْمَعْ</mark> بِهَا.',['அதைப் பற்றி நான் கேள்விப்படவில்லை.','I have not heard of it.','මම ඒ ගැන අහලා නැහැ.'])+

      '<div class="group"><h3>'+A('عِنْدَ')+' = '+ONE('-இடம் / -இல்','at / with','ළඟ / හි')+'</h3>'+

          trio('👨‍⚕️','عِنْدَ الطَّبِيبِ',['மருத்துவரிடம் (இடம்)','at the doctor\'s (place)','වෛද්‍යවරයා ළඟ (ස්ථානය)'])+
        '</div>'+
        '<div class="verse"><span class="arw" lang="ar">﴿إِنَّ الدِّينَ عِنْدَ اللَّهِ الْإِسْلَامُ﴾</span>'+TE('நிச்சயமாக அல்லாஹ்விடம் (ஏற்கப்பட்ட) மார்க்கம் இஸ்லாமே.','Indeed, the religion in the sight of Allah is Islam.','සැබැවින්ම අල්ලාහ් වෙත (පිළිගත්) දහම ඉස්ලාමයයි.','div')+'<small>سورة آل عمران ٣:١٩</small></div>'+

      {pic:'🧳',ar:'سَافَرَ',tr:'saafara',ta:'பயணம் செய்தார்',si:'ගමන් කළා',en:'he travelled'},

    {type:'html',title:['நேரச் சொல்லே தீர்மானிக்கிறது','The time word decides','කාල වචනය තීරණය කරයි'],
     intro:['வாக்கியத்தில் நேரச் சொல்லைத் தேடுங்கள். அது எந்தக் காலம் வர வேண்டும் என்று சொல்லிவிடும்.','Look for the time word in the sentence. It tells you which tense the verb must be in.','වාක්‍යයේ කාල වචනය සොයන්න. ක්‍රියා පදය කුමන කාලයේ විය යුතුද කියා එය කියයි.'],
     html:'<div class="exlist">'+
        ex('هُوَ قَرَأَ الكِتَابَ <mark>قَبْلَ يَوْمَيْنِ</mark>.',['அவர் இரண்டு நாட்களுக்கு முன் புத்தகத்தை வாசித்தார்.','He read the book two days ago.','ඔහු දවස් දෙකකට කලින් පොත කියෙව්වා.'])+
        ex('أَنَا أَكْتُبُ الدَّرْسَ <mark>الآنَ</mark>.',['நான் இப்போது பாடத்தை எழுதுகிறேன்.','I am writing the lesson now.','මම දැන් පාඩම ලියනවා.'])+
        ex('سَأَذْهَبُ إِلَى السُّوقِ <mark>غَدًا</mark>.',['நான் நாளை சந்தைக்குப் போவேன்.','I will go to the market tomorrow.','මම හෙට වෙළඳපොළට යනවා.'])+
      '</div>'+
      '<div class="callout"><h3>❄️ '+ONE('உறைந்த சொற்கள்','Frozen words','ශීත කළ වචන')+'</h3>'+
        bi('<span class="arw">أَمْسِ</span>, <span class="arw">الآنَ</span> ஆகியவை <b class="arw">جَامِد</b> ("உறைந்தவை") சொற்கள்: அவற்றின் கடைசி உயிர்க்குறி ஒருபோதும் மாறாது, பன்மையும் இல்லை.',
           '<span class="arw">أَمْسِ</span> and <span class="arw">الآنَ</span> are <b class="arw">جَامِد</b> ("frozen") words: their last vowel never changes, and they have no plural.',
           '<span class="arw">أَمْسِ</span> සහ <span class="arw">الآنَ</span> <b class="arw">جَامِد</b> ("ශීත කළ") වචන ය: ඒවායේ අවසාන ස්වරය කිසිදා වෙනස් නොවේ; බහුවචනයක්ද නැත.')+
      '</div>'+
      '<div class="group"><h3>'+A('كَانَ')+' + '+ONE('நிகழ்காலம் = "...வந்தார்"','present = "used to"','වර්තමානය = "...කළා (පුරුද්දක්)"')+'</h3>'+
        bi('<span class="arw">كَانَ</span> (இருந்தார்) + நிகழ்கால வினை = பழங்காலப் பழக்கம்.','<span class="arw">كَانَ</span> (was) + a present verb = a habit in the past.','<span class="arw">كَانَ</span> (විය) + වර්තමාන ක්‍රියා පදය = අතීතයේ පුරුද්දක්.')+
        ex('<mark>كَانَ</mark> النَّاسُ <mark>يَأْكُلُونَ</mark> كَثِيرًا.',['மக்கள் அதிகம் சாப்பிட்டு வந்தார்கள்.','People used to eat a lot.','මිනිසුන් ගොඩක් කෑවා (පුරුද්දක් ලෙස).'])+
      '</div>'},
    {type:'html',title:['சொல்லின் மூன்று வகைகள்','The three kinds of word','වචනවල වර්ග තුන'],
     intro:['<b class="arw">الكَلِمَةُ ثَلَاثَةُ أَقْسَامٍ: اِسْمٌ وَفِعْلٌ وَحَرْفٌ</b>. ஒவ்வொரு சொல்லையும் இந்த மூன்று படிகளில் சோதியுங்கள்.','<b class="arw">الكَلِمَةُ ثَلَاثَةُ أَقْسَامٍ: اِسْمٌ وَفِعْلٌ وَحَرْفٌ</b>: a word is one of three kinds. Test any word with these three steps.','<b class="arw">الكَلِمَةُ ثَلَاثَةُ أَقْسَامٍ: اِسْمٌ وَفِعْلٌ وَحَرْفٌ</b>. ඕනෑම වචනයක් මෙම පියවර තුනෙන් පරීක්ෂා කරන්න.'],
     html:'<div class="ladder">'+
        rung(1,['இது ஒரு குறிப்பிட்ட நேரத்தில் நடக்கும் செயலா? (நேற்று, இப்போது, அல்லது கட்டளை)','Is it an action that happens at a time? (past, present, or a command)','එය කාලයක සිදු වන ක්‍රියාවක්ද? (අතීතය, වර්තමානය හෝ විධානය)'],'فِعْل')+
        '<div class="ifnot">'+ONE('இல்லையென்றால்','if not','නැත්නම්')+'</div>'+
        rung(2,['இது ஒரு பொருள், இடம் அல்லது மனிதரின் பெயரா? (பெரும்பாலும் ال ஏற்கும்)','Is it the name of a thing, place or person? (it can usually take ال)','එය දෙයක, ස්ථානයක හෝ පුද්ගලයෙකුගේ නමක්ද? (බොහෝවිට ال ගත හැක)'],'اِسْم')+
        '<div class="ifnot">'+ONE('இல்லையென்றால்','if not','නැත්නම්')+'</div>'+
        rung(3,['தனியாகப் பொருள் இல்லாத சிறு சொல்லா?','Is it a small word with no meaning on its own?','තනිව අර්ථයක් නැති කුඩා වචනයක්ද?'],'حَرْف')+
      '</div>'+
      '<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+
        bin('🏃','فِعْل',['வினைச்சொல்','verb','ක්‍රියා පදය'],['قَرَأَ','يُصَلِّي','يَقُولُ','قَالَ','سَافَرَ','اِذْهَبْ'],'var(--accent-soft)')+
        bin('📦','اِسْم',['பெயர்ச்சொல்','noun','නාම පදය'],['عَمّ','عَصْر','صَلَاة','مُحَمَّد','زَيْنَب','النَّاس','المَاء'],'var(--m-soft)')+
        bin('🔗','حَرْف',['இடைச்சொல்','particle','නිපාතය'],['مِنْ','عَلَى','فِي','لَمْ','ثُمَّ','إِلَّا'],'var(--f-soft)')+
      '</div>'+
      '<div class="group"><h3>'+ONE('ஒட்டிய சொற்களைப் பிரித்தல்','Splitting joined words','ඇලුණු වචන වෙන් කිරීම')+'</h3>'+
        bi('சில சொற்கள் இரண்டு வகைகளை ஒட்டி வைத்திருக்கின்றன. பிரித்துப் பாருங்கள்:','Some words glue two kinds together. Split them:','සමහර වචන වර්ග දෙකක් එකට ඇලවී ඇත. වෙන් කර බලන්න:')+
        '<div class="eqs">'+
          '<div class="eq">'+WB('فِيهِ',['அதில்','in it','එහි'])+'<span class="op">=</span>'+WB('فِي',['இடைச்சொல்','particle','නිපාතය'],'f')+'<span class="op">+</span>'+WB('ـهِ',['அது','it','එය'],'m')+'</div>'+
          '<div class="eq">'+WB('لِلنَّاسِ',['மனிதர்களுக்கு','for people','මිනිසුන්ට'])+'<span class="op">=</span>'+WB('لِـ',['இடைச்சொல்','particle','නිපාතය'],'f')+'<span class="op">+</span>'+WB('النَّاس',['பெயர்ச்சொல்','noun','නාම පදය'],'m')+'</div>'+
        '</div>'+
        bi('வகைகளைப் பிரித்தறிதல்தான் <span class="arw">الإِعْرَاب</span>-இன் (வாக்கிய ஆய்வு) முதல் படி.','Sorting words into kinds is the first step of <span class="arw">الإِعْرَاب</span>, sentence analysis.','වචන වර්ගවලට වෙන් කිරීම <span class="arw">الإِعْرَاب</span> (වාක්‍ය විග්‍රහය) හි පළමු පියවරයි.')+
      '</div>'},
    {type:'html',title:['அறிவுரை சொல்லுதல்: "...செய்யாதே!"','Giving advice: "Don\'t...!"','උපදෙස් දීම: "... එපා!"'],
     intro:['பாடநூலின் படப் பயிற்சி: ஒவ்வொரு படத்துக்கும் ஓர் அறிவுரை. "செய்யாதே" என்று சொல்ல <b class="arw">لَا</b> + நிகழ்கால வினை, கடைசியில் <b>சுகூன்</b> (ـْ).',
            'The textbook\'s picture drill: one piece of advice for each picture. To say "don\'t", use <b class="arw">لَا</b> + a present verb with a <b>sukūn</b> (ـْ) at the end.',
            'පෙළපොතේ පින්තූර අභ්‍යාසය: සෑම පින්තූරයකටම එක් උපදෙසක්. "එපා" කීමට <b class="arw">لَا</b> + අගට <b>සුකූන්</b> (ـْ) සහිත වර්තමාන ක්‍රියා පදය.'],
     html:'<div class="contrast">'+
        '<div class="cpanel m"><span class="arw" lang="ar" style="font-size:30px;line-height:1.8">لَا تَأْكُلُ</span><span class="mk" aria-hidden="true">ـُ</span>'+TE('நீ சாப்பிடுவதில்லை (தகவல், 15-ஆம் புத்தகம்)','you don\'t eat (a fact, booklet 15)','ඔබ කන්නේ නැහැ (කරුණක්, 15 වන පොත)')+'</div>'+
        '<div class="cpanel f"><span class="arw" lang="ar" style="font-size:30px;line-height:1.8">لَا تَأْكُلْ</span><span class="mk" aria-hidden="true">ـْ</span>'+TE('சாப்பிடாதே! (அறிவுரை)','don\'t eat! (advice)','කන්න එපා! (උපදෙස)')+'</div>'+
      '</div>'+
      '<div class="exlist">'+
        adv('🥛','<mark>لَا تَشْرَبِ</mark> الحَلِيبَ كَامِلَ الدَّسَمِ.',['முழுக் கொழுப்புப் பால் குடிக்காதே.','Don\'t drink full-cream milk.','සම්පූර්ණ ආඩිය කිරි බොන්න එපා.'])+
        adv('☕','<mark>لَا تَضَعْ</mark> كَثِيرًا مِنَ السُّكَّرِ فِي الشَّايِ.',['தேநீரில் அதிகச் சீனி போடாதே.','Don\'t put a lot of sugar in your tea.','තේට සීනි ගොඩක් දාන්න එපා.'])+
        adv('🍔','<mark>لَا تَأْكُلْ</mark> كَثِيرًا مِنَ الوَجَبَاتِ السَّرِيعَةِ.',['துரித உணவுகளை அதிகம் சாப்பிடாதே.','Don\'t eat a lot of fast food.','ක්ෂණික ආහාර ගොඩක් කන්න එපා.'])+
        adv('🍚','<mark>لَا تَأْكُلْ</mark> كَثِيرًا مِنَ الأَرُزِّ.',['அதிகம் சோறு சாப்பிடாதே.','Don\'t eat a lot of rice.','බත් ගොඩක් කන්න එපා.'])+
        adv('🥗','<mark>كُلْ</mark> مِنَ الخُضْرَوَاتِ وَالسَّلَطَةِ.',['காய்கறிகளையும் சாலட்டையும் சாப்பிடு.','Eat vegetables and salad.','එළවළු සහ සලාද කන්න.'])+
      '</div>'},
    {type:'html',title:['பழைய உணவு, புதிய உணவு','Traditional food, modern food','සාම්ප්‍රදායික ආහාර, නවීන ආහාර'],
     intro:['பாடநூலின் இரண்டு படங்கள்: வலப்பக்கம் பாரம்பரிய உணவு, இடப்பக்கம் நவீன "துரித உணவு".','The textbook\'s two pictures: traditional food on the right, modern fast food on the left.','පෙළපොතේ පින්තූර දෙක: දකුණු පැත්තේ සාම්ප්‍රදායික ආහාර, වම් පැත්තේ නවීන ක්ෂණික ආහාර.'],

     intro:['"ஆம் / இல்லை" கேள்விக்கு இரண்டு சொற்கள்: <b class="arw">هَلْ</b>, <b class="arw">أَ</b> (ஹம்ஸா). இரண்டும் ஒரே பொருள். ஒரே வேறுபாடு: எதிர்மறை வாக்கியத்துடன் <b class="arw">أَ</b> மட்டுமே வரும்.',
            'For a yes/no question there are two words, <b class="arw">هَلْ</b> and <b class="arw">أَ</b> (the hamza), with the same meaning. The one difference: with a negative sentence, only <b class="arw">أَ</b> can be used.',
            '"ඔව් / නැහැ" ප්‍රශ්නයට වචන දෙකක් ඇත: <b class="arw">هَلْ</b> සහ <b class="arw">أَ</b> (හම්සා). අර්ථය එකමයි. එකම වෙනස: නිෂේධ වාක්‍යයක් සමඟ <b class="arw">أَ</b> පමණක් එයි.'],
     html:'<div class="contrast">'+
        '<div class="cpanel m"><span class="arw huge" lang="ar">هَلْ</span><span class="emo" style="font-size:28px">✅</span>'+TE('உடன்பாட்டு வாக்கியம் மட்டும்','positive sentences only','ධනාත්මක වාක්‍ය පමණි')+'<span class="arw" lang="ar" style="font-size:22px;line-height:1.9">هَلْ أَكَلْتَ؟</span>'+TE('நீ சாப்பிட்டாயா?','Did you eat?','ඔබ කෑවාද?')+'</div>'+
        '<div class="cpanel f"><span class="arw huge" lang="ar">أَ</span><span class="emo" style="font-size:28px">✅ ❌</span>'+TE('உடன்பாடும் எதிர்மறையும்','positive and negative','ධනාත්මක සහ නිෂේධ')+'<span class="arw" lang="ar" style="font-size:22px;line-height:1.9">أَلَمْ تَأْكُلْ؟</span>'+TE('நீ சாப்பிடவில்லையா?','Did you not eat?','ඔබ කෑවේ නැද්ද?')+'</div>'+
      '</div>'+
      '<div class="exlist">'+
        ex('<mark>هَلْ</mark> أَنْتَ طَالِبٌ؟ = <mark>أَ</mark>أَنْتَ طَالِبٌ؟',['நீ மாணவனா?','Are you a student?','ඔබ ශිෂ්‍යයෙක්ද?'])+
        ex('<mark>أَ</mark>جَاءَ هَارُونُ؟',['ஹாரூன் வந்தாரா?','Did Harun come?','හාරූන් ආවාද?'])+
        ex('<s>هَلْ لَمْ تَأْكُلْ؟</s> ✗ → <mark>أَلَمْ</mark> تَأْكُلْ؟ ✓',['لَمْ (எதிர்மறை) உடன் هَلْ வராது.','هَلْ cannot go with لَمْ (a negative).','لَمْ (නිෂේධ) සමඟ هَلْ නොඑයි.'])+
      '</div>'+
      '<div class="verse"><span class="arw" lang="ar">﴿<mark>أَلَمْ</mark> تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ﴾</span>'+TE('யானைப் படையினரை உம் இறைவன் என்ன செய்தான் என்பதை நீர் பார்க்கவில்லையா?','Have you not seen how your Lord dealt with the people of the elephant?','ඔබේ පරමාධිපති ඇත් සේනාවට කළ දේ ඔබ දුටුවේ නැද්ද?','div')+'<small>سورة الفيل ١٠٥:١</small></div>'},
    {type:'html',title:['أَيّ: எது?','أَيّ: which one?','أَيّ: කුමක්ද?'],
     intro:['பலவற்றில் ஒன்றைத் தேர்ந்தெடுக்கக் கேட்க <b class="arw">أَيّ</b>. இதற்கு ஒரு விதி: அதற்கு அடுத்த சொல் எப்போதும் கஸ்ரா (ـِ) பெறும். <b class="arw">أَيّ</b>-இன் சொந்த முடிவு வாக்கியத்தில் அதன் வேலையைப் பொறுத்து மாறும்.',
            'Use <b class="arw">أَيّ</b> to ask which one out of several. One rule: the word after it always takes a kasra (ـِ). The ending on <b class="arw">أَيّ</b> itself changes with its job in the sentence.',
            'කිහිපයකින් එකක් තෝරා ගැනීමට <b class="arw">أَيّ</b>. එක් නීතියක්: ඊට පසු එන වචනයට සැමවිටම කස්රා (ـِ) ලැබේ. <b class="arw">أَيّ</b> හි අවසානය වාක්‍යයේ එහි කාර්යය අනුව වෙනස් වේ.'],
     html:'<div class="note-box" style="align-items:center;text-align:center"><span class="emo" style="font-size:40px">📕 📗 📘 👆</span>'+A('أَيَّ كِتَابٍ تُرِيدُ؟','big')+TE('நீ எந்தப் புத்தகத்தை விரும்புகிறாய்?','Which book do you want?','ඔබට ඕනේ කුමන පොතද?','div')+'<span class="arw" lang="ar" style="font-size:24px">— كِتَابَ القَوَاعِدِ.</span>'+TE('— இலக்கணப் புத்தகம்.','— The grammar book.','— ව්‍යාකරණ පොත.','div')+'</div>'+
      '<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">'+
        panel('🎯','أَيَّ',['செயப்படுபொருள் → ـَ','object → ـَ','කර්මය → ـَ'],'أَيَّ طَعَامٍ أَكَلْتَ؟',['எந்த உணவைச் சாப்பிட்டாய்?','Which food did you eat?','ඔබ කෑවේ කුමන කෑමද?'])+
        panel('🏃','أَيُّ',['செய்பவர் → ـُ','subject → ـُ','කර්තෘ → ـُ'],'أَيُّ رَجُلٍ جَاءَ؟',['எந்த மனிதர் வந்தார்?','Which man came?','ආවේ කුමන මිනිසාද?'])+
        panel('📦','أَيِّ',['முன்னிடைச் சொல்லுக்குப் பின் → ـِ','after a preposition → ـِ','පූර්ව නිපාතයකට පසු → ـِ'],'فِي أَيِّ مَسْجِدٍ تُصَلِّي؟',['எந்தப் பள்ளிவாசலில் தொழுகிறாய்?','In which mosque do you pray?','ඔබ සලාතය කරන්නේ කුමන පල්ලියේද?'])+
      '</div>'+
      '<div class="note-box">'+bi('மூன்றிலும் அடுத்த சொல் கஸ்ராவுடன்: <span class="arw">طَعَامٍ، رَجُلٍ، مَسْجِدٍ</span>. அது <span class="arw">مُضَافٌ إِلَيْهِ</span>; எப்போதும் கஸ்ரா. "رَجُلٌ" அல்ல!',
        'In all three, the next word has a kasra: <span class="arw">طَعَامٍ، رَجُلٍ، مَسْجِدٍ</span>. It is a <span class="arw">مُضَافٌ إِلَيْهِ</span>, which always takes kasra. Not "رَجُلٌ"!',
        'තුනේම ඊළඟ වචනයට කස්රා ඇත: <span class="arw">طَعَامٍ، رَجُلٍ، مَسْجِدٍ</span>. එය <span class="arw">مُضَافٌ إِلَيْهِ</span> ය; සැමවිටම කස්රා. "رَجُلٌ" නොවේ!')+'</div>'},
    {type:'html',title:['كَمْ: மூன்று பயன்கள்','كَمْ: three uses','كَمْ: භාවිත තුනක්'],
     html:'<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">'+
        panel('🔢','كَمْ',['எத்தனை?','how many?','කීයද?'],'كَمْ طِفْلًا؟ — خَمْسَةُ أَطْفَالٍ.',['எத்தனை பிள்ளைகள்? — ஐந்து பிள்ளைகள்.','How many children? — Five children.','දරුවෝ කී දෙනෙක්ද? — දරුවෝ පස් දෙනෙක්.'])+
        panel('🕐','كَمِ السَّاعَةُ؟',['மணி என்ன?','what time is it?','වෙලාව කීයද?'],'السَّاعَةُ الخَامِسَةُ.',['ஐந்து மணி.','It is five o\'clock.','පහයි.'])+
        panel('💰','بِكَمْ',['என்ன விலை?','how much (price)?','මිල කීයද?'],'بِكَمِ القَلَمُ؟ — القَلَمُ بِعِشْرِينَ رِيَالًا.',['பேனா என்ன விலை? — இருபது ரியால்.','How much is the pen? — Twenty riyals.','පෑන කීයද? — රියාල් විස්සයි.'])+
      '</div>'+
      '<div class="callout"><h3>'+ONE('இரண்டு எச்சரிக்கைகள்','Two warnings','අවවාද දෙකක්')+'</h3>'+
        bi('1. <span class="arw">كَمْ</span>-க்குப் பின் எப்போதும் ஒருமை, ـً உடன்: <span class="arw">كَمْ قَلَمًا</span>, ஒருபோதும் "كَمْ أَقْلَامًا" அல்ல. 2. ال உடன் வருவது நேரம் கேட்கும்போது மட்டும்: <span class="arw">كَمِ السَّاعَةُ؟</span> = மணி என்ன? ஆனால் <span class="arw">كَمْ سَاعَةً؟</span> = எத்தனை மணி நேரம்?',
           '1. After <span class="arw">كَمْ</span> always a singular with ـً: <span class="arw">كَمْ قَلَمًا</span>, never "كَمْ أَقْلَامًا". 2. Only when asking the time does ال come: <span class="arw">كَمِ السَّاعَةُ؟</span> = what time is it? But <span class="arw">كَمْ سَاعَةً؟</span> = how many hours?',
           '1. <span class="arw">كَمْ</span> ට පසු සැමවිටම ـً සහිත ඒකවචනය: <span class="arw">كَمْ قَلَمًا</span>, කිසිදා "كَمْ أَقْلَامًا" නොවේ. 2. ال එන්නේ වේලාව අසන විට පමණි: <span class="arw">كَمِ السَّاعَةُ؟</span> = වෙලාව කීයද? නමුත් <span class="arw">كَمْ سَاعَةً؟</span> = පැය කීයද?')+
      '</div>'+
      '<div class="group"><h3>'+A('مَعَكَ')+' / '+A('عِنْدَكَ')+'</h3>'+
        '<div class="duo">'+
          panel('👛','مَعَكَ',['இப்போது உன் கையில்','with you right now','දැන් ඔබ අත'],'كَمْ رِيَالًا مَعَكَ؟',['இப்போது உன்னிடம் எத்தனை ரியால்?','How many riyals have you got on you?','දැන් ඔබ ළඟ රියාල් කීයක් තියෙනවාද?'])+
          panel('🏦','عِنْدَكَ',['உனக்குச் சொந்தமாக','that you own','ඔබට අයිති'],'كَمْ بَيْتًا عِنْدَكَ؟',['உனக்கு எத்தனை வீடுகள் உள்ளன?','How many houses do you own?','ඔබට නිවාස කීයක් තියෙනවාද?'])+
        '</div></div>'},
    {type:'html',title:['யார்? என்ன? ஏன்?','Who? What? Why?','කවුද? කුමක්ද? ඇයි?'],
     intro:['முதல் புத்தகத்தின் விதிகள், இன்னும் கொஞ்சம் ஆழமாக.','Booklet 1\'s rules, a little deeper.','1 වන පොතේ නීති, තව ටිකක් ගැඹුරින්.'],
     html:'<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">'+
        panel('👤','مَنْ',['மனிதர்களுக்கு மட்டும்','people only','මිනිසුන්ට පමණි'],'مَنْ هٰذَا؟',['இவர் யார்?','Who is this?','මේ කවුද?'])+
        panel('📦','مَا',['பொருள் + பெயர்ச்சொல்','a thing + a noun','දෙයක් + නාම පදය'],'مَا هٰذَا؟',['இது என்ன?','What is this?','මේ මොකක්ද?'])+
        panel('🏃','مَاذَا',['பொருள் + வினைச்சொல்','a thing + a verb','දෙයක් + ක්‍රියා පදය'],'مَاذَا حَصَلَ؟',['என்ன நடந்தது?','What happened?','මොකද වුණේ?'])+
      '</div>'+
      '<div class="callout"><h3>'+ONE('ஏன் مَاذَا?','Why مَاذَا?','ඇයි مَاذَا?')+'</h3>'+
        bi('15-ஆம் புத்தகத்தை நினைவுகூருங்கள்: <span class="arw">مَا</span> + இறந்தகால வினை = "இல்லை" (<span class="arw">مَا فَعَلْتَ</span> = நீ செய்யவில்லை). அதனால் வினைக்கு முன் கேள்வி கேட்க <span class="arw">ذَا</span> சேர்க்கிறோம்: <span class="arw">مَاذَا فَعَلْتَ؟</span> = நீ என்ன செய்தாய்?',
           'Remember booklet 15: <span class="arw">مَا</span> + a past verb = "not" (<span class="arw">مَا فَعَلْتَ</span> = you did not do it). So to ask a question before a verb we add <span class="arw">ذَا</span>: <span class="arw">مَاذَا فَعَلْتَ؟</span> = what did you do?',
           '15 වන පොත මතක් කරන්න: <span class="arw">مَا</span> + අතීත ක්‍රියා පදය = "නැහැ" (<span class="arw">مَا فَعَلْتَ</span> = ඔබ කළේ නැහැ). එබැවින් ක්‍රියා පදයකට පෙර ප්‍රශ්නයක් ඇසීමට <span class="arw">ذَا</span> එකතු කරමු: <span class="arw">مَاذَا فَعَلْتَ؟</span> = ඔබ මොකද කළේ?')+

/* three root-letter slots, first letter on the right; hl = list of slot numbers (1..3) to highlight */
function slots(hl){var s='<span style="display:inline-flex;gap:4px;direction:rtl">';for(var i=1;i<=3;i++){var on=hl.indexOf(i)>-1;s+='<span style="width:22px;height:22px;border-radius:5px;border:2px solid var(--ink);background:'+(on?'var(--accent)':'var(--paper)')+'"></span>';}return s+'</span>';}
function trow(ar,t,hl,eg){return '<tr><td class="a">'+ar+'</td><td>'+TE(t[0],t[1],t[2])+'</td><td>'+slots(hl)+'</td><td class="a">'+eg+'</td></tr>';}
function cell(pr,v){return v?'<td style="text-align:center"><span class="arw" lang="ar" style="font-size:13px;color:var(--muted);display:block;line-height:1.2">'+pr+'</span><span class="arw" lang="ar" style="font-size:22px;font-weight:600;line-height:1.6">'+v+'</span></td>':'<td style="color:var(--muted)">—</td>';}
function prow(emo,t,c1,c2,c3){return '<tr><td style="text-align:left"><span class="emo" style="font-size:20px">'+emo+'</span> '+ONE(t[0],t[1],t[2])+'</td>'+cell(c1[0],c1[1])+cell(c2[0],c2[1])+cell(c3[0],c3[1])+'</tr>';}
function thead(){return '<thead><tr><th></th><th>'+ONE('ஒருவர்','one','එක් අයෙක්')+'</th><th>'+ONE('இருவர்','two','දෙදෙනෙක්')+'</th><th>'+ONE('பலர்','many','බොහෝ දෙනෙක්')+'</th></tr></thead>';}
function arrow(a,at,b,bt,cls,pic){return '<div class="eq">'+WB(a,at)+'<span class="op">→</span>'+WB(b,bt,cls||'',pic)+'</div>';}
function line(side,who,ar,t){return '<div class="msg '+side+'"><span class="who">'+who+'</span><span class="arw" lang="ar">'+ar+'</span>'+TE(t[0],t[1],t[2])+'</div>';}
