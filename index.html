        bi('நிகழ்காலத்தின் நடு எழுத்தின் உயிர்க்குறி ஒவ்வொரு வினைக்கும் வேறு; அதை வினையுடன் சேர்த்து மனப்பாடம் செய்ய வேண்டும்:','The vowel on the present tense\'s middle letter is different for each verb; learn it together with the verb:','වර්තමාන කාලයේ මැද අකුරේ ස්වරය සෑම ක්‍රියාවකටම වෙනස්; එය ක්‍රියා පදය සමඟම කටපාඩම් කරන්න:')+

        '<div class="eq">'+WB('سَيَكْتُبُ',['எழுதுவார்','he will write','ලියනු ඇත'],'f')+WB('مَا كَتَبَ',['எழுதவில்லை','he did not write','ලිව්වේ නැහැ'],'m')+WB('لَا يَكْتُبُ',['எழுதுவதில்லை','he does not write','ලියන්නේ නැහැ'])+'</div>'+
        bi('கவனம்: <span class="arw">مَا يَكْتُبُ</span> என்றால் "இல்லை" அல்ல, "அவர் எழுதுவது" (<span class="arw">رَأَيْتُ مَا يَكْتُبُ</span> = அவர் எழுதுவதைப் பார்த்தேன்).',

    {type:'html',title:['ஐந்து பேருக்குக் கட்டளை','Commanding five people','පුද්ගලයන් පස් දෙනෙකුට විධාන'],
     intro:['கட்டளை எதிரில் இருப்பவருக்கு மட்டுமே. ஐந்து <b class="arw">تَـ</b> வடிவங்களிலிருந்து: (1) <b class="arw">تَـ</b>-ஐ நீக்கு, (2) கடைசியில் சுகூன். ـِينَ, ـَانِ, ـُونَ-இன் <b class="arw">ن</b> விழுந்துவிடும்; ஆனால் பெண்கள் பன்மையின் <b class="arw">ن</b> நிற்கும்.',
            'You can only command someone in front of you. Start from the five <b class="arw">تَـ</b> forms: (1) drop the <b class="arw">تَـ</b>; (2) put a sukūn on the end. The <b class="arw">ن</b> of ـِينَ, ـَانِ and ـُونَ falls away, but the <b class="arw">ن</b> of the feminine plural stays.',
            'විධාන කළ හැක්කේ ඉදිරියේ සිටින අයට පමණි. <b class="arw">تَـ</b> රූප පහෙන්: (1) <b class="arw">تَـ</b> ඉවත් කරන්න, (2) අගට සුකූන්. ـِينَ, ـَانِ, ـُونَ හි <b class="arw">ن</b> වැටේ; නමුත් ස්ත්‍රී බහුවචනයේ <b class="arw">ن</b> පවතී.'],
     html:'<div class="eqs">'+
        arrow('تَكْتُبُ',['நீ எழுதுகிறாய் (ஆண்)','you (m) write','ඔබ ලියනවා (පු)'],'اُكْتُبْ',['எழுது!','write! (man)','ලියන්න! (පු)'],'m','👉🧔')+
        arrow('تَكْتُبِينَ',['நீ எழுதுகிறாய் (பெண்)','you (f) write','ඔබ ලියනවා (ස්ත්‍රී)'],'اُكْتُبِي',['எழுது! (பெண்)','write! (woman)','ලියන්න! (ස්ත්‍රී)'],'f','👉🧕')+
        arrow('تَكْتُبَانِ',['நீங்கள் இருவர் எழுதுகிறீர்கள்','you two write','ඔබ දෙදෙනා ලියනවා'],'اُكْتُبَا',['இருவரும் எழுதுங்கள்!','write! (two)','ලියන්න! (දෙදෙනා)'],'','👉👥')+
        arrow('تَكْتُبُونَ',['நீங்கள் எழுதுகிறீர்கள் (ஆண்கள்)','you (men) write','ඔබලා ලියනවා (පු)'],'اُكْتُبُوا',['எழுதுங்கள்! (ஆண்கள்)','write! (men)','ලියන්න! (පු)'],'m','👉👨‍👨‍👦')+
        arrow('تَكْتُبْنَ',['நீங்கள் எழுதுகிறீர்கள் (பெண்கள்)','you (women) write','ඔබලා ලියනවා (ස්ත්‍රී)'],'اُكْتُبْنَ',['எழுதுங்கள்! (பெண்கள்)','write! (women)','ලියන්න! (ස්ත්‍රී)'],'f','👉👩‍👩‍👧')+
      '</div>'+
      '<div class="callout"><h3>'+ONE('முன்னால் اُ அல்லது اِ?','اُ or اِ in front?','ඉදිරියෙන් اُ ද اِ ද?')+'</h3>'+
        bi('<span class="arw">تَـ</span>-ஐ நீக்கியதும் சொல் சுகூனில் தொடங்குகிறது (<span class="arw">كْتُبْ</span>), அதை உச்சரிக்க முடியாது. அதனால் ஒரு அலிஃப் (<span class="arw">هَمْزَةُ الوَصْلِ</span>) சேர்க்கிறோம். நடு எழுத்தில் ழம்மா இருந்தால் <span class="arw">اُ</span>; இல்லையென்றால் <span class="arw">اِ</span> (8-ஆம், 9-ஆம் புத்தகங்கள்).',
           'Once <span class="arw">تَـ</span> is dropped, the word starts with a sukūn (كْتُبْ), which cannot be said. So we add an alif (<span class="arw">هَمْزَةُ الوَصْلِ</span>): <span class="arw">اُ</span> if the middle letter has a ḍamma, otherwise <span class="arw">اِ</span> (booklets 8 and 9).',
           '<span class="arw">تَـ</span> ඉවත් කළ පසු වචනය සුකූන් එකකින් පටන් ගනී (كْتُبْ); එය උච්චාරණය කළ නොහැක. එබැවින් අලිෆ් එකක් (<span class="arw">هَمْزَةُ الوَصْلِ</span>) එකතු කරමු: මැද අකුරට ළම්මා ඇත්නම් <span class="arw">اُ</span>; නැත්නම් <span class="arw">اِ</span> (8 සහ 9 වන පොත්).')+
        '<div class="eq">'+WB('اُكْتُبْ',['يَكْتُبُ ← ـُ','يَكْتُبُ ← ـُ','يَكْتُبُ ← ـُ'])+WB('اُنْظُرْ',['يَنْظُرُ ← ـُ','يَنْظُرُ ← ـُ','يَنْظُرُ ← ـُ'])+WB('اِفْتَحْ',['يَفْتَحُ ← ـَ','يَفْتَحُ ← ـَ','يَفْتَحُ ← ـَ'])+WB('اِنْزِلْ',['يَنْزِلُ ← ـِ','يَنْزِلُ ← ـِ','يَنْزِلُ ← ـِ'])+'</div>'+
        bi('முன்னால் வேறு சொல் இருந்தால் இந்த அலிஃப் உச்சரிக்கப்படாது: <span class="arw">وَاكْتُبْ</span> (wa-ktub).','If another word comes before it, this alif is not pronounced: <span class="arw">وَاكْتُبْ</span> (wa-ktub).','ඉදිරියෙන් වෙනත් වචනයක් ඇත්නම් මෙම අලිෆ් උච්චාරණය නොවේ: <span class="arw">وَاكْتُبْ</span> (wa-ktub).')+
      '</div>'},
    {type:'html',title:['சிறப்புக் கட்டளைகள்: كُلْ، خُذْ، مُدَّ','Special commands: كُلْ، خُذْ، مُدَّ','විශේෂ විධාන: كُلْ، خُذْ، مُدَّ'],
     intro:['ஹம்ஸா வினைகளும் இரட்டை எழுத்து வினைகளும் கட்டளையில் மட்டுமே வேறுபடுகின்றன.','Hamza verbs and doubled verbs only look different in the command form.','හම්සා ක්‍රියා සහ දෙගුණ අකුරු ක්‍රියා වෙනස් වන්නේ විධාන රූපයේ පමණි.'],
     html:'<div class="group"><h3>'+A('المَهْمُوز')+' — '+ONE('ஹம்ஸா வினை','the hamza verb','හම්සා ක්‍රියාව')+'</h3>'+
        bi('முதல் எழுத்து ஹம்ஸா என்றால், கட்டளையில் அலிஃப் சேர்க்க வேண்டாம்; ஹம்ஸாவையே நீக்குங்கள்.','If the first root letter is a hamza, don\'t add an alif in the command; drop the hamza itself.','පළමු මූල අකුර හම්සා නම්, විධානයේ අලිෆ් එකතු නොකරන්න; හම්සාවම ඉවත් කරන්න.')+
        '<div class="eqs">'+
          arrow('يَأْكُلُ',['சாப்பிடுகிறான்','he eats','කයි'],'كُلْ',['சாப்பிடு!','eat!','කන්න!'],'add','🍽️')+
          arrow('يَأْخُذُ',['எடுக்கிறான்','he takes','ගනී'],'خُذْ',['எடு!','take!','ගන්න!'],'add','🤲')+
          arrow('تَأْكُلِينَ',['நீ சாப்பிடுகிறாய் (பெண்)','you (f) eat','ඔබ කනවා (ස්ත්‍රී)'],'كُلِي',['சாப்பிடு! (பெண்)','eat! (woman)','කන්න! (ස්ත්‍රී)'],'add','🍽️')+
        '</div>'+
        bi('ஹம்ஸா நடுவிலோ கடைசியிலோ இருந்தால் (<span class="arw">سَأَلَ، قَرَأَ</span>) எந்த மாற்றமும் இல்லை: <span class="arw">اِقْرَأْ</span>.','If the hamza is in the middle or at the end (<span class="arw">سَأَلَ، قَرَأَ</span>), nothing changes: <span class="arw">اِقْرَأْ</span>.','හම්සා මැද හෝ අග ඇත්නම් (<span class="arw">سَأَلَ، قَرَأَ</span>) කිසිදු වෙනසක් නැත: <span class="arw">اِقْرَأْ</span>.')+
      '</div>'+
      '<div class="group"><h3>'+A('المُضَاعَف')+' — '+ONE('இரட்டை எழுத்து வினை','the doubled verb','දෙගුණ අකුරු ක්‍රියාව')+'</h3>'+
        bi('இரண்டாவது, மூன்றாவது எழுத்துகள் ஒன்றே, ஷத்தாவுடன் (ـّ). கட்டளையில் அலிஃப் தேவையில்லை; கடைசியில் ஃபத்ஹா வருகிறது.','The second and third root letters are the same, written with a shadda (ـّ). The command needs no alif, and it ends in a fatḥa.','දෙවන සහ තුන්වන මූල අකුරු එකමයි, ෂද්දා (ـّ) සමඟ. විධානයට අලිෆ් අවශ්‍ය නැත; අගට ෆත්හා එයි.')+

          '<tr><td class="a">فَرَّ</td><td class="a">يَفِرُّ</td><td class="a" style="color:var(--accent)">فِرَّ</td><td>'+TE('ஓடிவிடு!','run away!','පලා යන්න!')+'</td></tr>'+
        '</tbody></table></div>'+
        bi('பெண்கள் பன்மையில் ஷத்தா பிரிந்துவிடும்: <span class="arw">يَمْدُدْنَ</span>. "நான் கையை நீட்டினேன்" = <span class="arw">مَدَدْتُ يَدِي</span>.','In the feminine plural the shadda comes apart: <span class="arw">يَمْدُدْنَ</span>. "I stretched out my hand" = <span class="arw">مَدَدْتُ يَدِي</span>.','ස්ත්‍රී බහුවචනයේ ෂද්දා වෙන් වේ: <span class="arw">يَمْدُدْنَ</span>. "මම අත දිගු කළා" = <span class="arw">مَدَدْتُ يَدِي</span>.')+
      '</div>'+
      '<div class="note-box">'+bi('இல்லாதவருக்குக் கட்டளை (<span class="arw">أَمْرُ الغَائِب</span>): <span class="arw">لِيَذْهَبْ</span> = "அவன் போகட்டும்". இது பின்னர் விரிவாக வரும்.','A command about someone absent (<span class="arw">أَمْرُ الغَائِب</span>): <span class="arw">لِيَذْهَبْ</span> = "let him go". This comes in full later.','නොසිටින අයෙකුට විධානය (<span class="arw">أَمْرُ الغَائِب</span>): <span class="arw">لِيَذْهَبْ</span> = "ඔහු යාවා". මෙය පසුව සවිස්තරව එයි.')+'</div>'},
    {type:'html',title:['பக்கம் 83: நிகழ்காலம் → கட்டளை','Page 83: present → command','83 වන පිටුව: වර්තමානය → විධානය'],
     intro:['பாடநூல் பயிற்சி: வாக்கியத்தை கட்டளையாக்கி, பெயருக்கு முன் <b class="arw">يَا</b> சேருங்கள். "அவனுடைய" (ـهُ) என்பது "உன்னுடைய" (ـكَ) ஆகிறது.','The textbook drill: turn each sentence into a command and put <b class="arw">يَا</b> before the name. "His" (ـهُ) becomes "your" (ـكَ).','පෙළපොතේ අභ්‍යාසය: වාක්‍යය විධානයක් බවට පත් කර නමට පෙර <b class="arw">يَا</b> එකතු කරන්න. "ඔහුගේ" (ـهُ) "ඔබේ" (ـكَ) බවට පත් වේ.'],
     html:'<div class="eqs">'+
        arrow('يَحْمَدُ زَيْدٌ رَبَّهُ.',['ஸைத் தன் இறைவனைப் புகழ்கிறார்.','Zayd praises his Lord.','සෙයිද් තම පරමාධිපතිට ප්‍රශංසා කරයි.'],'يَا زَيْدُ، اِحْمَدْ رَبَّكَ.',['ஸைதே, உன் இறைவனைப் புகழ்!','Zayd, praise your Lord!','සෙයිද්, ඔබේ පරමාධිපතිට ප්‍රශංසා කරන්න!'],'m')+
        arrow('تَسْجُدُ آمِنَةُ لِرَبِّهَا.',['ஆமினா தன் இறைவனுக்குச் சுஜூது செய்கிறாள்.','Amina prostrates to her Lord.','ආමිනා තම පරමාධිපතිට සුජූද් කරයි.'],'يَا آمِنَةُ، اُسْجُدِي لِرَبِّكِ.',['ஆமினாவே, உன் இறைவனுக்குச் சுஜூது செய்!','Amina, prostrate to your Lord!','ආමිනා, ඔබේ පරමාධිපතිට සුජූද් කරන්න!'],'f')+
        arrow('يَفْعَلُ الرَّجُلَانِ خَيْرًا.',['இரண்டு மனிதர்களும் நன்மை செய்கிறார்கள்.','The two men do good.','මිනිසුන් දෙදෙනා යහපත කරති.'],'يَا رَجُلَانِ، اِفْعَلَا خَيْرًا.',['மனிதர்களே (இருவரே), நன்மை செய்யுங்கள்!','You two men, do good!','මිනිසුන් දෙදෙනෙනි, යහපත කරන්න!'])+
        arrow('يَذْهَبُ الرِّجَالُ إِلَى المَسْجِدِ.',['ஆண்கள் பள்ளிவாசலுக்குச் செல்கிறார்கள்.','The men go to the mosque.','පිරිමින් පල්ලියට යති.'],'يَا رِجَالُ، اِذْهَبُوا إِلَى المَسْجِدِ.',['ஆண்களே, பள்ளிவாசலுக்குச் செல்லுங்கள்!','Men, go to the mosque!','පිරිමිනි, පල්ලියට යන්න!'],'m')+
        arrow('تَنْصَحُ الأُمَّهَاتُ الأَوْلَادَ.',['தாய்மார்கள் பிள்ளைகளுக்கு அறிவுரை கூறுகிறார்கள்.','The mothers advise the children.','මව්වරු දරුවන්ට උපදෙස් දෙති.'],'يَا أُمَّهَاتُ، اِنْصَحْنَ الأَوْلَادَ.',['தாய்மார்களே, பிள்ளைகளுக்கு அறிவுரை கூறுங்கள்!','Mothers, advise the children!','මව්වරුනි, දරුවන්ට උපදෙස් දෙන්න!'],'f')+
      '</div>'},
    {type:'html',title:['நீச்சல் தெரியாத நீச்சல் ஆசிரியர்','The swimming teacher who couldn\'t swim','පීනන්න බැරි පිහිනුම් ගුරුවරයා'],
     intro:['பாடநூல் பக்கம் 78-இன் சிறு கதை. கட்டளைகள் மஞ்சள் நிறத்தில்.','The short story from page 78 of the textbook. The commands are in yellow.','පෙළපොතේ 78 වන පිටුවේ කෙටි කතාව. විධාන කහ පාටින්.'],
     html:'<div class="note-box" style="align-items:center"><span class="emo" style="font-size:44px">🏞️ 🏊 🆘</span></div>'+
      '<div class="exlist">'+
        ex('وَقَفَ حَسَّانُ مَعَ أَصْحَابِهِ أَمَامَ النَّهْرِ يُعَلِّمُهُمُ السِّبَاحَةَ.',['ஹஸ்ஸான் தன் தோழர்களுடன் ஆற்றின் முன் நின்று அவர்களுக்கு நீச்சல் கற்றுக்கொடுத்துக் கொண்டிருந்தார்.','Hassan stood with his friends in front of the river, teaching them to swim.','හස්සාන් තම මිතුරන් සමඟ ගඟ ඉදිරිපිට සිට ඔවුන්ට පිහිනීම උගන්වමින් සිටියේය.'])+
        ex('قَالَ لِعُمَرَ: <mark>اُبْسُطْ</mark> كَفَّيْكَ جَيِّدًا <mark>وَاضْرِبْ</mark> بِهِمَا المَاءَ.',['உமரிடம்: உன் உள்ளங்கைகளை நன்றாக விரித்து, அவற்றால் தண்ணீரை அடி.','To Umar: Spread your palms well and strike the water with them.','උමර්ට: ඔබේ අත්ල හොඳින් විහිදා ඒවායින් වතුරට ගසන්න.'])+
        ex('قَالَ لِإِبْرَاهِيمَ: <mark>اِفْتَحْ</mark> عَيْنَيْكَ <mark>وَانْظُرْ</mark> دَاخِلَ المَاءِ.',['இப்ராஹீமிடம்: கண்களைத் திறந்து தண்ணீருக்குள் பார்.','To Ibrahim: Open your eyes and look inside the water.','ඉබ්රාහිම්ට: ඇස් ඇරලා වතුර ඇතුළේ බලන්න.'])+
        ex('قَالَ أَصْحَابُهُ: <mark>اُسْكُتْ</mark> يَا حَسَّانُ، <mark>تَعَالَ</mark> <mark>اسْبَحْ</mark> مَعَنَا <mark>وَجَرِّبِ</mark> المَاءَ.',['அவரது தோழர்கள்: பேசாமல் இரு ஹஸ்ஸான்! வா, எங்களுடன் நீந்து, தண்ணீரைச் சோதித்துப் பார்.','His friends said: Be quiet, Hassan! Come, swim with us and try the water.','ඔහුගේ මිතුරන්: නිශ්ශබ්ද වෙන්න හස්සාන්! එන්න, අපත් එක්ක පීනලා වතුර අත්හදා බලන්න.'])+
        ex('زَلَّتْ قَدَمُهُ فَسَقَطَ فِي النَّهْرِ.',['அவரது கால் வழுக்கி, ஆற்றில் விழுந்தார்.','His foot slipped and he fell into the river.','ඔහුගේ කකුල ලිස්සා ඔහු ගඟට වැටුණා.'])+
        ex('فَصَاحَ: <mark>النَّجْدَةَ</mark>! إِنِّي لَا أَعْرِفُ السِّبَاحَةَ.',['அவர் கத்தினார்: உதவி! எனக்கு நீச்சல் தெரியாது!','He shouted: Help! I can\'t swim!','ඔහු කෑගැහුවා: උදව්! මට පීනන්න බැහැ!'])+
      '</div>'+
      '<div class="note-box">'+bi('முதல் வரியில் இரண்டு வினைகள்: <span class="arw">وَقَفَ ... يُعَلِّمُ</span> = "நின்று ... கற்றுக்கொடுத்துக் கொண்டிருந்தார்". ஒரு செயலின் போது நடக்கும் இன்னொரு செயல்: இது <span class="arw">الحَال</span>, 25-ஆம் புத்தகத்தில் வரும்.',
        'The first line has two verbs: <span class="arw">وَقَفَ ... يُعَلِّمُ</span> = "stood ... teaching". One action happening during another is called <span class="arw">الحَال</span>; booklet 25 covers it.',
        'පළමු පේළියේ ක්‍රියා පද දෙකක්: <span class="arw">وَقَفَ ... يُعَلِّمُ</span> = "සිට ... උගන්වමින්". එක් ක්‍රියාවක් අතරතුර සිදු වන තවත් ක්‍රියාවක්: මෙය <span class="arw">الحَال</span>, 25 වන පොතේ එයි.')+'</div>'},
    {type:'html',title:['வில்லியம் டெல் (தொடக்கம்)','William Tell (the opening)','විලියම් ටෙල් (ආරම්භය)'],
     intro:['சுவிட்சர்லாந்தின் புகழ்பெற்ற வில்லாளியின் கதை. இங்கே அதன் தொடக்கப் பகுதி.','The story of Switzerland\'s famous archer. Here is how it begins.','ස්විට්සර්ලන්තයේ ප්‍රසිද්ධ දුනුවායාගේ කතාව. මෙහි එහි ආරම්භය.'],
     html:'<div class="note-box" style="align-items:center"><span class="emo" style="font-size:44px">⛰️ 🏹 🍎</span></div>'+
      '<div class="exlist">'+
        ex('فِي إِحْدَى قُرَى سُوِيسْرَا الجَبَلِيَّةِ <mark>كَانَ يَعِيشُ</mark> مُزَارِعٌ لَطِيفٌ.',['சுவிட்சர்லாந்தின் மலைக் கிராமம் ஒன்றில் அன்பான ஒரு விவசாயி வாழ்ந்து வந்தார்.','In one of Switzerland\'s mountain villages there lived a kind farmer.','ස්විට්සර්ලන්තයේ කඳුකර ගම්මානයක කරුණාවන්ත ගොවියෙක් ජීවත් විය.'])+
        ex('كَانَ يُحِبُّ الرِّمَايَةَ بِالقَوْسِ وَالنَّبْلِ.',['வில்லும் அம்பும் கொண்டு எய்வதை அவர் விரும்பினார்.','He loved shooting with a bow and arrows.','ඔහු දුන්නෙන් සහ ඊතලවලින් විදීමට ප්‍රිය කළේය.'])+
        ex('إِنَّهُ <mark>أَمْهَرُ</mark> رَامٍ فِي سُوِيسْرَا كُلِّهَا.',['சுவிட்சர்லாந்து முழுவதிலும் அவரே மிகத் திறமையான வில்லாளி.','He is the most skilful archer in all Switzerland.','මුළු ස්විට්සර්ලන්තයේම දක්ෂතම දුනුවායා ඔහුය.'])+
        ex('<mark>أَعْطِنِي</mark> قَوْسَكَ <mark>أُجَرِّبْهَا</mark>.',['உங்கள் வில்லைக் கொடுங்கள், நான் முயன்று பார்க்கிறேன்.','Give me your bow, so I can try it.','ඔබේ දුන්න මට දෙන්න, මම අත්හදා බලන්නම්.'])+

        M('هٰذِهِ لَا تُحَقِّقُ السَّعَادَةَ.',['இவை மகிழ்ச்சியைத் தராது.','These things don\'t bring happiness.','මේවා සතුට ගෙනෙන්නේ නැහැ.'])+
        BL('مَا الَّذِي يُحَقِّقُ السَّعَادَةَ إِذَنْ؟',['அப்படியானால் எது மகிழ்ச்சியைத் தரும்?','Then what does bring happiness?','එහෙනම් සතුට ගෙනෙන්නේ මොකක්ද?'])+
        M('إِذَا أَرَدْتَ السَّعَادَةَ فَ<mark>عَلَيْكَ بِذَاتِ الدِّينِ</mark>.',['நீ மகிழ்ச்சியை விரும்பினால், மார்க்கப் பற்றுள்ளவளைப் பற்றிக்கொள்.','If you want happiness, hold fast to the one who has religion.','ඔයාට සතුට ඕනේ නම්, දහම් ගුණ ඇති කෙනාව අල්ලගන්න.'])+
        BL('أَحْسَنْتِ يَا أُمِّي!',['நன்றாகச் சொன்னீர்கள் அம்மா!','Well said, Mother!','හොඳට කිව්වා අම්මේ!'])+
      '</div></div>'},
    {type:'html',title:['நான்கு காரணங்கள், ஒரு தேர்வு','Four reasons, one choice','හේතු හතරක්, එක් තේරීමක්'],
     intro:['பிலாலின் உரையாடல் ஒரு பிரபலமான ஹதீஸைப் பின்பற்றுகிறது: பெண் நான்கு காரணங்களுக்காகத் திருமணம் செய்யப்படுகிறாள்.','Bilal\'s dialogue follows a well-known hadith: a woman is married for four reasons.','බිලාල්ගේ සංවාදය ප්‍රසිද්ධ හදීසයක් අනුගමනය කරයි: කාන්තාවක් විවාහ කරගන්නේ හේතු හතරක් නිසා.'],
     html:'<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+
        cand('💰','لِمَالِهَا',['அவளுடைய செல்வத்துக்காக','for her wealth','ඇගේ ධනය නිසා'],'','var(--paper-2)')+
        cand('🏅','لِحَسَبِهَا',['அவளுடைய மதிப்புக்காக','for her standing','ඇගේ කීර්තිය නිසා'],'','var(--paper-2)')+
        cand('✨','لِجَمَالِهَا',['அவளுடைய அழகுக்காக','for her beauty','ඇගේ ලස්සන නිසා'],'','var(--paper-2)')+
        cand('🕌','لِدِينِهَا',['அவளுடைய மார்க்கத்துக்காக','for her religion','ඇගේ දහම නිසා'],'✅','var(--good-soft)')+
      '</div>'+
      '<div class="verse"><span class="arw" lang="ar">تُنْكَحُ المَرْأَةُ لِأَرْبَعٍ: لِمَالِهَا وَلِحَسَبِهَا وَلِجَمَالِهَا وَلِدِينِهَا، <mark>فَاظْفَرْ بِذَاتِ الدِّينِ</mark> تَرِبَتْ يَدَاكَ</span>'+
        TE('"ஒரு பெண் நான்கு காரணங்களுக்காக மணமுடிக்கப்படுகிறாள்: அவளுடைய செல்வம், மதிப்பு, அழகு, மார்க்கம். மார்க்கமுள்ளவளைப் பெற்று வெற்றியடை; (இல்லையேல்) உன் கைகள் மண்ணாகட்டும்."',
           '"A woman is married for four things: her wealth, her standing, her beauty and her religion. Win the one with religion, or may your hands be covered in dust."',
           '"කාන්තාවක් විවාහ කරගන්නේ කරුණු හතරක් නිසා: ඇගේ ධනය, කීර්තිය, ලස්සන සහ දහම. දහම් ගුණ ඇති තැනැත්තිය දිනාගන්න; නැත්නම් ඔබේ අත් දූවිලි වේවා."','div')+
        '<small>'+ONE('ஹதீஸ் (புகாரீ, முஸ்லிம்)','hadith (al-Bukhari and Muslim)','හදීසය (බුහාරි, මුස්ලිම්)')+'</small></div>'+
      '<div class="group"><h3>'+ONE('உரையாடலின் இலக்கணம்','Grammar from the dialogue','සංවාදයේ ව්‍යාකරණ')+'</h3>'+
        '<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+
          '<div class="dpanel"><span class="key arw" lang="ar" style="font-size:26px">عَلَيْكَ بِـ</span>'+TE('"...ஐப் பற்றிக்கொள்" (மாறாத சொல்)','"hold fast to..." (a word that never changes)','"...අල්ලගන්න" (වෙනස් නොවන වචනයක්)')+'<span class="arw eg" lang="ar">عَلَيْكَ بِالصَّلَوَاتِ الخَمْسِ</span>'+TE('ஐவேளைத் தொழுகையைப் பற்றிக்கொள்','keep to the five prayers','සලාත පහ අල්ලගන්න')+'</div>'+
          '<div class="dpanel"><span class="key arw" lang="ar" style="font-size:26px">ذُو / ذَاتُ</span>'+TE('"...உடையவர்" (ஆண் / பெண்) + பெயர்ச்சொல்','"having..." (m / f) + a noun','"... ඇති" (පු / ස්ත්‍රී) + නාම පදය')+'<span class="arw eg" lang="ar">ذُو مَالٍ · ذَاتُ جَمَالٍ</span>'+TE('செல்வமுடையவர் · அழகுடையவள்','a man of wealth · a woman of beauty','ධනවතා · රූමත් තැනැත්තිය')+'</div>'+
          '<div class="dpanel"><span class="key arw" lang="ar" style="font-size:26px">غَيْرُ</span>'+TE('"...அல்ல" (ஆண், பெண் இருவருக்கும்)','"not..." (for men and women alike)','"... නොවේ" (දෙපිරිසටම)')+'<span class="arw eg" lang="ar">غَيْرُ جَمِيلٍ · غَيْرُ جَمِيلَةٍ</span>'+TE('அழகற்றவன் · அழகற்றவள்','not handsome · not beautiful','කැත · කැත')+'</div>'+
        '</div>'+
        bi('கவனம்: <span class="arw">ذَاتُ</span>-க்குப் பின் பெயர்ச்சொல் (<span class="arw">جَمَالٍ</span> = அழகு), விவரிக்கும் சொல் அல்ல (<span class="arw">جَمِيلٍ</span>). "அவர் என்ன நினைக்கிறார்?" = <span class="arw">مَا رَأْيُكَ فِي ...؟</span>.',
           'Careful: after <span class="arw">ذَاتُ</span> comes a noun (<span class="arw">جَمَالٍ</span>, beauty), not a describing word (<span class="arw">جَمِيلٍ</span>). "What do you think of...?" = <span class="arw">مَا رَأْيُكَ فِي ...؟</span>.',
           'සැලකිලිමත් වන්න: <span class="arw">ذَاتُ</span> ට පසු එන්නේ නාම පදයකි (<span class="arw">جَمَالٍ</span> = ලස්සන), විශේෂණයක් නොවේ (<span class="arw">جَمِيلٍ</span>). "... ගැන ඔබ හිතන්නේ මොකද?" = <span class="arw">مَا رَأْيُكَ فِي ...؟</span>.')+
      '</div>'},
    {type:'html',title:['இருவர்: المُثَنَّى','Two of something: the dual','දෙකක්: ද්විවචනය'],
     intro:['இரண்டு என்று சொல்ல ஒருமையுடன் <b class="arw">ـَانِ</b> சேருங்கள். முன்னிடைச் சொல்லுக்குப் பின் (அல்லது செயப்படுபொருளாக) அது <b class="arw">ـَيْنِ</b> ஆகும்.','To say "two", add <b class="arw">ـَانِ</b> to the singular. After a preposition (or as an object), it becomes <b class="arw">ـَيْنِ</b>.','"දෙක" කීමට ඒකවචනයට <b class="arw">ـَانِ</b> එකතු කරන්න. පූර්ව නිපාතයකට පසු (හෝ කර්මය ලෙස) එය <b class="arw">ـَيْنِ</b> වේ.'],
     html:'<div class="dt-wrap"><table class="dt"><thead><tr><th></th><th>'+ONE('ஒன்று','one','එකක්')+'</th><th>'+ONE('இரண்டு','two','දෙකක්')+'</th><th>'+ONE('முன்னிடைக்குப் பின்','after a preposition','පූර්ව නිපාතයට පසු')+'</th></tr></thead><tbody>'+
        '<tr><td class="emo" style="font-size:24px">✏️</td><td class="a">قَلَمٌ</td><td class="a" style="color:var(--accent)">قَلَمَانِ</td><td class="a" style="color:var(--f)">قَلَمَيْنِ</td></tr>'+
        '<tr><td class="emo" style="font-size:24px">👨‍👩</td><td class="a">زَوْجٌ</td><td class="a" style="color:var(--accent)">زَوْجَانِ</td><td class="a" style="color:var(--f)">زَوْجَيْنِ</td></tr>'+
        '<tr><td class="emo" style="font-size:24px">👨‍👩‍👦</td><td class="a">وَالِدٌ</td><td class="a" style="color:var(--accent)">وَالِدَانِ</td><td class="a" style="color:var(--f)">وَالِدَيْنِ</td></tr>'+
        '<tr><td class="emo" style="font-size:24px">👭</td><td class="a">صَدِيقَةٌ</td><td class="a" style="color:var(--accent)">صَدِيقَتَانِ</td><td class="a" style="color:var(--f)">صَدِيقَتَيْنِ</td></tr>'+
      '</tbody></table></div>'+
      '<div class="callout"><h3>'+ONE('இருவர் = கணவனும் மனைவியும்!','Two = husband and wife!','දෙදෙනා = සැමියා සහ බිරිඳ!')+'</h3>'+
        bi('<span class="arw">زَوْجَانِ</span> = கணவனும் மனைவியும் (இரண்டு கணவர்கள் அல்ல). <span class="arw">وَالِدَانِ</span> = தந்தையும் தாயும் (இரண்டு தந்தையர் அல்ல). ـة உள்ள சொல்லில் ة → ت: <span class="arw">صَدِيقَتَانِ</span>.',
           '<span class="arw">زَوْجَانِ</span> = husband and wife (not two husbands). <span class="arw">وَالِدَانِ</span> = father and mother (not two fathers). With a ـة word, ة becomes ت: <span class="arw">صَدِيقَتَانِ</span>.',
           '<span class="arw">زَوْجَانِ</span> = සැමියා සහ බිරිඳ (සැමියන් දෙදෙනෙක් නොවේ). <span class="arw">وَالِدَانِ</span> = පියා සහ මව (පියවරුන් දෙදෙනෙක් නොවේ). ـة සහිත වචනයේ ة → ت: <span class="arw">صَدِيقَتَانِ</span>.')+
      '</div>'+
      ex('هَلْ تَحْدُثُ مُشْكِلَاتٌ <mark>بَيْنَ الزَّوْجَيْنِ</mark>؟',['கணவன் மனைவிக்கிடையே பிரச்சினைகள் ஏற்படுகின்றனவா? (بَيْنَ முன்னிடைச் சொல் → ـَيْنِ)','Do problems arise between husband and wife? (بَيْنَ is a preposition → ـَيْنِ)','සැමියා සහ බිරිඳ අතර ප්‍රශ්න ඇති වේද? (بَيْنَ පූර්ව නිපාතයකි → ـَيْنِ)'])+
      '<div class="verse"><span class="arw" lang="ar">﴿وَ<mark>بِالْوَالِدَيْنِ</mark> إِحْسَانًا﴾</span>'+TE('பெற்றோருக்கு நன்மை செய்யுங்கள்.','And be good to your parents.','දෙමාපියන්ට යහපත කරන්න.','div')+'<small>سورة الإسراء ١٧:٢٣</small></div>'},
    {type:'html',title:['கணவன் மனைவிக்கிடையே பிரச்சினைகள்','Problems between husband and wife','සැමියා සහ බිරිඳ අතර ප්‍රශ්න'],
     intro:['இந்த அலகின் வாசிப்பு கேட்கிறது: பிரச்சினைகள் ஏன் வருகின்றன, யார் தீர்க்க வேண்டும்?','This unit\'s reading asks: why do problems come up, and who should solve them?','මෙම ඒකකයේ කියවීම අසයි: ප්‍රශ්න ඇති වන්නේ ඇයි, විසඳිය යුත්තේ කවුද?'],
     html:'<div class="exlist">'+
        ex('<mark>قَدْ تَحْدُثُ</mark> مُشْكِلَاتٌ بَيْنَ الزَّوْجَيْنِ.',['கணவன் மனைவிக்கிடையே பிரச்சினைகள் ஏற்படலாம். (قَدْ + நிகழ்காலம் = ஒருவேளை, 19-ஆம் புத்தகம்)','Problems may arise between husband and wife. (قَدْ + present = maybe; booklet 19)','සැමියා සහ බිරිඳ අතර ප්‍රශ්න ඇති විය හැක. (قَدْ + වර්තමානය = සමහරවිට; 19 වන පොත)'])+
        ex('سُوءُ الاتِّصَالِ سَبَبٌ مِنْ أَسْبَابِ المُشْكِلَاتِ.',['மோசமான தொடர்பாடல் பிரச்சினைகளின் காரணங்களில் ஒன்று.','Poor communication is one of the causes of problems.','දුර්වල සන්නිවේදනය ප්‍රශ්නවලට එක් හේතුවකි.'])+
        ex('إِنَّمَا المُشْكِلَةُ أَنْ نَعْجِزَ عَنْ حَلِّ تِلْكَ المُشْكِلَاتِ.',['உண்மையான பிரச்சினை, அந்தப் பிரச்சினைகளைத் தீர்க்க முடியாமல் போவதுதான்.','The real problem is being unable to solve those problems.','සැබෑ ප්‍රශ්නය එම ප්‍රශ්න විසඳීමට නොහැකි වීමයි.'])+
        ex('الحِوَارُ هُوَ السَّبِيلُ إِلَى النَّجَاةِ.',['பேசித் தீர்ப்பதே தப்பிக்கும் வழி.','Talking it through is the way out.','කතා කර විසඳීම ගැලවීමේ මාර්ගයයි.'])+
      '</div>'+
      '<div class="group"><h3>'+ONE('எவ்வளவு அடிக்கடி?','How often?','කොපමණ වාරයක්ද?')+'</h3>'+
        '<div style="display:flex;flex-direction:column;gap:10px">'+bar(85,'غَالِبًا',['பெரும்பாலும்','mostly','බොහෝවිට'])+bar(50,'أَحْيَانًا',['சில நேரங்களில்','sometimes','සමහර විට'])+bar(15,'نَادِرًا',['அரிதாக','rarely','කලාතුරකින්'])+'</div>'+
      '</div>'+
      '<div class="note-box">'+bi('<span class="arw">إِذَا</span> + இறந்தகால வடிவம் = எதிர்காலப் பொருள்: <span class="arw">إِذَا ذَهَبْتُ قَابَلْتُكَ</span> = "நான் போனால் உன்னைச் சந்திப்பேன்". உங்கள் பாடநெறி "பிரச்சினைகள்" என்பதற்கு <span class="arw">مُشْكِلَات</span> பயன்படுத்துகிறது.',
        '<span class="arw">إِذَا</span> + the past form gives a future meaning: <span class="arw">إِذَا ذَهَبْتُ قَابَلْتُكَ</span> = "if I go, I will meet you". Your course uses <span class="arw">مُشْكِلَات</span> for "problems".',
        '<span class="arw">إِذَا</span> + අතීත රූපය = අනාගත අර්ථය: <span class="arw">إِذَا ذَهَبْتُ قَابَلْتُكَ</span> = "මම ගියොත් ඔබව හමුවෙනවා". ඔබේ පාඨමාලාව "ප්‍රශ්න" සඳහා <span class="arw">مُشْكِلَات</span> භාවිත කරයි.')+'</div>'},
    {type:'html',title:['குடும்பம்: அன்றும் இன்றும்','The family, then and now','පවුල: එදා සහ අද'],
     intro:['வாசிப்பு <b class="arw">الأُسْرَةُ بَيْنَ المَاضِي وَالحَاضِرِ</b> மூன்று மாற்றங்களைக் கூறுகிறது.','The reading <b class="arw">الأُسْرَةُ بَيْنَ المَاضِي وَالحَاضِرِ</b> names three changes.','<b class="arw">الأُسْرَةُ بَيْنَ المَاضِي وَالحَاضِرِ</b> කියවීම වෙනස්කම් තුනක් කියයි.'],
     html:'<div class="eqs">'+
        '<div class="eq">'+WB('👴👵👨‍👩‍👧‍👦',['பெரிய குடும்பம்','the large family','විශාල පවුල'])+'<span class="op">→</span>'+WB('👨‍👩‍👦',['சிறிய குடும்பம்','the small family','කුඩා පවුල'],'add')+'</div>'+
        '<div class="eq">'+WB('🏢 😴',['பெற்றோர் வேலையில், பிள்ளைகள் தூக்கத்தில்','parents at work, children asleep','දෙමාපියන් වැඩට, දරුවන් නින්දේ'])+'<span class="op">→</span>'+WB('💔',['உறவு பலவீனமானது','the bond grew weaker','බැඳීම දුර්වල විය'],'add')+'</div>'+

      '</div>'+
      '<div class="exlist">'+
        ex('يَخْتَلِفُ نِظَامُ الأُسْرَةِ الآنَ عَنْ نِظَامِ الأُسْرَةِ فِي المَاضِي.',['இன்றைய குடும்ப அமைப்பு அன்றைய குடும்ப அமைப்பிலிருந்து வேறுபடுகிறது.','The family system today differs from the family system of the past.','අද පවුල් ක්‍රමය අතීත පවුල් ක්‍රමයට වඩා වෙනස් ය.'])+
        ex('كَانَتِ الأُسْرَةُ الكَبِيرَةُ تَسْكُنُ فِي بَيْتٍ وَاحِدٍ كَبِيرٍ.',['பெரிய குடும்பம் ஒரே பெரிய வீட்டில் வசித்து வந்தது.','The large family used to live in one big house.','විශාල පවුල එක විශාල නිවසක ජීවත් වුණා.'])+
        ex('<mark>اخْتَفَتِ</mark> الكَبِيرَةُ وَ<mark>ظَهَرَتِ</mark> الصَّغِيرَةُ.',['பெரிய குடும்பம் மறைந்தது; சிறிய குடும்பம் தோன்றியது.','The large family vanished and the small one appeared.','විශාල පවුල අතුරුදහන් වී කුඩා පවුල මතු විය.'])+
        ex('فَ<mark>لَا</mark> يَرَوْنَ أَوْلَادَهُمْ <mark>إِلَّا</mark> قَلِيلًا.',['அவர்கள் தம் பிள்ளைகளைச் சிறிது நேரமே பார்க்கிறார்கள்.','So they see their children only a little.','ඔවුන් තම දරුවන් දකින්නේ ටිකක් පමණි.'])+
        ex('<mark>أَمَّا</mark> اليَوْمَ <mark>فَ</mark>قَدْ تُغَادِرُ البَيْتَ فِي الصَّبَاحِ وَتَرْجِعُ فِي المَسَاءِ.',['இன்றோ, அவள் காலையில் வீட்டை விட்டுச் சென்று மாலையில் திரும்பலாம்.','As for today, she may leave home in the morning and come back in the evening.','අද නම්, ඇය උදේ නිවසින් පිටත් වී සවස ආපසු එන්න පුළුවන්.'])+
        ex('وَعِنْدَمَا تَرْجِعُ تَكُونُ مُتْعَبَةً.',['அவள் திரும்பும்போது களைப்பாக இருக்கிறாள்.','When she gets back, she is tired.','ඇය ආපසු එන විට මහන්සියි.'])+
      '</div>'+
      '<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+

        '<div class="dpanel"><span class="key arw" lang="ar" style="font-size:24px">أَمَّا ... فَـ</span>'+TE('"...ஐப் பொறுத்தவரை"','"as for..., then..."','"... ගැන නම්"')+'<span class="arw eg" lang="ar">أَمَّا بَعْدُ</span></div>'+
        '<div class="dpanel"><span class="key arw" lang="ar" style="font-size:24px">اخْتَفَى ↔ ظَهَرَ</span>'+TE('மறைந்தது ↔ தோன்றியது','vanished ↔ appeared','අතුරුදහන් වුණා ↔ මතු වුණා')+'</div>'+
      '</div>'},

      '<div class="note-box">'+bi('மேலும் இரண்டு வகைகள் உள்ளன (<span class="arw">الَّذِي</span> போன்றவை, மற்றும் இன்னொரு மஃரிஃபாவுடன் சேர்ந்த சொல்); அவை பின்னர் வரும்.','There are two more kinds (words like <span class="arw">الَّذِي</span>, and a noun joined to a definite one); they come later.','තවත් වර්ග දෙකක් ඇත (<span class="arw">الَّذِي</span> වැනි, සහ නිශ්චිත නාමයකට සම්බන්ධ වචනය); ඒවා පසුව එයි.')+'</div>'},
    {type:'html',title:['குர்ஆனில் இரண்டு வகைகளும்','Both kinds in the Qur\'an','අල්-කුර්ආනයේ වර්ග දෙකම'],
     intro:['முதல் சொல்லைப் பாருங்கள்: நீலம் = பெயர்ச்சொல், பச்சை = வினைச்சொல்.','Look at the first word: blue = noun, green = verb.','පළමු වචනය බලන්න: නිල් = නාම පදය, කොළ = ක්‍රියා පදය.'],

          ex(first('لَيْلَةُ','القَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ',NOUN),['லைலதுல் கத்ர் ஆயிரம் மாதங்களை விடச் சிறந்தது. (97:3)','The Night of Decree is better than a thousand months. (97:3)','ලෙයිලතුල් කද්ර් මාස දහසකට වඩා උතුම්ය. (97:3)'])+

          ex(first('اقْرَأْ','بِاسْمِ رَبِّكَ',VERB),['உம் இறைவனின் பெயரால் ஓதுவீராக. (96:1)','Read in the name of your Lord. (96:1)','ඔබේ පරමාධිපතිගේ නාමයෙන් කියවන්න. (96:1)'])+
        '</div>'+
      '</div>'+
      '<div class="note-box">'+bi('<span class="arw">شَفَاكَ اللهُ</span> வினையுடன் தொடங்குகிறது, ஆகவே فِعْلِيَّة. துஆக்கள் இறந்தகால வடிவில் வருகின்றன: <span class="arw">بَارَكَ اللهُ لَكُمْ</span>, <span class="arw">صَلَّى اللهُ عَلَى مُحَمَّدٍ</span>.','<span class="arw">شَفَاكَ اللهُ</span> starts with a verb, so it is فِعْلِيَّة. Prayers (duʿāʾ) come in the past form: <span class="arw">بَارَكَ اللهُ لَكُمْ</span>, <span class="arw">صَلَّى اللهُ عَلَى مُحَمَّدٍ</span>.','<span class="arw">شَفَاكَ اللهُ</span> ක්‍රියා පදයකින් ආරම්භ වේ; එබැවින් فِعْلِيَّة. දුආ අතීත රූපයෙන් එයි: <span class="arw">بَارَكَ اللهُ لَكُمْ</span>, <span class="arw">صَلَّى اللهُ عَلَى مُحَمَّدٍ</span>.')+'</div>'},
    {type:'html',title:['ஒரே வகையில் பதில் சொல்லுதல்','Answering in the right kind','නිවැරදි වර්ගයෙන් පිළිතුරු දීම'],
     intro:['"உன் கருத்து என்ன?" என்ற கேள்விக்கு பெயர்ச்சொல் வாக்கியம் (ال + விவரிப்பு). "எப்போது? என்ன? எப்படி?" போன்ற கேள்விகளுக்கு வினைச்சொல் வாக்கியம்.','Answer "What do you think of...?" with a noun sentence (ال + a describing word). Answer "When? What? How?" questions with a verb sentence.','"ඔබ හිතන්නේ මොකද?" ප්‍රශ්නයට නාම වාක්‍යයක් (ال + විස්තරය). "කවදාද? මොකක්ද? කොහොමද?" ප්‍රශ්නවලට ක්‍රියා වාක්‍යයක්.'],
     html:'<h3 class="stack" style="--big:18px;--small:14px">'+A('مَا رَأْيُكَ فِي ...؟')+'</h3>'+
      '<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+
        opin('📘','الكِتَابُ مُفِيدٌ.',['புத்தகம் பயனுள்ளது.','The book is useful.','පොත ප්‍රයෝජනවත්.'])+
        opin('📖','القِصَّةُ جَمِيلَةٌ.',['கதை அழகானது.','The story is lovely.','කතාව ලස්සනයි.'])+
        opin('🧃','العَصِيرُ بَارِدٌ.',['பழச்சாறு குளிராக இருக்கிறது.','The juice is cold.','යුෂ සීතලයි.'])+
        opin('💡','الفِكْرَةُ طَيِّبَةٌ.',['யோசனை நல்லது.','The idea is good.','අදහස හොඳයි.'])+
        opin('🎮','الأَلْعَابُ خَطِيرَةٌ.',['விளையாட்டுகள் ஆபத்தானவை.','The games are dangerous.','ක්‍රීඩා භයානකයි.'])+
        opin('🌤️','الجَوُّ دَافِئٌ.',['வானிலை இதமாக இருக்கிறது.','The weather is warm.','කාලගුණය උණුසුම්.'])+
      '</div>'+
      '<div class="chat">'+
        CHAT('مَتَى تُسَافِرُ؟',['எப்போது பயணம் செய்வாய்?','When are you travelling?','ඔබ ගමන් යන්නේ කවදාද?'],'<mark>أُسَافِرُ</mark> فِي العُطْلَةِ.',['விடுமுறையில் பயணம் செய்வேன்.','I travel in the holiday.','මම නිවාඩුවේ යනවා.'])+
        CHAT('بِمَاذَا تَشْعُرِينَ؟',['உனக்கு என்ன உணர்கிறது? (பெண்ணிடம்)','How do you feel? (to a woman)','ඔබට මොනවද දැනෙන්නේ? (කාන්තාවකට)'],'<mark>أَشْعُرُ</mark> بِأَلَمٍ فِي بَطْنِي.',['என் வயிற்றில் வலி உணர்கிறேன்.','I feel a pain in my stomach.','මගේ බඩේ වේදනාවක් දැනෙනවා.'])+
        CHAT('كَيْفَ تَذْهَبُ إِلَى العَمَلِ؟',['வேலைக்கு எப்படிப் போகிறாய்?','How do you get to work?','ඔබ වැඩට යන්නේ කොහොමද?'],'<mark>أَذْهَبُ</mark> إِلَى العَمَلِ بِالسَّيَّارَةِ.',['காரில் போகிறேன்.','I go to work by car.','මම කාර් එකෙන් වැඩට යනවා.'])+
      '</div>'},
    {type:'html',title:['முழுமையில்லாத வாக்கியம்: شِبْهُ الجُمْلَةِ','A half-sentence: شِبْهُ الجُمْلَةِ','අර්ධ වාක්‍යය: شِبْهُ الجُمْلَةِ'],
     intro:['<span class="arw">فِي البَيْتِ</span> (வீட்டில்) அல்லது <span class="arw">فَوْقَ الشَّجَرَةِ</span> (மரத்தின் மேல்): வினையும் இல்லை, முழுக் கருத்தும் இல்லை. "வீட்டில்... என்ன?" இது வாக்கியமே அல்ல: "பாதி வாக்கியம்".',
            '<span class="arw">فِي البَيْتِ</span> (in the house) or <span class="arw">فَوْقَ الشَّجَرَةِ</span> (on the tree): no verb and no complete thought. "In the house... what?" It is not a sentence at all, just a "half-sentence".',
            '<span class="arw">فِي البَيْتِ</span> (නිවසේ) හෝ <span class="arw">فَوْقَ الشَّجَرَةِ</span> (ගස උඩ): ක්‍රියා පදයක් හෝ සම්පූර්ණ අදහසක් නැත. "නිවසේ... මොකක්ද?" එය වාක්‍යයක් නොවේ: "අර්ධ වාක්‍යයක්".'],
     html:'<div class="contrast">'+
        '<div class="cpanel f"><span class="emo" style="font-size:40px">🌳🧩❓</span><span class="arw" lang="ar" style="font-size:26px;line-height:1.8">فَوْقَ الشَّجَرَةِ</span>'+TE('மரத்தின் மேல்... (முழுமையில்லை)','on the tree... (incomplete)','ගස උඩ... (අසම්පූර්ණයි)')+'</div>'+
        '<div class="cpanel m"><span class="emo" style="font-size:40px">🐦🌳✅</span><span class="arw" lang="ar" style="font-size:26px;line-height:1.8">العُصْفُورُ فَوْقَ الشَّجَرَةِ</span>'+TE('குருவி மரத்தின் மேல் இருக்கிறது. (முழு வாக்கியம்)','The sparrow is on the tree. (a full sentence)','කුරුල්ලා ගස උඩ ඉන්නවා. (සම්පූර්ණ වාක්‍යයක්)')+'</div>'+
      '</div>'+
      bi('முன்னால் ஒரு பெயர்ச்சொல்லைச் சேர்த்ததும், அது முழுப் பெயர்ச்சொல் வாக்கியம் ஆகிவிட்டது.','Put a noun in front and it becomes a full noun sentence.','ඉදිරියෙන් නාම පදයක් එකතු කළ විට එය සම්පූර්ණ නාම වාක්‍යයක් බවට පත් වේ.')},
    {type:'html',title:['உரையாடல்: வீட்டுக்கு வெளியே இரவு','The dialogue: staying out late','සංවාදය: රෑ වෙනකම් ගෙදරින් පිට'],
     intro:['நாஸிர் தன் நண்பர் ஃபைஸலிடம் ஒரு கவலையைச் சொல்கிறார்.','Nasir tells his friend Faysal about a worry.','නාසිර් තම මිතුරා ෆයිසල්ට කරදරයක් කියයි.'],
     html:'<div class="chat"><div class="pair">'+
        N('<mark>أُرِيدُ أَنْ أَتْرُكَ</mark> زَوْجَتِي.',['என் மனைவியை விட்டுவிட விரும்புகிறேன்.','I want to leave my wife.','මට මගේ බිරිඳව අත්හරින්න ඕනේ.'])+
        F('إِنَّا لِلّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ! مَاذَا هُنَاكَ؟',['இன்னா லில்லாஹி வ இன்னா இலைஹி ராஜிஊன்! என்ன ஆனது?','Truly we belong to Allah and to Him we return! What\'s happened?','ඉන්නා ලිල්ලාහි ව ඉන්නා ඉලෙයිහි රාජිඌන්! මොකද වුණේ?'])+
        N('لَا أُحِبُّهَا.',['எனக்கு அவள் மீது அன்பில்லை.','I don\'t love her.','මම එයාට ආදරය කරන්නේ නැහැ.'])+
        F('لَا تُحِبُّهَا؟ كَيْفَ عِشْتَ مَعَهَا كُلَّ هٰذِهِ السَّنَوَاتِ؟',['அன்பில்லையா? இத்தனை ஆண்டுகள் அவளுடன் எப்படி வாழ்ந்தாய்?','You don\'t love her? How have you lived with her all these years?','එයාට ආදරය නැද්ද? මේ අවුරුදු ගාණක් එයා එක්ක ජීවත් වුණේ කොහොමද?'])+
        N('لَا أَدْرِي... لَا أُحِبُّهَا.',['தெரியவில்லை... எனக்கு அவள் மீது அன்பில்லை.','I don\'t know... I don\'t love her.','මම දන්නේ නැහැ... මම එයාට ආදරය කරන්නේ නැහැ.'])+
        F('<mark>كُنْتَ تَقُولُ</mark> دَائِمًا: إِنَّ زَوْجَتِي طَيِّبَةٌ وَمُؤَدَّبَةٌ وَمُطِيعَةٌ. مَاذَا حَدَثَ؟',['"என் மனைவி நல்லவள், ஒழுக்கமுள்ளவள், கீழ்ப்படிபவள்" என்று நீ எப்போதும் சொல்லி வந்தாய். என்ன நடந்தது?','You always used to say: "My wife is good, well-mannered and obedient." What happened?','ඔයා හැමදාම කිව්වා: "මගේ බිරිඳ හොඳයි, හික්මුණු කෙනෙක්, කීකරුයි." මොකද වුණේ?'])+
        N('كُنْتُ أُحِبُّهَا فِعْلًا، وَلٰكِنَّهَا تَغَيَّرَتْ كَثِيرًا.',['உண்மையில் அவளை நேசித்தேன்; ஆனால் அவள் மிகவும் மாறிவிட்டாள்.','I really did love her, but she has changed a lot.','මම ඇත්තටම එයාට ආදරය කළා, ඒත් එයා ගොඩක් වෙනස් වුණා.'])+
        F('كَيْفَ تَغَيَّرَتْ؟',['எப்படி மாறினாள்?','How has she changed?','එයා වෙනස් වුණේ කොහොමද?'])+
        N('أَصْبَحَتْ مُهْمِلَةً، لَا تَهْتَمُّ بِي وَلَا بِالبَيْتِ؛ تَهْتَمُّ بِنَفْسِهَا وَبِصَدِيقَاتِهَا فَقَطْ.',['அவள் அக்கறையற்றவளாகிவிட்டாள்; என்னையும் வீட்டையும் கவனிப்பதில்லை; தன்னையும் தோழிகளையும் மட்டுமே கவனிக்கிறாள்.','She has become careless: she doesn\'t look after me or the house; she only cares about herself and her friends.','එයා නොසලකන කෙනෙක් වෙලා; මාව වත් ගෙදර වත් ගණන් ගන්නේ නැහැ; එයා බලන්නේ තමන්වයි යෙහෙළියන්වයි විතරයි.'])+
        F('هَلْ تَكَلَّمْتَ مَعَهَا فِي هٰذَا الأَمْرِ؟',['இதைப் பற்றி அவளுடன் பேசினாயா?','Have you talked to her about this?','ඔයා මේ ගැන එයා එක්ක කතා කළාද?'])+
        N('تَكَلَّمْتُ مَعَهَا كَثِيرًا، وَلٰكِنَّهَا عَنِيدَةٌ.',['நிறையப் பேசினேன்; ஆனால் அவள் பிடிவாதக்காரி.','I\'ve talked to her a lot, but she\'s stubborn.','මම එයා එක්ක ගොඩක් කතා කළා, ඒත් එයා මුරණ්ඩුයි.'])+
        F('هَلْ تَغَيَّرْتَ <mark>أَنْتَ</mark>؟',['நீ மாறினாயா?','Have you changed?','ඔයා වෙනස් වුණාද?'])+
        N('نَعَمْ، أَصْبَحْتُ أَسْهَرُ كَثِيرًا خَارِجَ البَيْتِ.',['ஆம், இரவில் அடிக்கடி வீட்டுக்கு வெளியே தாமதமாக இருக்கத் தொடங்கினேன்.','Yes, I\'ve started staying out late a lot.','ඔව්, මම ගොඩක් රෑ වෙනකම් ගෙදරින් එළියේ ඉන්න පටන් ගත්තා.'])+
        F('<mark>قَدْ يَكُونُ</mark> هٰذَا هُوَ السَّبَبُ. <mark>لَا تَسْهَرْ</mark> خَارِجَ البَيْتِ، سَتَهْتَمُّ زَوْجَتُكَ بِكَ وَبِبَيْتِكَ.',['ஒருவேளை இதுவே காரணமாக இருக்கலாம். வீட்டுக்கு வெளியே இரவில் தங்காதே; உன் மனைவி உன்னையும் வீட்டையும் கவனிப்பாள்.','This may be the reason. Don\'t stay out late; your wife will look after you and your home.','මෙය හේතුව විය හැක. රෑ වෙනකම් ගෙදරින් එළියේ ඉන්න එපා; ඔයාගේ බිරිඳ ඔයාවයි ගෙදරයි බලාගනීවි.'])+

           '1. කතා කරන්නාට "දෙදෙනා" රූපයක් නැත: දෙදෙනෙක් හෝ බොහෝ දෙනෙක් වුවත් <span class="arw">نَحْنُ</span>. 2. කතා කරන්නාට ලිංගයක් නැත: <span class="arw">أَنَا</span>, <span class="arw">نَحْنُ</span> දෙපිරිසටම. 3. "දෙදෙනා" රූප (<span class="arw">أَنْتُمَا، هُمَا</span>) පිරිමි සහ ගැහැණු දෙපිරිසටම එකමයි. එබැවින් 2 + 5 + 5 = 12.')+
      '</div>'},

    {type:'html',title:['சரியான பிரதிப்பெயரைக் கண்டுபிடிக்கும் தடயங்கள்','Clues that point to the right pronoun','නිවැරදි සර්වනාමය පෙන්වන ඉඟි'],
     intro:['பாடநூல் பயிற்சி: காலியிடத்தில் பிரதிப்பெயர் வேண்டும். வாக்கியத்தின் மற்ற சொற்கள் தடயம் தருகின்றன: ـة (பெண்), ـُونَ (பலர்), ـَانِ (இருவர்), வினையின் முதல் எழுத்து.',
            'The textbook drill: a pronoun is missing. The rest of the sentence gives the clue: ـة (female), ـُونَ (many), ـَانِ (two), or the verb\'s first letter.',
            'පෙළපොතේ අභ්‍යාසය: සර්වනාමයක් අඩුයි. වාක්‍යයේ අනෙක් වචන ඉඟිය දෙයි: ـة (ස්ත්‍රී), ـُونَ (බොහෝ), ـَانِ (දෙදෙනා), හෝ ක්‍රියා පදයේ මුල් අකුර.'],
     html:'<div class="exlist">'+
        clue(B+' مُسَافِرٌ إِلَى بَلَدِهِ.','هُوَ',['ـة இல்லை, ஒருவர் → ஆண். (أَنَا, أَنْتَ-உம் பொருந்தும்)','no ـة, one person → male. (أَنَا and أَنْتَ also fit)','ـة නැත, එක් අයෙක් → පුරුෂ. (أَنَا, أَنْتَ ද ගැළපේ)'])+
        clue(B+' مَرِيضَةٌ، فَاذْهَبِي إِلَى المُسْتَشْفَى.','أَنْتِ',['ـة + اذْهَبِي (பெண்ணுக்குக் கட்டளை) → أَنْتِ.','ـة + اذْهَبِي (a command to a woman) → أَنْتِ.','ـة + اذْهَبِي (කාන්තාවකට විධානය) → أَنْتِ.'])+
        clue(B+' مُدَرِّسُونَ، تَذْهَبُونَ إِلَى المَدْرَسَةِ.','أَنْتُمْ',['تَـ ... ـُونَ = "நீங்கள் (ஆண்கள்)".','تَـ ... ـُونَ = "you (men)".','تَـ ... ـُونَ = "ඔබලා (පු)".'])+
        clue(B+' تُسَاعِدَانِ زَوْجَيْكُمَا.','أَنْتُمَا',['ـكُمَا = "உங்கள் இருவரின்".','ـكُمَا = "your (two)".','ـكُمَا = "ඔබ දෙදෙනාගේ".'])+
        clue(B+' تَدْرُسْنَ فِي هٰذِهِ المَدْرَسَةِ.','أَنْتُنَّ',['تَـ ... ـْنَ = "நீங்கள் (பெண்கள்)". هُنَّ என்றால் يَدْرُسْنَ.','تَـ ... ـْنَ = "you (women)". With هُنَّ it would be يَدْرُسْنَ.','تَـ ... ـْنَ = "ඔබලා (ස්ත්‍රී)". هُنَّ නම් يَدْرُسْنَ.'])+
        clue(B+' نَفْحَصُ المَرْضَى.','نَحْنُ',['نَـ = நாங்கள் (أَنَيْتُ).','نَـ = we (أَنَيْتُ).','نَـ = අපි (أَنَيْتُ).'])+
      '</div>'+
      '<div class="callout"><h3>'+ONE('எத்தனை பிரதிப்பெயர்கள் பொருந்தும்?','How many pronouns fit?','සර්වනාම කීයක් ගැළපේද?')+'</h3>'+
        '<div class="eqs">'+
          '<div class="eq">'+WB(B+' طُلَّابٌ',['மாணவர்கள்','students','ශිෂ්‍යයෝ'])+'<span class="op">→</span>'+WB('نَحْنُ · أَنْتُمْ · هُمْ',['மூன்று','three','තුනක්'],'m')+'</div>'+
          '<div class="eq">'+WB(B+' طَبِيبَاتٌ',['மருத்துவர்கள் (பெண்)','women doctors','වෛද්‍යවරියන්'])+'<span class="op">→</span>'+WB('نَحْنُ · أَنْتُنَّ · هُنَّ',['மூன்று','three','තුනක්'],'f')+'</div>'+
          '<div class="eq">'+WB(B+' مُوَظَّفَانِ',['ஊழியர்கள் இருவர்','two employees','සේවකයන් දෙදෙනා'])+'<span class="op">→</span>'+WB('أَنْتُمَا · هُمَا',['இரண்டு','two','දෙකක්'],'add')+'</div>'+
        '</div>'+
        bi('"இருவர்" இடத்துக்கு எப்போதும் இரண்டு மட்டுமே (أَنْتُمَا, هُمَا), ஏனெனில் "நாங்கள் இருவர்" வடிவம் இல்லை.','A "two" slot only ever takes two (أَنْتُمَا, هُمَا), because there is no "we two" form.','"දෙදෙනා" තැනට සැමවිටම දෙකක් පමණි (أَنْتُمَا, هُمَا), මොකද "අපි දෙදෙනා" රූපයක් නැත.')+
      '</div>'},

    {type:'html',title:['நிறுத்தக்குறிகள்','The punctuation marks','විරාම ලකුණු'],
     intro:['<b class="arw">عَلَامَاتُ التَّرْقِيمِ</b>. கவனம்: அரபுக் காற்புள்ளி (،), அரைப்புள்ளி (؛), கேள்விக்குறி (؟) நம்முடையதற்குத் திரும்பி இருக்கின்றன (முதல் புத்தகம்).',
            '<b class="arw">عَلَامَاتُ التَّرْقِيمِ</b>. Note: the Arabic comma (،), semicolon (؛) and question mark (؟) are turned round compared with ours (booklet 1).',
            '<b class="arw">عَلَامَاتُ التَّرْقِيمِ</b>. බලන්න: අරාබි කොමාව (،), අර්ධ විරාමය (؛) සහ ප්‍රශ්නාර්ථ ලකුණ (؟) අපේ ඒවාට හැරී ඇත (1 වන පොත).'],
     html:'<div class="duo" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+
        mark('،','الفَاصِلَة',['காற்புள்ளி','comma','කොමාව'],'شَرِبَ الرَّجُلُ، وَحَمِدَ رَبَّهُ.',['அந்த மனிதர் குடித்தார், தன் இறைவனைப் புகழ்ந்தார்.','The man drank, and praised his Lord.','මිනිසා බිව්වා, තම පරමාධිපතිට ප්‍රශංසා කළා.'])+
        mark('.','النُّقْطَة',['முற்றுப்புள்ளி','full stop','නැවතුම් තිත'],'المُسْلِمُ أَخُو المُسْلِمِ.',['முஸ்லிம் முஸ்லிமின் சகோதரர்.','A Muslim is a Muslim\'s brother.','මුස්ලිම්වරයා මුස්ලිම්වරයාගේ සහෝදරයාය.'])+
        mark(':','النُّقْطَتَانِ',['முக்காற்புள்ளி: قَالَ-க்குப் பின்','colon: after قَالَ','කෝලනය: قَالَ ට පසු'],'قَالَ رَسُولُ اللهِ ﷺ: «...»',['அல்லாஹ்வின் தூதர் ﷺ கூறினார்கள்: «...»','The Messenger of Allah ﷺ said: «...»','අල්ලාහ්ගේ දූතයාණෝ ﷺ පැවසූහ: «...»'])+
        mark('؛','الفَاصِلَةُ المَنْقُوطَةُ',['அரைப்புள்ளி: காரணத்துக்கு முன்','semicolon: before a reason','අර්ධ විරාමය: හේතුවකට පෙර'],'سَافَرَ إِلَى المَدِينَةِ؛ لِيَدْرُسَ فِي الجَامِعَةِ.',['பல்கலைக்கழகத்தில் படிப்பதற்காக மதீனாவுக்குப் பயணம் செய்தார்.','He travelled to Madinah; to study at the university.','ඔහු මදීනාවට ගියා; විශ්වවිද්‍යාලයේ ඉගෙන ගැනීමට.'])+

(function(){

function bar(n,lab,t){return '<div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center"><span class="arw" lang="ar" style="font-size:20px;font-weight:600;text-align:right">'+lab+'</span><div><div style="height:14px;border-radius:7px;background:var(--accent);min-width:6px;width:'+n+'%"></div>'+ONE(t[0],t[1],t[2])+'</div></div>';}

function chips(list,bad){return '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">'+list.map(function(c){return ch(c,bad);}).join('')+'</div>';}

}

        MO('يَا أَبَا عَمْرٍو، مَا رَأْيُكَ، نَتْرُكُ القَرْيَةَ وَنَسْكُنُ فِي العَاصِمَةِ؟',['அபூ அம்ரே, என்ன நினைக்கிறீர்கள்? கிராமத்தை விட்டுவிட்டுத் தலைநகரத்தில் குடியிருப்போமா?','Abu ʿAmr, what do you think: shall we leave the village and live in the capital?','අබූ අම්ර්, ඔයා මොකද හිතන්නේ? අපි ගම අතහැරලා අගනුවර පදිංචි වෙමුද?'])+
        FA('لَنَا بَيْتٌ فِي القَرْيَةِ، وَلَيْسَ لَنَا بَيْتٌ فِي العَاصِمَةِ. لِمَاذَا نَتْرُكُ بَيْتَنَا، وَ<mark>نَرْحَلُ إِلَى</mark> هُنَاكَ؟!',['நமக்குக் கிராமத்தில் வீடு இருக்கிறது; தலைநகரத்தில் வீடு இல்லை. ஏன் நம் வீட்டை விட்டு அங்கே போக வேண்டும்?!','We have a house in the village, and no house in the capital. Why should we leave our house and move there?!','අපට ගමේ ගෙයක් තියෙනවා; අගනුවර ගෙයක් නැහැ. ඇයි අපි අපේ ගෙදර දාලා එහෙට යන්නේ?!'])+
        MO('أَوْلَادُنَا يَعِيشُونَ فِي العَاصِمَةِ. حُسَيْنٌ يَدْرُسُ فِي الجَامِعَةِ، وَمُحْسِنَةُ تَدْرُسُ فِي كُلِّيَّةِ المُعَلِّمَاتِ، وَحَسَّانُ يَعْمَلُ فِي شَرِكَةٍ هُنَاكَ.',['நம் பிள்ளைகள் தலைநகரத்தில் வாழ்கிறார்கள். ஹுஸைன் பல்கலைக்கழகத்தில் படிக்கிறான், முஹ்ஸினா ஆசிரியைகள் கல்லூரியில் படிக்கிறாள், ஹஸ்ஸான் அங்கே ஒரு நிறுவனத்தில் வேலை செய்கிறான்.','Our children live in the capital. Ḥusayn studies at the university, Muḥsinah studies at the teachers\' college, and Ḥassān works at a company there.','අපේ දරුවෝ ජීවත් වෙන්නේ අගනුවර. හුසෙයින් විශ්වවිද්‍යාලයේ ඉගෙන ගන්නවා, මුහ්සිනා ගුරු විද්‍යාලයේ ඉගෙන ගන්නවා, හස්සාන් එහෙ සමාගමක වැඩ කරනවා.'])+
        FA('هَلْ نَتْرُكُ مَزْرَعَتَنَا يَا أُمَّ عَمْرٍو؟! سَيَمُوتُ الزَّرْعُ وَالشَّجَرُ.',['உம்மு அம்ரே, நம் பண்ணையை விட்டுவிடுவதா?! பயிர்களும் மரங்களும் செத்துப்போகும்.','Shall we leave our farm, Umm ʿAmr?! The crops and the trees will die.','උම්මු අම්ර්, අපේ ගොවිපොළ දාලා යනවද?! බෝග සහ ගස් මැරිලා යයි.'])+
        MO('أَنَا <mark>خَائِفَةٌ عَلَى</mark> أَوْلَادِي. الحَوَادِثُ كَثِيرَةٌ فِي العَاصِمَةِ.',['என் பிள்ளைகளைப் பற்றி எனக்குப் பயமாக இருக்கிறது. தலைநகரத்தில் விபத்துகள் அதிகம்.','I am afraid for my children. There are many accidents in the capital.','මට මගේ දරුවන් ගැන බයයි. අගනුවර අනතුරු ගොඩක් වෙනවා.'])+
        FA('أَنَا لَا أُحِبُّ العَاصِمَةَ. أَنَا أُحِبُّ بَيْتِي وَمَزْرَعَتِي.',['எனக்குத் தலைநகரம் பிடிக்காது. எனக்கு என் வீடும் பண்ணையும்தான் பிடிக்கும்.','I do not like the capital. I love my house and my farm.','මම අගනුවරට කැමති නැහැ. මම කැමති මගේ ගෙදරට සහ ගොවිපොළට.'])+
        MO('أَنَا لَا أُحِبُّ العَاصِمَةَ <mark>أَيْضًا</mark>، فَهُنَاكَ التَّلَوُّثُ، وَالضَّوْضَاءُ، وَالاِزْدِحَامُ.',['எனக்கும் தலைநகரம் பிடிக்காது; அங்கே மாசு, இரைச்சல், நெரிசல் எல்லாம் இருக்கின்றன.','I do not like the capital either: there is pollution, noise and crowding there.','මමත් අගනුවරට කැමති නැහැ; එහෙ දූෂණය, ඝෝෂාව, තදබදය තියෙනවා.'])+
        FA('وَفِي القَرْيَةِ الأَهْلُ وَالجِيرَانُ.',['கிராமத்தில் உறவினர்களும் அயலவர்களும் இருக்கிறார்கள்.','And in the village there are our relatives and neighbours.','ගමේ ඥාතීන් සහ අසල්වැසියන් ඉන්නවා.'])+
        MO('هٰذَا حَقٌّ، وَلٰكِنَّكَ مَرِيضٌ، وَأَنَا مَرِيضَةٌ أَيْضًا. نَحْنُ <mark>نَحْتَاجُ إِلَى</mark> أَوْلَادِنَا.',['அது உண்மைதான். ஆனால் நீங்கள் நோயாளி, நானும் நோயாளி. நமக்கு நம் பிள்ளைகள் தேவை.','That is true, but you are ill, and I am ill too. We need our children.','ඒක ඇත්ත. නමුත් ඔයා ලෙඩයි, මමත් ලෙඩයි. අපට අපේ දරුවන් ඕනෑ.'])+
        FA('وَهُمْ يَحْتَاجُونَ إِلَيْنَا أَيْضًا.',['அவர்களுக்கும் நாம் தேவை.','And they need us too.','ඔවුන්ටත් අපව ඕනෑ.'])+
        MO('نَبِيعُ البَيْتَ وَالمَزْرَعَةَ، وَنَشْتَرِي بَيْتًا فِي العَاصِمَةِ.',['வீட்டையும் பண்ணையையும் விற்றுவிட்டுத் தலைநகரத்தில் ஒரு வீடு வாங்குவோம்.','Let us sell the house and the farm, and buy a house in the capital.','ගෙදරයි ගොවිපොළයි විකුණලා අගනුවරින් ගෙයක් ගනිමු.'])+
        FA('سَ<mark>أَطْلُبُ مِنَ</mark> الأَوْلَادِ <mark>أَنْ يَشْتَرُوا</mark> لَنَا بَيْتًا هُنَاكَ.',['அங்கே நமக்கு ஒரு வீடு வாங்கும்படி பிள்ளைகளிடம் கேட்பேன்.','I will ask the children to buy us a house there.','එහෙ අපට ගෙයක් ගන්න කියලා මම දරුවන්ගෙන් ඉල්ලන්නම්.'])+
        MO('جَزَاكَ اللّٰهُ خَيْرًا يَا أَبَا عَمْرٍو.',['அல்லாஹ் உங்களுக்கு நற்கூலி தருவானாக, அபூ அம்ரே.','May Allah reward you with good, Abu ʿAmr.','අල්ලාහ් ඔබට යහපත ප්‍රදානය කරත්වා, අබූ අම්ර්.'])+
      '</div>'+
      '<div class="callout"><h3>'+TE('உரையாடல் எப்படித் திரும்புகிறது','How the argument turns','තර්කය හැරෙන්නේ කොහොමද')+'</h3>'+
        bi('இருவருக்குமே தலைநகரம் பிடிக்காது. முடிவைத் தீர்மானிப்பது விருப்பம் அல்ல, தேவை: இருவரும் நோயாளிகள், பிள்ளைகள் அங்கே இருக்கிறார்கள். கடைசி வரிகளில் அப்பா விட்டுக்கொடுக்கிறார்.','Neither of them likes the capital. What decides it is need, not liking: they are both ill, and the children are there. In the last lines the father gives way.','දෙදෙනාම අගනුවරට කැමති නැහැ. තීරණය කරන්නේ කැමැත්ත නොවේ, අවශ්‍යතාවයයි: දෙදෙනාම ලෙඩයි, දරුවෝ එහෙ ඉන්නවා. අන්තිම පේළිවලදී තාත්තා එකඟ වෙනවා.')+
      '</div>'+
      '<div class="note-box">'+bi('கவனம்: "எனக்குத் தலைநகரம் பிடிக்காது, எனக்கு என் பண்ணை பிடிக்கும்" என்பது அப்பா. "எனக்கும் பிடிக்காது…" என்பது அம்மா; <span class="arw">أَيْضًا</span> (= "-உம்") தான் தடயம். தேர்வில் "யார் சொன்னார்?" என்று கேட்கலாம்.','Watch out: "I do not like the capital, I love my farm" is the father. "I do not like it either…" is the mother; <span class="arw">أَيْضًا</span> ("too, either") is the clue. The exam may ask "who said it?"','ප්‍රවේශම් වන්න: "මම අගනුවරට කැමති නැහැ, මම කැමති මගේ ගොවිපොළට" කියන්නේ තාත්තා. "මමත් කැමති නැහැ…" කියන්නේ අම්මා; <span class="arw">أَيْضًا</span> (= "-ත්") තමයි ඉඟිය. විභාගයේ "කවුද කීවේ?" කියා ඇසිය හැක.')+'</div>'},

    /* 3 — small words */
    {type:'html',title:['சிறிய சொல், பெரிய மாற்றம்','Small words, big difference','කුඩා වචනය, ලොකු වෙනස'],
     intro:['உரையாடலில் இருந்து நான்கு இலக்கணக் குறிப்புகள். தேர்வில் வருவது இவைதான்.','Four grammar points from the dialogue. These are what get tested.','සංවාදයෙන් ව්‍යාකරණ කරුණු හතරක්. විභාගයට එන්නේ මේවායි.'],
     html:'<div class="contrast">'+
        cp('f','🫂','خَائِفَةٌ عَلَى',['ஒருவரைப் பற்றிய பயம் (அவருக்கு ஏதாவது நடக்குமோ)','afraid for someone (that something will happen to them)','කෙනෙකු ගැන බය (ඔහුට යමක් වේදෝ කියා)'],'خَائِفَةٌ عَلَى أَوْلَادِي',['என் பிள்ளைகளைப் பற்றிப் பயம்','afraid for my children','මගේ දරුවන් ගැන බයයි'])+
        cp('m','🐕','خَائِفٌ مِنْ',['ஒன்றைக் கண்டு பயம் (அது எனக்கு ஏதாவது செய்யுமோ)','afraid of something (that it will do something to me)','යමකට බය (එය මට යමක් කරයිද කියා)'],'خَائِفٌ مِنَ الكَلْبِ',['நாயைக் கண்டு பயம்','afraid of the dog','බල්ලාට බයයි'])+
      '</div>'+
      '<div class="note-box">'+bi('தமிழிலும் இதேபோல் சிறிய சொல் மாறுகிறது: பிள்ளைகளைப் <b>பற்றிப்</b> பயம் / நாயைக் <b>கண்டு</b> பயம்.','English changes the little word too: afraid <b>for</b> / afraid <b>of</b>. So do Tamil (பற்றி / கண்டு) and Sinhala (ගැන / -ට).','සිංහලයේද කුඩා වචනය මෙසේම වෙනස් වේ: දරුවන් <b>ගැන</b> බය / බල්ලා<b>ට</b> බය.')+'</div>'+
      '<div class="exlist">'+
        ex('نَحْنُ <mark>نَحْتَاجُ إِلَى</mark> أَوْلَادِنَا · وَهُمْ <mark>يَحْتَاجُونَ إِلَيْنَا</mark>',['"தேவை" என்ற வினை எப்போதும் <span class="arw">إِلَى</span> உடன் வரும்: யாரும் எங்கும் போகாவிட்டாலும் கூட.','"Need" always takes <span class="arw">إِلَى</span>, even though nobody is going anywhere.','"අවශ්‍යයි" යන ක්‍රියාව සැමවිටම <span class="arw">إِلَى</span> සමඟ එයි, කිසිවෙක් කොහේවත් නොගියත්.'])+
        ex('<mark>سَأَطْلُبُ مِنَ</mark> الأَوْلَادِ',['ஒருவரிடம் கேட்பது: <span class="arw">طَلَبَ مِنْ</span> (பிள்ளைகளி<b>டம்</b>).','To ask something of someone: <span class="arw">طَلَبَ مِنْ</span>.','කෙනෙකුගෙන් ඉල්ලීම: <span class="arw">طَلَبَ مِنْ</span> (දරුවන්<b>ගෙන්</b>).'])+
        ex('لِمَاذَا <mark>نَرْحَلُ إِلَى</mark> هُنَاكَ؟',['இடம் விட்டுப் போவது: <span class="arw">رَحَلَ إِلَى</span>, போய்ச் சேரும் இடத்துடன்.','To move away: <span class="arw">رَحَلَ إِلَى</span>, with the place you go to.','ඉවත්ව යාම: <span class="arw">رَحَلَ إِلَى</span>, යන ස්ථානය සමඟ.'])+
      '</div>'+
      '<div class="eq">'+WB('يَشْتَرُونَ',['அவர்கள் வாங்குகிறார்கள்','they buy','ඔවුන් මිලදී ගනී'])+'<span class="op">→</span>'+WB('أَنْ يَشْتَرُوا',['அவர்கள் வாங்குவதற்கு','that they buy','ඔවුන් මිලදී ගැනීමට'],'add')+'</div>'+
      '<div class="note-box">'+bi('<span class="arw">أَنْ</span> வந்தால் கடைசி <span class="arw">نَ</span> விழுகிறது; <span class="arw">و</span>-க்குப் பின் ஒலிக்காத <span class="arw">ا</span> ஒன்று எழுதப்படுகிறது.','After <span class="arw">أَنْ</span> the final <span class="arw">نَ</span> drops, and a silent <span class="arw">ا</span> is written after the <span class="arw">و</span>.','<span class="arw">أَنْ</span> ආවොත් අවසාන <span class="arw">نَ</span> වැටේ; <span class="arw">و</span> ට පසු නිහඬ <span class="arw">ا</span> එකක් ලියනු ලැබේ.')+'</div>'+
      '<div class="duo">'+

      '</div>'},

    /* 4 — the د ر س family */
    {type:'html',title:['ஒரு வேர், பல சொற்கள்','One root, many words','එක මූලයක්, වචන රැසක්'],
     intro:['பயிற்சி 3: ஒரே மூன்று எழுத்துகளிலிருந்து ஆறு சொற்கள். ஒவ்வொரு வாக்கியத்துக்கும் எது பொருந்தும் என்று பாருங்கள்.','Drill 3: six words from the same three letters. See which one fits each sentence.','අභ්‍යාසය 3: එකම අකුරු තුනෙන් වචන හයක්. එක් එක් වාක්‍යයට ගැළපෙන්නේ කුමක්දැයි බලන්න.'],
     html:'<div class="eq"><span class="chip" style="min-width:120px"><span class="arw" lang="ar" style="font-size:36px">د ر س</span><small>'+ONE('வேர் எழுத்துகள்','root letters','මූල අකුරු')+'</small></span></div>'+
      '<div class="eq">'+
        WB('مَدْرَسَة',['பாடசாலை (இடம்)','school (the place)','පාසල (ස්ථානය)'],'','🏫')+
        WB('دِرَاسَة',['படிப்பு','studying','ඉගෙනීම'],'','📖')+
        WB('يَدْرُسُ',['படிக்கிறான்','he studies','ඔහු ඉගෙන ගනී'],'','🧑‍🎓')+
        WB('يُدَرِّسُ',['படிப்பிக்கிறான்','he teaches','ඔහු උගන්වයි'],'add','🧑‍🏫')+
        WB('مُدَرِّس',['ஆசிரியர்','teacher (m)','ගුරුවරයා'],'m','👨‍🏫')+
        WB('مُدَرِّسَة',['ஆசிரியை','teacher (f)','ගුරුවරිය'],'f','👩‍🏫')+
      '</div>'+
      '<div class="callout"><h3>'+TE('நடு எழுத்தை இரட்டித்தால்: "மற்றவரைச் செய்ய வை"','Double the middle letter: "make someone do it"','මැද අකුර දෙගුණ කළොත්: "කෙනෙකු ලවා කරවන්න"')+'</h3>'+
        '<div class="eq">'+WB('دَرَسَ',['படித்தான்','he studied','ඔහු ඉගෙන ගත්තා'])+'<span class="op">→</span>'+WB('دَرَّسَ',['படிப்பித்தான்','he taught','ඔහු ඉගැන්නුවා'],'add')+'</div>'+
        bi('நடு எழுத்தில் ஷத்தா (<span class="arw">ـّـ</span>) வந்தால் "படி" → "படிக்க வை". தமிழிலும் இதே யோசனை, ஒரு விகுதியுடன்: படி → படிப்பி.','A shadda (<span class="arw">ـّـ</span>) on the middle letter turns "study" into "make someone study", that is, teach. Tamil does the same with an ending (படி → படிப்பி), and so does Sinhala (ඉගෙන ගන්නවා → උගන්වනවා).','මැද අකුරේ ෂද්දා (<span class="arw">ـّـ</span>) ආවොත් "ඉගෙන ගන්නවා" → "ඉගැන්වීම" වේ. සිංහලයේද මේ අදහසමයි: ඉගෙන ගන්නවා → උගන්වනවා.')+
      '</div>'+
      '<div class="exlist">'+
        ex('كَمْ تِلْمِيذًا فِي هٰذِهِ <mark>المَدْرَسَةِ</mark>؟',['இந்தப் பாடசாலையில் எத்தனை மாணவர்கள்?','How many pupils are in this school?','මේ පාසලේ සිසුන් කී දෙනෙක් ඉන්නවාද?'])+
        ex('أُفَضِّلُ <mark>دِرَاسَةَ</mark> الطِّبِّ.',['நான் மருத்துவப் படிப்பை விரும்புகிறேன்.','I prefer studying medicine.','මම වෛද්‍ය විද්‍යාව හැදෑරීමට කැමතියි.'])+
        ex('أَيْنَ <mark>يَدْرُسُ</mark> أَخُوكَ؟',['உன் சகோதரன் எங்கே படிக்கிறான்?','Where does your brother study?','ඔයාගේ සහෝදරයා ඉගෙන ගන්නේ කොහේද?'])+
        ex('أُخْتِي <mark>مُدَرِّسَةٌ</mark> فِي كُلِّيَّةِ المُعَلِّمَاتِ.',['என் சகோதரி ஆசிரியைகள் கல்லூரியில் ஆசிரியை.','My sister is a teacher at the teachers\' college.','මගේ සහෝදරිය ගුරු විද්‍යාලයේ ගුරුවරියකි.'])+
        ex('مَاذَا <mark>يُدَرِّسُ</mark> هٰذَا المُعَلِّمُ؟',['இந்த ஆசிரியர் என்ன பாடம் படிப்பிக்கிறார்?','What does this teacher teach?','මේ ගුරුවරයා උගන්වන්නේ මොනවාද?'])+
        ex('وَالِدِي <mark>مُدَرِّسٌ</mark> فِي الجَامِعَةِ.',['என் தந்தை பல்கலைக்கழகத்தில் ஆசிரியர்.','My father is a teacher at the university.','මගේ පියා විශ්වවිද්‍යාලයේ ගුරුවරයෙකි.'])+
      '</div>'},

    /* 5 — joining words */
    {type:'html',title:['இணைக்கும் சொற்கள்','Joining words','සම්බන්ධ කරන වචන'],
     intro:['பாடம் 17: <span class="arw">حُرُوفُ العَطْف</span>. ஒவ்வொன்றும் நேரத்தைப் பற்றி வேறு கதை சொல்கிறது: வரிசை உண்டா? இடைவெளி உண்டா?','Lesson 17: <span class="arw">حُرُوفُ العَطْف</span>. Each one tells a different story about time: is there an order? Is there a gap?','17 වන පාඩම: <span class="arw">حُرُوفُ العَطْف</span>. එක් එක් වචනය කාලය ගැන වෙනස් කතාවක් කියයි: පිළිවෙළක් තිබේද? පරතරයක් තිබේද?'],
     html:'<div class="exlist">'+
        conj('وَ','🔵 ➕ 🟢',['வரிசை இல்லை: "-உம்"','no order: "and"','පිළිවෙළක් නැත: "සහ"'],[
          ['فِي المُدُنِ الكَبِيرَةِ التَّلَوُّثُ <mark>وَ</mark>الجَرِيمَةُ <mark>وَ</mark>الاِزْدِحَامُ.',['பெரிய நகரங்களில் மாசும் குற்றமும் நெரிசலும் உண்டு.','In big cities there is pollution, crime and crowding.','විශාල නගරවල දූෂණය, අපරාධ සහ තදබදය ඇත.']]])+
        conj('فَـ','🔵 ⚡ 🟢',['வரிசையாக, உடனே','in order, at once','පිළිවෙළින්, වහාම'],[
          ['أَدْرَكَتْ بَعْضُ الدُّوَلِ المُشْكِلَةَ، <mark>فَ</mark>بَنَتِ المَصَانِعَ فِي الرِّيفِ.',['சில நாடுகள் பிரச்சினையைப் புரிந்துகொண்டன; உடனே கிராமப்புறங்களில் தொழிற்சாலைகள் கட்டின.','Some countries understood the problem, and so built factories in the countryside.','සමහර රටවල් ගැටලුව තේරුම් ගත්තා; එවිට ගම්බද ප්‍රදේශවල කම්හල් ඉදි කළා.']]])+
        conj('ثُمَّ','🔵 ⏳ 🟢',['வரிசையாக, இடைவெளிக்குப் பின்','in order, after a gap','පිළිවෙළින්, පරතරයකට පසු'],[
          ['أُغْمِيَ عَلَيَّ <mark>ثُمَّ</mark> أَفَقْتُ بَعْدَ سَاعَةٍ.',['நான் மயங்கினேன்; ஒரு மணி நேரம் கழித்துக் கண் விழித்தேன்.','I fainted, then came round an hour later.','මම සිහිසුන් වුණා; පැයකට පස්සේ සිහිය ආවා.']],
          ['صَلَّى عَدْنَانُ الظُّهْرَ <mark>ثُمَّ</mark> العَصْرَ.',['அத்னான் ளுஹர் தொழுதார், பிறகு அஸர்.','ʿAdnān prayed Ẓuhr, then ʿAṣr.','අද්නාන් ළුහ්ර් සලාතය ඉටු කළා, පසුව අසර්.']]])+
        conj('أَوْ','🍵 ／ ☕',['இரண்டில் ஒன்று: "அல்லது"','a choice: "or"','දෙකෙන් එකක්: "හෝ"'],[
          ['اِشْرَبْ شَايًا <mark>أَوْ</mark> قَهْوَةً.',['தேநீர் அல்லது கோப்பி குடி.','Drink tea or coffee.','තේ හෝ කෝපි බොන්න.']]])+
      '</div>'+
      '<div class="callout"><h3>'+TE('ஒரே வாக்கியம், மூன்று கதைகள்','One sentence, three stories','එකම වාක්‍යය, කතා තුනක්')+'</h3>'+
        trio('سَافَرْتُ إِلَى القَرْيَةِ <mark>وَ</mark>المَدِينَةِ','🏡 ❓ 🏙️',['இரண்டுக்கும் போனேன்; எது முதல் என்று தெரியாது.','I went to both; you cannot tell which came first.','දෙකටම ගියා; මුලින් කොයිකටද කියා කියන්න බැහැ.'])+
        trio('سَافَرْتُ إِلَى القَرْيَةِ <mark>فَ</mark>المَدِينَةِ','🏡 ⚡ 🏙️',['முதலில் கிராமம், உடனே நகரம்.','The village first, the city straight after.','මුලින් ගම, ඊට පස්සේම නගරය.'])+
        trio('سَافَرْتُ إِلَى القَرْيَةِ <mark>ثُمَّ</mark> المَدِينَةِ','🏡 ⏳ 🏙️',['முதலில் கிராமம், சிறிது காலம் கழித்து நகரம்.','The village first, the city some time later.','මුලින් ගම, ටික කාලෙකට පස්සේ නගරය.'])+
      '</div>'+
      '<div class="note-box">'+
        '<span class="arw" lang="ar" style="font-size:24px;line-height:1.8;text-align:right">أَتَسْكُنُ فِي المَدِينَةِ <mark>أَمْ</mark> فِي القَرْيَةِ؟</span>'+
        bi('கேள்வியில் "அல்லது" என்பதற்கு <span class="arw">أَمْ</span>. தமிழில் ஒவ்வொரு தேர்விலும் "-ஆ": நகரத்திலா, கிராமத்திலா வசிக்கிறாய்?','In a question, <span class="arw">أَمْ</span> does the job of "or": do you live in the city or in the village? Tamil and Sinhala mark each choice instead (-ஆ … -ஆ, -ද … -ද).','ප්‍රශ්නයක "හෝ" සඳහා <span class="arw">أَمْ</span>. සිංහලයේ සෑම තේරීමකටම "-ද": නගරයේද, ගමේද ඉන්නේ?')+
      '</div>'},

    /* 6 — big cities */
    {type:'html',title:['பெரிய நகரங்கள்: ஏன் இவ்வளவு கூட்டம்?','Big cities: why the crowds?','විශාල නගර: ඇයි මෙතරම් සෙනඟ?'],
     intro:['பாடம் 17 வாசிப்பு: சிலர் ஏன் பெரிய நகரங்களில் வாழ விரும்புகிறார்கள்?','The Lesson 17 reading: why do some people prefer life in big cities?','17 වන පාඩමේ කියවීම: සමහරු විශාල නගරවල ජීවත් වීමට කැමති ඇයි?'],
     html:'<div class="duo">'+
        '<div class="dpanel"><span class="emo">😷</span><span class="key arw" lang="ar" style="font-size:26px">مُشْكِلَات</span>'+TE('பிரச்சினைகள்','problems','ගැටලු')+chips([['🏭','التَّلَوُّث',['மாசு','pollution','දූෂණය']],['🚨','الجَرِيمَة',['குற்றம்','crime','අපරාධ']],['🚗','الاِزْدِحَام',['நெரிசல்','crowding','තදබදය']]],1)+'</div>'+
        '<div class="dpanel"><span class="emo">🌟</span><span class="key arw" lang="ar" style="font-size:22px">بِالرَّغْمِ مِنْ ذٰلِكَ</span>'+TE('அப்படியிருந்தும், இவை இருக்கின்றன','despite that, there are','එසේ වුවත්, මේවා ඇත')+chips([['🏭','مَصَانِع',['தொழிற்சாலைகள்','factories','කම්හල්']],['🎓','جَامِعَات',['பல்கலைக்கழகங்கள்','universities','විශ්වවිද්‍යාල']],['📚','مَكْتَبَات',['நூலகங்கள்','libraries','පුස්තකාල']],['🏥','مُسْتَشْفَيَات',['வைத்தியசாலைகள்','hospitals','රෝහල්']],['🎡','أَمَاكِنُ التَّرْوِيحِ',['பொழுதுபோக்கு இடங்கள்','places of recreation','විනෝද ස්ථාන']]])+'</div>'+
      '</div>'+
      '<div class="ladder">'+
        rung(1,'يَعِيشُ مَلَايِينُ النَّاسِ فِي المُدُنِ الكَبِيرَةِ.',['மில்லியன் கணக்கான மக்கள் பெரிய நகரங்களில் வாழ்கிறார்கள் (தோக்கியோ, லண்டன், நியூயோர்க், கெய்ரோ).','Millions of people live in big cities (Tokyo, London, New York, Cairo).','මිලියන ගණන් මිනිසුන් විශාල නගරවල ජීවත් වෙති (ටෝකියෝ, ලන්ඩන්, නිව්යෝර්ක්, කයිරෝ).'])+
        rung(2,'بِالرَّغْمِ مِنَ المُشْكِلَاتِ يُفَضِّلُهَا كَثِيرٌ مِنَ النَّاسِ.',['பிரச்சினைகள் இருந்தும் பலர் அவற்றையே விரும்புகிறார்கள்.','Despite the problems, many people prefer them.','ගැටලු තිබුණත් බොහෝ දෙනා ඒවාටම කැමතියි.'])+
        rung(3,'يُهَاجِرُ أَهْلُ الرِّيفِ، وَيَتْرُكُونَ الزِّرَاعَةَ وَالرَّعْيَ.',['கிராமப்புற மக்கள் இடம்பெயர்ந்து விவசாயத்தையும் கால்நடை மேய்ப்பையும் விட்டுவிடுகிறார்கள்; நகரப் பிரச்சினைகள் கூடுகின்றன.','Country people migrate and leave farming and herding, so the cities\' problems grow.','ගම්බද ජනයා සංක්‍රමණය වී ගොවිතැන සහ සතුන් රැකීම අතහරිති; එවිට නගරවල ගැටලු වැඩි වේ.'])+
        rung(4,'بَنَتْ بَعْضُ الدُّوَلِ المَصَانِعَ فِي الرِّيفِ، فَرَجَعَ كَثِيرٌ مِنَ النَّاسِ.',['சில நாடுகள் கிராமப்புறங்களில் தொழிற்சாலைகள் கட்டின; அதனால் பலர் திரும்பிப் போனார்கள்.','Some countries built factories in the countryside, so many people went back.','සමහර රටවල් ගම්බද ප්‍රදේශවල කම්හල් ඉදි කළා; එවිට බොහෝ දෙනා ආපසු ගියා.'])+
      '</div>'+
      '<div class="callout"><h3>'+TE('உலக மக்களில் நகரத்தில் வாழ்பவர்கள்','Share of the world living in cities','නගරවල ජීවත් වන ලෝක ජනගහනය')+'</h3>'+
        '<div style="display:flex;flex-direction:column;gap:10px">'+
          bar(2.5,'القَرْن ١٩',['சுமார் 2.5% (19ஆம் நூற்றாண்டு)','about 2.5% (19th century)','2.5% පමණ (19 වන සියවස)'])+
          bar(40,'١٩٨٠م',['சுமார் 40%','about 40%','40% පමණ'])+
          bar(50,'٢٠٠٠م',['50%, பாதிப் பேர்','50%, half','50%, අඩක්'])+
        '</div>'+
        bi('<span class="arw">مِلْيُون</span> = பத்து இலட்சம் · <span class="arw">مِلْيَار</span> = நூறு கோடி. உலக மக்கள்: 2000-இல் 6 <span class="arw">مِلْيَارَات</span>.','<span class="arw">مِلْيُون</span> = a million · <span class="arw">مِلْيَار</span> = a billion. World population: 6 <span class="arw">مِلْيَارَات</span> in 2000.','<span class="arw">مِلْيُون</span> = මිලියනයක් · <span class="arw">مِلْيَار</span> = බිලියනයක්. ලෝක ජනගහනය: 2000 දී <span class="arw">مِلْيَارَات</span> 6ක්.')+
      '</div>'+
      '<div class="breakdown"><div class="bd hl"><span class="arw" lang="ar">٢٫٥</span>'+TE('2.5: தசமக் குறி காற்புள்ளி போல் இருக்கும்','2.5: the decimal mark looks like a comma','2.5: දශම ලකුණ කොමාවක් වගේ')+'</div><div class="bd"><span class="arw" lang="ar">٠</span>'+TE('பூஜ்ஜியம்! புள்ளி அல்ல','zero! not a dot','බිංදුව! තිතක් නොවේ')+'</div></div>'+
      '<div class="duo">'+
        panel('📈','اِزْدَادَ',['தானாகவே கூடியது','it grew (by itself)','එය වැඩි වුණා (තනිවම)'],'اِزْدَادَ عَدَدُ السُّكَّانِ',['மக்கள் தொகை கூடியது','the population grew','ජනගහනය වැඩි වුණා'])+
        panel('➕','زَادَ',['ஒன்றைக் கூட்டினான்','he increased something','ඔහු යමක් වැඩි කළා'],'﴿رَبِّ زِدْنِي عِلْمًا﴾',['என் இறைவா! எனக்கு அறிவை அதிகப்படுத்து (தாஹா 20:114)','My Lord, increase me in knowledge (Ṭā-Hā 20:114)','මාගේ ස්වාමීනි, මට දැනුම වැඩි කරනු මැනව (තාහා 20:114)'])+
      '</div>'+
      '<div class="note-box">'+bi('தமிழிலும் இதே ஜோடி: கூடு (தானாக) / கூட்டு (ஒன்றை).','Tamil and Sinhala have the same pair: கூடு / கூட்டு, වැඩි වෙනවා / වැඩි කරනවා.','සිංහලයේද මේ යුගලයම ඇත: වැඩි වෙනවා (තනිවම) / වැඩි කරනවා (යමක්).')+'</div>'},

    /* 7 — asking the way */
    {type:'html',title:['வழி கேட்டல்','Asking the way','මඟ විමසීම'],
     intro:['பாடம் 18: ஒரு ஓட்டுநர் போக்குவரத்துப் பொலிஸிடம் பல்கலைக்கழகத்துக்கு வழி கேட்கிறார். முதலில் திசைகள்.','Lesson 18: a driver asks a traffic policeman the way to the university. First, the directions.','18 වන පාඩම: රියදුරෙක් රථවාහන පොලිස් නිලධාරියෙකුගෙන් විශ්වවිද්‍යාලයට මඟ අසයි. මුලින්ම දිශා.'],
     html:'<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:420px;margin:0 auto;justify-items:center;align-items:center">'+
        '<span></span>'+WB('شَمَال',['வடக்கு','north','උතුර'],'','⬆️')+'<span></span>'+
        WB('غَرْب',['மேற்கு','west','බටහිර'],'','⬅️')+'<span class="emo" style="font-size:56px">🧭</span>'+WB('شَرْق',['கிழக்கு','east','නැගෙනහිර'],'','➡️')+
        '<span></span>'+WB('جَنُوب',['தெற்கு','south','දකුණ'],'','⬇️')+'<span></span>'+
      '</div>'+
      '<div class="eq">'+WB('يَسَار',['இடது','left','වම'],'','👈')+WB('يَمِين',['வலது','right','දකුණ'],'','👉')+'</div>'+
      '<div class="note-box">'+bi('சிங்களத்தில் "දකුණ" என்பது வலதும் தெற்கும். அரபியிலும் பழைய தொடர்பு உண்டு: <span class="arw">شِمَال</span> (கஸ்ரா) = இடது கை, <span class="arw">شَمَال</span> (ஃபத்ஹா) = வடக்கு. குர்ஆனில் <span class="arw">أَصْحَابُ الشِّمَالِ</span> = இடப்பக்கத்தவர் (அல்-வாகிஆ 56:41).','In Sinhala, දකුණ means both "right" and "south". Arabic has an old link too: <span class="arw">شِمَال</span> (kasra) is the left hand, <span class="arw">شَمَال</span> (fatḥa) is north. The Qur\'an has <span class="arw">أَصْحَابُ الشِّمَالِ</span>, the people of the left (al-Wāqiʿah 56:41).','සිංහලයේ "දකුණ" යනු දකුණු අතත්, දකුණු දිශාවත්ය. අරාබියේද පැරණි සම්බන්ධයක් ඇත: <span class="arw">شِمَال</span> (කස්රා) = වම් අත, <span class="arw">شَمَال</span> (ෆත්හා) = උතුර. කුර්ආනයේ <span class="arw">أَصْحَابُ الشِّمَالِ</span> = වම් පැත්තේ අය (අල්-වාකිආ 56:41).')+'</div>'+
      '<div class="chat">'+
        DR('<mark>لَوْ سَمَحْتَ</mark>، أَيْنَ <mark>تَقَعُ</mark> الجَامِعَةُ؟',['தயவுசெய்து, பல்கலைக்கழகம் எங்கே அமைந்திருக்கிறது?','Excuse me, where is the university?','කරුණාකර, විශ්වවිද්‍යාලය පිහිටා තිබෙන්නේ කොහේද?'])+
        TM('تَقَعُ الجَامِعَةُ <mark>غَرْبَ</mark> المَدِينَةِ.',['பல்கலைக்கழகம் நகரத்தின் மேற்கே இருக்கிறது.','The university is in the west of the city.','විශ්වවිද්‍යාලය පිහිටා ඇත්තේ නගරයට බටහිරින්.'])+
        DR('كَيْفَ <mark>أَصِلُ إِلَيْهَا</mark> <mark>مِنْ فَضْلِكَ</mark>؟',['தயவுசெய்து, அங்கே எப்படிப் போய்ச் சேர்வது?','How do I get there, please?','කරුණාකර, මම එතැනට යන්නේ කොහොමද?'])+
      '</div>'+
      '<div class="note-box">'+bi('<span class="arw">لَوْ سَمَحْتَ</span> = <span class="arw">مِنْ فَضْلِكَ</span> = தயவுசெய்து. <span class="arw">تَقَعُ</span> (அமைந்துள்ளது) மற்றும் <span class="arw">مَوْقِع</span> (இருப்பிடம் 📍) ஒரே வேர்: தொலைபேசியில் "இருப்பிடத்தைப் பகிர்" = <span class="arw">مُشَارَكَةُ المَوْقِعِ</span>.','<span class="arw">لَوْ سَمَحْتَ</span> = <span class="arw">مِنْ فَضْلِكَ</span> = please. <span class="arw">تَقَعُ</span> (it is located) and <span class="arw">مَوْقِع</span> (location 📍) share a root: "share location" on a phone is <span class="arw">مُشَارَكَةُ المَوْقِعِ</span>.','<span class="arw">لَوْ سَمَحْتَ</span> = <span class="arw">مِنْ فَضْلِكَ</span> = කරුණාකර. <span class="arw">تَقَعُ</span> (පිහිටා ඇත) සහ <span class="arw">مَوْقِع</span> (පිහිටීම 📍) එකම මූලයෙනි: දුරකථනයේ "ස්ථානය බෙදාගන්න" = <span class="arw">مُشَارَكَةُ المَوْقِعِ</span>.')+'</div>'+
      '<div class="contrast">'+
        cp('m','🕌','الجَامِع',['பள்ளிவாசல் (ஜும்ஆ பள்ளி)','the (Friday) mosque','ජුම්මා පල්ලිය'])+
        cp('f','🎓','الجَامِعَة',['பல்கலைக்கழகம்','the university','විශ්වවිද්‍යාලය'])+
      '</div>'},

    /* 8 — the route */
    {type:'html',title:['பல்கலைக்கழகத்துக்கான வழி','The way to the university','විශ්වවිද්‍යාලයට මඟ'],
     intro:['பொலிஸ்காரரின் ஏழு அடிகளை வரைபடத்தில் பின்தொடருங்கள். ஓட்டுநர் ஒவ்வொரு கட்டளையையும் "நான்" வடிவத்தில் திருப்பிச் சொல்கிறார்.','Follow the traffic policeman\'s seven steps on the map. The driver repeats each order in the "I" form.','පොලිස් නිලධාරියාගේ පියවර හත සිතියමේ අනුගමනය කරන්න. රියදුරු සෑම නියෝගයක්ම "මම" ආකාරයෙන් නැවත කියයි.'],
     html:MAP+
      '<div class="ladder">'+
        rung(1,'اِتَّجِهْ غَرْبًا فِي شَارِعِ طَارِقِ بْنِ زِيَادٍ.',['தாரிக் இப்னு ஸியாத் வீதியில் மேற்கு நோக்கிச் செல்லுங்கள்.','Head west along Ṭāriq ibn Ziyād Street.','තාරික් ඉබ්නු සියාද් වීදියේ බටහිරට යන්න.'],'أَتَّجِهُ')+
        rung(2,'عِنْدَ الإِشَارَةِ الضَّوْئِيَّةِ الثَّالِثَةِ، انْعَطِفْ يَسَارًا فِي طَرِيقِ خَالِدِ بْنِ الوَلِيدِ.',['மூன்றாவது சமிக்ஞை விளக்கில் இடது பக்கம் திரும்பி காலித் இப்னுல் வலீத் வீதிக்குச் செல்லுங்கள்.','At the third traffic light, turn left into Khālid ibn al-Walīd Road.','තුන්වන සංඥා ලාම්පුවෙන් වමට හැරී ඛාලිද් ඉබ්නුල් වලීද් පාරට යන්න.'],'أَنْعَطِفُ')+
        rung(3,'عِنْدَ الدَّوَّارِ الأَوَّلِ، ارْجِعْ فِي الطَّرِيقِ نَفْسِهِ.',['முதல் சுற்றுவட்டத்தில் சுற்றி, அதே வீதியில் திரும்பி வாருங்கள்.','At the first roundabout, go round and come back along the same road.','පළමු වටරවුමෙන් හැරී, එම පාරේම ආපසු එන්න.'],'أَرْجِعُ')+
        rung(4,'عِنْدَ أَوَّلِ شَارِعٍ، اتَّجِهْ يَمِينًا.',['முதல் தெருவில் வலது பக்கம் செல்லுங்கள்.','At the first street, go right.','පළමු වීදියෙන් දකුණට යන්න.'],'أَتَّجِهُ')+
        rung(5,'تَجِدُ صَيْدَلِيَّةً عِنْدَ الزَّاوِيَةِ.',['மூலையில் ஒரு மருந்தகத்தைக் காண்பீர்கள்.','You will find a pharmacy on the corner.','කොනේ ෆාමසියක් ඔබට හමුවේවි.'],'أَجِدُ')+
        rung(6,'اِسْتَمِرَّ، وَبَعْدَ ٢٠٠ مِتْرٍ تَجِدُ المُسْتَشْفَى الجَامِعِيَّ عَنْ يَمِينِكَ.',['தொடர்ந்து செல்லுங்கள்; 200 மீற்றருக்குப் பின் உங்கள் வலது பக்கம் பல்கலைக்கழக வைத்தியசாலையைக் காண்பீர்கள்.','Keep going; after 200 metres you will find the university hospital on your right.','දිගටම යන්න; මීටර් 200කට පසු ඔබේ දකුණු පැත්තේ විශ්වවිද්‍යාල රෝහල හමුවේවි.'],'أَسْتَمِرُّ')+
        rung(7,'الجَامِعَةُ مُقَابِلَ المُسْتَشْفَى.',['பல்கலைக்கழகம் வைத்தியசாலைக்கு எதிரே இருக்கிறது.','The university is opposite the hospital.','විශ්වවිද්‍යාලය රෝහල ඉදිරිපිට (පාරෙන් එහා) ඇත.'],'شُكْرًا')+
      '</div>'+
      '<div class="dt-wrap"><table class="dt"><thead><tr><th>👮 '+ONE('கட்டளை (நீ)','order (you)','නියෝගය (ඔබ)')+'</th><th>🚗 '+ONE('பதில் (நான்)','reply (I)','පිළිතුර (මම)')+'</th><th>'+ONE('பொருள்','meaning','තේරුම')+'</th></tr></thead><tbody>'+
        '<tr><td class="a" lang="ar">اِتَّجِهْ</td><td class="a" lang="ar">أَتَّجِهُ</td><td>'+ONE('செல் · நான் செல்கிறேன்','go · I go','යන්න · මම යනවා')+'</td></tr>'+
        '<tr><td class="a" lang="ar">اِنْعَطِفْ</td><td class="a" lang="ar">أَنْعَطِفُ</td><td>'+ONE('திரும்பு · நான் திரும்புகிறேன்','turn · I turn','හැරෙන්න · මම හැරෙනවා')+'</td></tr>'+
        '<tr><td class="a" lang="ar">اِرْجِعْ</td><td class="a" lang="ar">أَرْجِعُ</td><td>'+ONE('திரும்பி வா · நான் திரும்பி வருகிறேன்','come back · I come back','ආපසු එන්න · මම ආපසු එනවා')+'</td></tr>'+
        '<tr><td class="a" lang="ar">اِسْتَمِرَّ</td><td class="a" lang="ar">أَسْتَمِرُّ</td><td>'+ONE('தொடர்ந்து செல் · நான் தொடர்கிறேன்','keep going · I keep going','දිගටම යන්න · මම දිගටම යනවා')+'</td></tr>'+
        '<tr><td class="a" lang="ar">تَجِدُ</td><td class="a" lang="ar">أَجِدُ</td><td>'+ONE('நீ காண்பாய் · நான் காண்பேன்','you find · I find','ඔබට හමුවේ · මට හමුවේ')+'</td></tr>'+
        '<tr><td class="a" lang="ar">عَنْ يَمِينِكَ</td><td class="a" lang="ar">عَنْ يَمِينِي</td><td>'+ONE('உன் வலது · என் வலது','on your right · on my right','ඔබේ දකුණේ · මගේ දකුණේ')+'</td></tr>'+
      '</tbody></table></div>'+
      '<div class="note-box">'+bi('<span class="arw">الطَّرِيقُ نَفْسُهُ</span> = அதே வீதி. பெயர்ச்சொல்லுக்குப் பின் வரும் <span class="arw">نَفْس</span> "அதே" என்று பொருள்படும்; இங்கே "ஆன்மா" அல்ல.','<span class="arw">الطَّرِيقُ نَفْسُهُ</span> = the same road. After a noun, <span class="arw">نَفْس</span> means "the same", not "soul".','<span class="arw">الطَّرِيقُ نَفْسُهُ</span> = එම පාරම. නාම පදයකට පසු <span class="arw">نَفْس</span> යනු "එම…ම" යන්නයි; මෙහි "ආත්මය" නොවේ.')+'</div>'},

    /* 9 — three cities */
    {type:'html',title:['உலகின் பெரிய நகரங்கள் சில','Some of the world\'s great cities','ලෝකයේ මහා නගර කිහිපයක්'],
     intro:['பாடம் 19: <span class="arw">مِنْ مُدُنِ العَالَمِ الكُبْرَى</span>. மூன்று நகரங்கள், ஒவ்வொன்றுக்கும் ஒரு பந்தி. மக்கள் தொகை எண்கள் பாடநூலில் உள்ளவை (பழையவை).','Lesson 19: <span class="arw">مِنْ مُدُنِ العَالَمِ الكُبْرَى</span>. Three cities, one paragraph each. The population figures are the textbook\'s (they are old).','19 වන පාඩම: <span class="arw">مِنْ مُدُنِ العَالَمِ الكُبْرَى</span>. නගර තුනක්, එකකට ඡේදයක් බැගින්. ජනගහන සංඛ්‍යා පෙළපොතේ ඇති ඒවා (පැරණි ඒවා).'],
     html:'<div class="exlist">'+

    /* 11 — reading test */
    {type:'html',title:['வாசிப்புச் சோதனை: வேலைக்குப் போகும் மனைவி','Reading test: the working wife','කියවීමේ පරීක්ෂණය: රැකියාවට යන බිරිඳ'],
     intro:['<span class="arw">اِخْتَبِرْ نَفْسَكَ ٢</span>, பக்கம் ٩٢. ஒரு கணவர் தன் பிரச்சினையைச் சொல்கிறார். சில பதில்கள் நேரடியாக எழுதப்பட்டுள்ளன; சிலவற்றை நீங்களே ஊகிக்க வேண்டும்.','<span class="arw">اِخْتَبِرْ نَفْسَكَ ٢</span>, page ٩٢. A husband describes his problem. Some answers are written in the passage; others you have to work out.','<span class="arw">اِخْتَبِرْ نَفْسَكَ ٢</span>, ٩٢ වන පිටුව. සැමියෙක් තම ගැටලුව කියයි. සමහර පිළිතුරු පාඨයේ ලියා ඇත; අනෙක් ඒවා ඔබම සොයා ගත යුතුයි.'],

        WB('٤',['பதிலைப் பாடத்தில் தேடு','find each answer in the text','පිළිතුර පාඨයේ සොයන්න'],'add','✅')+
      '</div>'+
      '<div class="exlist">'+
        ex('تَخْرُجُ زَوْجَتِي كُلَّ يَوْمٍ فِي الصَّبَاحِ، وَلَا تَرْجِعُ إِلَّا فِي <mark>السَّاعَةِ الخَامِسَةِ</mark> مَسَاءً، هٰذِهِ مُشْكِلَتِي مَعَهَا.',['என் மனைவி தினமும் காலையில் வெளியே போகிறாள்; மாலை ஐந்து மணிக்குத்தான் திரும்புகிறாள். இதுதான் அவளுடன் எனக்குள்ள பிரச்சினை.','My wife goes out every morning and does not come back until five in the evening. This is my problem with her.','මගේ බිරිඳ දිනපතා උදේ පිටත යනවා; හවස පහට මිස ආපසු එන්නේ නැහැ. ඇය සමඟ මගේ ගැටලුව මේකයි.'])+
        ex('نَحْنُ نَتَنَاوَلُ الوَجَبَاتِ خَارِجَ البَيْتِ؛ لِأَنَّ زَوْجَتِي <mark>لَا تَجِدُ وَقْتًا</mark> لِإِعْدَادِ الطَّعَامِ.',['நாங்கள் வீட்டுக்கு வெளியே சாப்பிடுகிறோம்; ஏனென்றால் என் மனைவிக்குச் சமைக்க நேரம் கிடைப்பதில்லை.','We eat our meals outside, because my wife finds no time to prepare food.','අපි කෑම කන්නේ ගෙදරින් පිටත; මොකද මගේ බිරිඳට කෑම හදන්න වෙලාවක් නැහැ.'])+
        ex('وَأَنَا أَغْسِلُ مَلَابِسِي وَمَلَابِسَ <mark>ابْنِنَا</mark> وَحْدِي، وَأُنَظِّفُ البَيْتَ <mark>أَحْيَانًا</mark>.',['நானே என் உடைகளையும் எங்கள் மகனின் உடைகளையும் கழுவுகிறேன்; சில நேரங்களில் வீட்டையும் சுத்தம் செய்கிறேன்.','I wash my clothes and our son\'s clothes by myself, and I sometimes clean the house.','මම තනියම මගේ ඇඳුම් සහ අපේ පුතාගේ ඇඳුම් හෝදනවා; සමහර වෙලාවට ගෙදරත් අස් කරනවා.'])+
        ex('وَلَا أَجِدُ وَقْتًا لِلْحَدِيثِ مَعَهَا؛ لِأَنَّهَا عِنْدَمَا تَرْجِعُ تَكُونُ مُتْعَبَةً، ثُمَّ <mark>أَخْرُجُ لِلْمُسْتَشْفَى مَرَّةً ثَانِيَةً</mark> بَعْدَ <mark>نِصْفِ سَاعَةٍ</mark> مِنْ حُضُورِهَا.',['அவளுடன் பேச எனக்கு நேரம் இல்லை; அவள் திரும்பும்போது களைப்பாக இருக்கிறாள். அவள் வந்து அரை மணி நேரத்தில் நான் மீண்டும் வைத்தியசாலைக்குப் போகிறேன்.','I find no time to talk with her: when she comes back she is tired, then I go out to the hospital a second time, half an hour after she arrives.','ඇය සමඟ කතා කරන්න මට වෙලාවක් නැහැ; ඇය ආපසු එනකොට මහන්සියි. ඇය ආවට පැය භාගයකට පස්සේ මම ආයෙත් රෝහලට යනවා.'])+
        ex('أَمَّا فِي عُطْلَةِ الأُسْبُوعِ، فَهِيَ تُحِبُّ أَنْ تَزُورَ الأَهْلَ وَالصَّدِيقَاتِ، أَوْ تَذْهَبَ إِلَى السُّوقِ، أَوْ <mark>تُحَضِّرَ دُرُوسَ الأُسْبُوعِ القَادِمِ</mark>.',['வார விடுமுறையில் அவள் உறவினர்களையும் தோழிகளையும் சந்திக்க, அல்லது சந்தைக்குப் போக, அல்லது அடுத்த வாரப் பாடங்களைத் தயாரிக்க விரும்புகிறாள்.','At the weekend she likes to visit family and friends, or go to the market, or prepare next week\'s lessons.','සති අන්තයේ ඇය ඥාතීන් සහ යෙහෙළියන් බලන්න, නැත්නම් වෙළඳපොළට යන්න, නැත්නම් ලබන සතියේ පාඩම් සූදානම් කරන්න කැමතියි.'])+

        '<div class="wbox"><span class="emo" style="font-size:34px;line-height:1.6">⏱️</span>'+TE('அரை மணி','half an hour','පැය භාගයක්')+'</div><span class="op">→</span>'+

        clue('١',['அவளுடைய வேலை? பாடங்களைத் தயாரிப்பது ஆசிரியையின் வேலை.','Her job? Preparing lessons is a teacher\'s work.','ඇගේ රැකියාව? පාඩම් සූදානම් කිරීම ගුරුවරියකගේ වැඩයි.'],'مُدَرِّسَةً','تُحَضِّرُ دُرُوسَ الأُسْبُوعِ القَادِمِ')+

        clue('١٠',['குடும்பம்? "எங்கள் மகன்", "எங்கள் மகள்" அல்ல: கணவன், மனைவி, ஒரு மகன்.','The family? "Our son", not "our daughter": husband, wife and one son.','පවුල? "අපේ පුතා", "අපේ දුව" නොවේ: සැමියා, බිරිඳ, එක් පුතෙක්.'],'زَوْجٌ وَزَوْجَةٌ وَابْنٌ','ابْنِنَا ≠ ابْنَتِنَا')+

        panel('➡️','إِلَى عَمَلِهِ',['அவன் வேலைக்கு','to his work','ඔහුගේ වැඩට'])+
